openapi: 3.0.3
info:
  title: DEMI Central Repository API (demi-api)
  description: |-
    Central authoritative storage and spatial search engine for projects, documents, and
    administrative region boundaries.

    NOT THE CONTRACT. This file is hand-maintained, covers 29 of the 43 paths in src/http/routes.js
    (39 of its 57 operations), and has drifted from what the API actually serves. Undocumented here:
    /config, /search/summary, /boundaries, /admin/api-keys and more. GET /s/{code} is a
    browser redirect rather than an API call and is documented in the wiki. The routes in
    src/http/routes.js are authoritative; read them, or the endpoint itself, before relying on
    anything here.
  version: 1.0.0
paths:
  /api/search:
    get:
      summary: Search document content
      description: Queries Azure AI Search for matching projects, documents or text chunks.
      parameters:
        - name: q
          in: query
          required: true
          description: Search query string.
          schema:
            type: string
        - name: project
          in: query
          required: false
          description: Filter results by project ID.
          schema:
            type: string
      responses:
        '200':
          description: Search results containing matched chunks and metadata.
        '400':
          description: Missing search query parameter.

  /api/me:
    get:
      summary: Caller's own access
      description: >-
        What the caller's credential (or lack of one) resolves to. Unauthenticated, like
        /api/config — an anonymous caller gets the public tier, not a 401.
      responses:
        '200':
          description: The caller's roles, visibility level and access tier.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'

  /api/access/simulate:
    post:
      summary: What a hypothetical caller could see
      description: >-
        Runs the access engine over a described caller and returns the answer, without reading any
        data and without granting the real caller anything. Authenticated: the body describes
        somebody else, but the answer is the whole field catalog and a role-privilege oracle.
      security:
        - ApiKeyAuth: []
        - BearerAuth: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AccessSimulateRequest'
      responses:
        '200':
          description: The level, ladder rows and field visibility this caller would get.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessSimulateResponse'
        '400':
          description: Unknown field, malformed list, or a credential the registry would refuse.
        '401':
          description: Unauthorized.

  /api/projects:
    get:
      summary: Retrieve projects
      description: Get all projects, optionally filtered by spatial administrative region containment. Restricted to published projects for unauthenticated public requests.
      parameters:
        - name: region
          in: query
          required: false
          description: Name of the region shapefile boundary to execute point-in-polygon containment check.
          schema:
            type: string
        - name: pageSize
          in: query
          required: false
          description: >-
            Rows per page. Unauthenticated requests are capped at 100 and asking for more is
            refused with 400; authenticated requests may ask for up to 1000. Omitting it returns
            the cap that applies to the caller.
          schema:
            type: integer
            minimum: 1
            maximum: 1000
      responses:
        '200':
          description: A list of projects.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Project'
        '400':
          description: pageSize above 100 on an unauthenticated request.
    post:
      summary: Create project
      description: >-
        Ingest a new project with name and geographic centroid coordinates. The project is
        admitted at level 1 (team only): `isPublished` and `read` in the body are ignored, not
        refused. Raising a project's level is `PUT /api/projects/{id}/level`.
      security:
        - ApiKeyAuth: []
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProjectInput'
      responses:
        '201':
          description: Project successfully created.
        '400':
          description: Missing required fields.
        '401':
          description: Unauthorized.
        '403':
          description: Forbidden. Insufficient roles.

  /api/projects/{id}:
    get:
      summary: Get project by ID
      description: >-
        Get details of a single project. Returns 404 to unauthenticated users if unpublished.
        Which FIELDS the response carries depends on the caller's visibility level, so a
        privileged caller sees a superset of the anonymous response.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Project document.
        '404':
          description: Project not found.
    put:
      summary: Update project
      description: >-
        Modify an existing project's metadata or coordinates. It does not change visibility:
        `isPublished` and `read` in the body are ignored and the stored ACL is kept. Use
        `PUT /api/projects/{id}/level`.
      security:
        - ApiKeyAuth: []
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProjectInput'
      responses:
        '200':
          description: Project successfully updated.
        '400':
          description: Body contains a field the caller cannot see, or a vis key.
        '401':
          description: Unauthorized.
        '404':
          description: Project not found.
    delete:
      summary: Delete project
      description: Permanently remove a project from the master directory.
      security:
        - ApiKeyAuth: []
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Project successfully deleted.
        '401':
          description: Unauthorized.
        '404':
          description: Project not found.

  /api/projects/{id}/level:
    put:
      summary: Set a project's ladder level
      description: >-
        Move a project on the row plane (docs/rbac-architecture.md §1, "Widening is an act").
        Nothing else raises a record's level — no job, no push, no merge. Every move is audited as
        `record.widen` or `record.narrow`, and the change cascades to the project's documents.
        Pulling a project back from level 4 needs the `sysadmin` role and is audited as
        `record.takedown`; narrowing the row alone does not finish a takedown, see
        `docs/takedown-runbook.md`.
      security:
        - ApiKeyAuth: []
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [level]
              properties:
                level:
                  type: integer
                  enum: [1, 2, 3, 4]
                  description: >-
                    1 team only, 2 all EAO, 3 all IDIR, 4 public. Level 0 is the sealed
                    compartment and is not reachable here.
                confirm:
                  type: boolean
                  description: Required and `true` for level 4.
                reason:
                  type: string
                  description: Required and non-empty for level 4; optional on every other move.
      responses:
        '200':
          description: Project moved to the requested level.
        '400':
          description: level is outside 1-4, or level 4 was sent without `confirm` or a `reason`.
        '401':
          description: Unauthorized.
        '403':
          description: Only sysadmin may pull a record back from level 4.
        '404':
          description: Project not found.

  /api/projects/{id}/visibility:
    patch:
      summary: Classify project fields
      description: >-
        Set per-field visibility dials on one project. `sysadmin` only — a dial is access policy,
        not content, so the ordinary PUT refuses a `vis` key at every level. A dial never raises a
        field above its catalogued `maxVis`, and it is independent of the project's own record
        level. A level of `null` removes the dial and the field falls back to its `defaultVis`;
        a field the body does not name keeps the dial it had.
      security:
        - ApiKeyAuth: []
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [vis]
              properties:
                vis:
                  type: object
                  description: Field name to level. At most 10 fields per request.
                  additionalProperties:
                    type: integer
                    nullable: true
                    minimum: 0
                    maximum: 4
              example:
                vis:
                  complianceLead: 2
                  projectLeadEmail: null
      responses:
        '200':
          description: The updated project, redacted for the caller.
        '400':
          description: >-
            An uncatalogued field, a level outside 0..maxVis for that field, a non-integer level,
            more than 10 fields, or an empty vis object.
        '403':
          description: Forbidden. Requires role sysadmin.
        '404':
          description: Project not found.

  /api/documents:
    get:
      summary: Retrieve documents
      description: Get all documents, optionally filtered by spatial administrative region of their parent project. Restricts to published documents for unauthenticated public requests.
      parameters:
        - name: region
          in: query
          required: false
          schema:
            type: string
        - name: pageSize
          in: query
          required: false
          description: >-
            Rows per page. Unauthenticated requests are capped at 100 and asking for more is
            refused with 400; authenticated requests may ask for up to 1000. Omitting it returns
            the cap that applies to the caller.
          schema:
            type: integer
            minimum: 1
            maximum: 1000
      responses:
        '200':
          description: A list of documents.
        '400':
          description: pageSize above 100 on an unauthenticated request.
    post:
      summary: Create document
      description: >-
        Register a document metadata record. The document is admitted at level 1 (team only),
        capped at its parent project's level: `isPublished` and `read` in the body are ignored,
        not refused. Raising a document's level is `PUT /api/documents/{id}/level`.
      security:
        - ApiKeyAuth: []
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DocumentInput'
      responses:
        '201':
          description: Document successfully created.
        '401':
          description: Unauthorized.

  /api/documents/extract:
    post:
      summary: Upload and extract document
      description: >-
        Uploads document file to S3 MinIO and queues/processes text extraction. The new record is
        admitted at level 1 (team only), like `POST /api/documents`; widen it with
        `PUT /api/documents/{id}/level`.
      security:
        - ApiKeyAuth: []
        - BearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                upfile:
                  type: string
                  format: binary
                project:
                  type: string
                displayName:
                  type: string
      responses:
        '200':
          description: Document successfully uploaded and parsed.
        '401':
          description: Unauthorized.

  /api/documents/{id}:
    get:
      summary: Get document by ID
      description: >-
        Retrieve details of a single document. Which FIELDS the response carries depends on the
        caller's visibility level, so a privileged caller sees a superset of the anonymous
        response.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Document successfully retrieved.
        '404':
          description: Document not found.
    put:
      summary: Update document
      description: Modify document metadata, parent project reference, or publication state.
      security:
        - ApiKeyAuth: []
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DocumentInput'
      responses:
        '200':
          description: Document successfully updated.
        '400':
          description: Body contains a field the caller cannot see, or a vis key.
        '401':
          description: Unauthorized.
    delete:
      summary: Delete document
      description: Delete a document and its parsed chunks.
      security:
        - ApiKeyAuth: []
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Document successfully deleted.
        '401':
          description: Unauthorized.

  /api/documents/{id}/level:
    put:
      summary: Set a document's ladder level
      description: >-
        Move a document on the row plane (docs/rbac-architecture.md §1, "Widening is an act").
        A document may not out-rank its project, so a widen past the project's own level is
        refused. Every move is audited as `record.widen` or `record.narrow`. Pulling a document
        back from level 4 needs the `sysadmin` role and is audited as `record.takedown`; narrowing
        the row alone does not finish a takedown, see `docs/takedown-runbook.md`.
      security:
        - ApiKeyAuth: []
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: project
          in: query
          required: false
          schema:
            type: string
          description: Parent project id, the partition key. Avoids a cross-partition lookup.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [level]
              properties:
                level:
                  type: integer
                  enum: [1, 2, 3, 4]
                  description: >-
                    1 team only, 2 all EAO, 3 all IDIR, 4 public. Level 0 is the sealed
                    compartment and is not reachable here.
                confirm:
                  type: boolean
                  description: Required and `true` for level 4.
                reason:
                  type: string
                  description: Required and non-empty for level 4; optional on every other move.
      responses:
        '200':
          description: Document moved to the requested level.
        '400':
          description: level is outside 1-4, or level 4 was sent without `confirm` or a `reason`.
        '401':
          description: Unauthorized.
        '403':
          description: Only sysadmin may pull a record back from level 4.
        '404':
          description: Document not found.
        '409':
          description: The document would out-rank its project.

  /api/documents/{id}/published:
    put:
      deprecated: true
      summary: Publish or unpublish a document (deprecated)
      description: >-
        Deprecated alias for `PUT /api/documents/{id}/level`: `{ "isPublished": true }` is level 4
        and `{ "isPublished": false }` is level 2. It runs the same guards, so unpublishing a
        public document needs the `sysadmin` role and is audited as `record.takedown` — see
        `docs/takedown-runbook.md`. Use the level route.
      security:
        - ApiKeyAuth: []
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: project
          in: query
          required: false
          schema:
            type: string
          description: Parent project id, the partition key.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [isPublished]
              properties:
                isPublished:
                  type: boolean
                reason:
                  type: string
                  description: Recorded on the audit row when publishing.
      responses:
        '200':
          description: Document visibility changed.
        '401':
          description: Unauthorized.
        '403':
          description: Only sysadmin may unpublish a public document.
        '404':
          description: Document not found.
        '409':
          description: The document's project is not published.

  /api/bulk-downloads:
    post:
      summary: Request a bulk document download
      description: >-
        Asks for many documents as one download. Exactly ONE id is answered inline with the same
        presigned URL `GET /api/documents/{id}/download` hands out (`single: true`, no job); two or
        more start an asynchronous job — 202 now, poll `GET /api/bulk-downloads/{id}`, download the
        zip parts from the presigned URLs it returns once the status is `ready`.

        Ids the caller may not see are dropped by the read ACL, and so are documents with no
        stored file, so `documentCount` is what will actually be zipped and may be lower than the
        number asked for. Caps REFUSE rather than truncate: 100 documents anonymously, 2500
        authenticated, and 20 GiB in total. The zip is split into ~2 GiB numbered parts rather than
        refused. Three jobs may be in flight per requester and 20 may be started in 24 hours.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [documentIds]
              additionalProperties: false
              properties:
                documentIds:
                  type: array
                  minItems: 1
                  items:
                    type: string
      responses:
        '200':
          description: One id only — a direct presigned download, never a zip.
          content:
            application/json:
              schema:
                type: object
                properties:
                  url: { type: string }
                  expiresIn: { type: integer, description: Seconds until the URL expires. }
                  fileName: { type: string }
                  displayName: { type: string, nullable: true }
                  single: { type: boolean, enum: [true] }
        '202':
          description: The job was recorded and queued.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BulkDownloadAccepted'
        '400':
          description: >-
            An unknown body parameter, a malformed `documentIds`, more documents than the caller's
            cap allows, or a selection over the total byte limit.
        '404':
          description: None of the requested documents are visible to this caller.
        '429':
          description: >-
            This requester is at a quota: either the maximum number of jobs in flight, or the
            number of jobs one requester may start in 24 hours. Both are counted per API key, per
            signed-in user, or per client address for anonymous callers. A job gives its in-flight
            slot back when it is refused, when it finishes, or when it runs out of retries — a
            failure that will be retried keeps its slot. The daily count only resets 24 hours after
            the requester's first job of the window.
        '503':
          description: >-
            Bulk download is disabled in this environment (no queue configured), or the job was
            recorded but could not be queued — in which case it is marked `failed` rather than left
            waiting for a worker that will never come.

  /api/bulk-downloads/{id}:
    get:
      summary: Bulk download status
      description: >-
        The job id is the capability. An anonymous job is answered to whoever holds its id; a job
        made by an authenticated caller is answered only to that caller, and anyone else gets 404
        rather than 403. A `running` job whose worker stopped reporting for longer than the queue's
        visibility timeout is reported as `failed`.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Job status, with one presigned URL per zip part once it is ready.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BulkDownloadStatus'
        '404':
          description: >-
            No such job, it belongs to another caller, or the id is not a job id. The three are
            deliberately indistinguishable.

  /api/sealed:
    post:
      summary: Seal a record
      description: >-
        Write a document into the sealed compartment — level 0
        (docs/rbac-architecture.md §1, "Level 0"). The row is an ordinary document in the ordinary
        container carrying `read: ['compliance']`, and only these routes read it — every other
        route excludes level 0 from every caller, the privileged ones, `systemAccess()` and the
        `compliance` holder alike. Requires the `compliance` role; every other role, `sysadmin`
        included, gets 403. Audited as `sealed.create`.
      security:
        - ApiKeyAuth: []
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [project, displayName, s3Key]
              properties:
                project:
                  type: string
                  description: Parent project id. The project must exist; its own level is not a cap.
                displayName:
                  type: string
                s3Key:
                  type: string
      responses:
        '201':
          description: Record sealed.
        '400':
          description: project, displayName or s3Key is missing.
        '401':
          description: Unauthorized.
        '403':
          description: The caller does not hold the compliance role.
        '404':
          description: Parent project not found.
    get:
      summary: List sealed records
      description: >-
        Ids, seal timestamps and titles of the sealed records this caller may read — enough to find
        a record and ask for it, never enough to read one. Audited as `sealed.list`.
      security:
        - ApiKeyAuth: []
        - BearerAuth: []
      parameters:
        - name: pageSize
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 1000
        - name: continuationToken
          in: query
          required: false
          schema:
            type: string
      responses:
        '200':
          description: A list of `{ id, projectId, sealedAt, title }`.
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id: { type: string }
                    projectId: { type: string }
                    sealedAt: { type: string, format: date-time }
                    title: { type: string }
        '401':
          description: Unauthorized.
        '403':
          description: The caller does not hold the compliance role.

  /api/sealed/{id}:
    get:
      summary: Read a sealed record
      description: >-
        The record, redacted by the field catalog like any other document read. A record that is
        not sealed answers 404 here: this route is the compartment, not a second door onto the
        ladder. Audited as `sealed.read` — reads are audited here and nowhere else in DEMI.
      security:
        - ApiKeyAuth: []
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: project
          in: query
          required: false
          schema:
            type: string
          description: Parent project id, the partition key. Avoids a cross-partition lookup.
      responses:
        '200':
          description: The sealed record.
        '401':
          description: Unauthorized.
        '403':
          description: The caller does not hold the compliance role.
        '404':
          description: No sealed record with this id.

  /api/sealed/{id}/download:
    get:
      summary: Presigned download for a sealed record's bytes
      description: >-
        The same short-lived presigned URL `GET /api/documents/{id}/download` hands out, gated the
        same way `GET /api/sealed/{id}` is: only the compartment's own access opens a level-0 row.
        A record that is not sealed answers 404 here, same as the metadata read. Audited as
        `sealed.download`.
      security:
        - ApiKeyAuth: []
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: project
          in: query
          required: false
          schema:
            type: string
          description: Parent project id, the partition key. Avoids a cross-partition lookup.
      responses:
        '200':
          description: A presigned download URL.
          content:
            application/json:
              schema:
                type: object
                properties:
                  url: { type: string }
                  expiresIn: { type: integer, description: Seconds until the URL expires. }
                  fileName: { type: string }
                  displayName: { type: string, nullable: true }
        '401':
          description: Unauthorized.
        '403':
          description: The caller does not hold the compliance role.
        '404':
          description: No sealed record with this id, or it has no stored file.

  /api/sealed/{id}/release:
    post:
      summary: Release a sealed record to level 1
      description: >-
        The ONLY exit from the sealed compartment — `PUT /api/documents/{id}/level` refuses level 0
        in both directions. Rewrites `read[]` to level 1 (team only), re-derives the record's chunk
        ACLs and its search-index row, and audits `sealed.release` with the case number and the
        decision. One compliance holder is enough; two-person release is a later policy toggle.
        The C&E lead is not emailed — this repo has no mailer, so the intent is logged.
      security:
        - ApiKeyAuth: []
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: project
          in: query
          required: false
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [caseNumber, decision]
              properties:
                caseNumber:
                  type: string
                decision:
                  type: string
      responses:
        '200':
          description: Record released to level 1.
        '400':
          description: caseNumber or decision is missing or empty.
        '401':
          description: Unauthorized.
        '403':
          description: The caller does not hold the compliance role.
        '404':
          description: No sealed record with this id.
        '500':
          description: Released, but the record's extracted text was not fully updated.

  /api/eagle/projects/{eagleId}:
    put:
      summary: Mirror a project from eagle-api
      description: |-
        Receives one project pushed by eagle-api on every write it makes, keyed by the Eagle
        `_id`. The body carries the RAW Eagle record — DEMI holds the merge rules, so the same
        record produces the same row here as a re-seed would. Idempotent: the same eagleId
        replaces. The DEMI id is the Track project id when the project is already matched to
        Track, otherwise `eagle-<eagleId>`. Enrichment blocks under `sources` other than
        `track`/`eagle` are preserved, and a change in publication state cascades onto the
        project's documents.
      security:
        - ApiKeyAuth: []
        - BearerAuth: []
      parameters:
        - name: eagleId
          in: path
          required: true
          description: The Eagle `_id` of the project. Must equal `doc._id` in the body.
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EaglePush'
      responses:
        '200':
          description: Project mirrored.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EaglePushResult'
        '400':
          description: |-
            Body is not `{ doc }`, `doc._id` disagrees with the path, or the record names no
            legislation block that holds content — a nameless project would otherwise be mirrored
            as published.
        '401':
          description: Unauthorized.
        '403':
          description: |-
            Forbidden. The credential is read-only — the mirror needs `demi-service-write` or
            higher.

  /api/eagle/documents/{eagleId}:
    put:
      summary: Mirror a document from eagle-api
      description: |-
        Receives one document pushed by eagle-api, keyed by the Eagle `_id`. The body carries the
        RAW Eagle record plus the labels for its four List ObjectId references. Idempotent: the
        same eagleId replaces. Two things are NOT taken from the push — extraction state, carried
        off the row already in DEMI, and the ACL, which is the lower of the document's own ladder
        level and its parent project's.
      security:
        - ApiKeyAuth: []
        - BearerAuth: []
      parameters:
        - name: eagleId
          in: path
          required: true
          description: The Eagle `_id` of the document. Must equal `doc._id` in the body.
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EaglePush'
      responses:
        '200':
          description: Document mirrored.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EaglePushResult'
        '400':
          description: Body is not `{ doc }`, or `doc._id` disagrees with the path.
        '401':
          description: Unauthorized.
        '403':
          description: |-
            Forbidden. The credential is read-only — the mirror needs `demi-service-write` or
            higher.
        '404':
          description: The document's parent project is not in DEMI.

  /api/links:
    get:
      summary: List short links
      description: |-
        Every short link, newest first. Read-only, so any authenticated caller may list — the rows
        carry no ACL and nothing secret. Each row carries `shortUrl` already composed, so a client
        never builds it from a second copy of the base URL.
      security:
        - ApiKeyAuth: []
        - BearerAuth: []
      responses:
        '200':
          description: The short links.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ShortLink'
        '401':
          description: Unauthorized.
    post:
      summary: Mint a short link
      description: |-
        Creates `<LINK_BASE_URL>/s/<code>` pointing at `url`. The destination must be `https:`,
        carry no credentials, and its hostname must equal or be a dot-suffix of an entry in
        `LINK_ALLOWED_HOSTS` (default `gov.bc.ca`) — checked here and never again at redirect time.

        Omit `code` and one is generated. Supply it for a vanity alias; a taken one is refused
        with 409 rather than replaced.
      security:
        - ApiKeyAuth: []
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ShortLinkInput'
      responses:
        '201':
          description: Short link created.
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: string
                  shortUrl:
                    type: string
                  url:
                    type: string
        '400':
          description: |-
            The destination failed validation, `note` is over 200 characters, or a supplied `code`
            is not 3-64 characters of `a-z0-9_-` (case-insensitive). The body says which.
        '401':
          description: Unauthorized.
        '403':
          description: Forbidden. The credential is read-only.
        '409':
          description: The supplied `code` is already in use.

  /api/links/{code}:
    put:
      summary: Repoint a short link
      description: |-
        Changes where an existing code sends the public. The redirect answers `no-store`, so a
        repoint takes effect on the next request — which is the reason the redirect is a 302.
      security:
        - ApiKeyAuth: []
        - BearerAuth: []
      parameters:
        - name: code
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - url
              properties:
                url:
                  type: string
      responses:
        '200':
          description: The updated short link.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShortLink'
        '400':
          description: The destination failed validation.
        '401':
          description: Unauthorized.
        '403':
          description: Forbidden. The credential is read-only.
        '404':
          description: Short link not found.
    delete:
      summary: Delete a short link
      description: |-
        Hard delete — the code stops resolving immediately and may be minted again. The audit row
        is the record that the link existed.
      security:
        - ApiKeyAuth: []
        - BearerAuth: []
      parameters:
        - name: code
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Short link deleted.
        '401':
          description: Unauthorized.
        '403':
          description: Forbidden. The credential is read-only.
        '404':
          description: Short link not found.

  /api/me/data:
    get:
      summary: Everything stored for the calling user
      description: |-
        One bootstrap read: preferences and saved map areas in a single response. The owner is
        taken from the bearer token, never from the request — there is no way to ask for another
        user's data. `prefs` falls back to the defaults (`map`, 6) when the user has saved none.

        A future stored type appears here without a new route.
      security:
        - BearerAuth: []
      responses:
        '200':
          description: The caller's data.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MyData'
        '401':
          description: Unauthorized.

  /api/me/lassos:
    put:
      summary: Save a map area
      description: |-
        Upsert by name: the name is slugified to `a-z0-9-` and that slug is the key, so saving the
        same name twice replaces the area rather than adding a second one. No `requireWrite` — this
        is the caller's own scratch data, so a read-only staff account may still save its own.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, ring]
              properties:
                name:
                  type: string
                  maxLength: 80
                ring:
                  type: array
                  items:
                    type: array
                    items:
                      type: number
      responses:
        '200':
          description: The saved area.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LassoItem'
        '400':
          description: |-
            The name is empty or over 80 characters, the ring is not 3-500 in-range
            `[longitude, latitude]` pairs, the body is over 64 KB, an unknown field was sent, or
            the user already holds 50 saved areas. The body says which.
        '401':
          description: Unauthorized.

  /api/me/lassos/{slug}:
    delete:
      summary: Delete a saved map area
      description: Deletes from the caller's own partition only.
      security:
        - BearerAuth: []
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Saved area deleted.
        '401':
          description: Unauthorized.
        '404':
          description: The caller has no saved area with that slug.

  /api/me/prefs:
    put:
      summary: Save the calling user's preferences
      description: |-
        Whole-object write of `{landing, perPage}`. Stored server-side so the preference follows
        the user across devices; the frontend keeps localStorage as a cache and the server value
        wins on load.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Prefs'
      responses:
        '200':
          description: The stored preferences.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Prefs'
        '400':
          description: '`landing` is not a known screen key, `perPage` is not 6, 12 or 24, or an unknown field was sent.'
        '401':
          description: Unauthorized.

  /api/credentials:
    post:
      summary: Grant a Selected Credential
      description: |-
        Gives one named party sight of specified records at levels 1-3, for a fixed window.
        `sysadmin` only. The grant changes no record, changes nobody else's access and never
        touches the field plane — the holder's own level still decides which attributes they see.

        `end` is required and enforced here rather than at login; 90 days is what the UI offers,
        not a cap. Renewal is the norm on EA timelines, so an expiring grant is replaced by a new
        one rather than edited. Supply `batchId` to mint several grants that one revoke takes back
        together; omit it and one is generated.
      security:
        - ApiKeyAuth: []
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [party, scope, levels, end]
              properties:
                party:
                  type: object
                  required: [type, id]
                  properties:
                    type:
                      type: string
                      enum: [user, group, apikey]
                    id:
                      type: string
                      description: Keycloak `sub`, a realm group name, or a registry key id.
                scope:
                  type: object
                  required: [type, ids]
                  properties:
                    type:
                      type: string
                      enum: [document, project]
                    ids:
                      type: array
                      maxItems: 200
                      items:
                        type: string
                levels:
                  type: array
                  description: >-
                    Record levels this grant admits. 0 is the sealed compartment and 4 is public;
                    neither can be granted.
                  items:
                    type: integer
                    minimum: 1
                    maximum: 3
                start:
                  type: string
                  format: date-time
                end:
                  type: string
                  format: date-time
                batchId:
                  type: string
                note:
                  type: string
              example:
                party:
                  type: user
                  id: 8f2c1a3e-0000-4b6d-9f11-2c9d5a7e4b10
                scope:
                  type: project
                  ids: ['207']
                levels: [1, 2]
                end: '2026-11-29T00:00:00.000Z'
                note: Working group, Skeena LNG
      responses:
        '201':
          description: The stored grant.
        '400':
          description: >-
            A missing or past `end`, an unknown `party.type` or `scope.type`, an empty scope, more
            than 200 scope ids, or `levels` naming 0 or 4. The body says which.
        '401':
          description: Unauthorized.
        '403':
          description: Forbidden. Requires role sysadmin.
    get:
      summary: List Selected Credentials
      description: |-
        Live grants held by one party, or live grants over one project. Exactly one of the two
        query parameters is required. `projectId` matches project-scoped grants only — a
        document-scoped grant names document ids.
      security:
        - ApiKeyAuth: []
        - BearerAuth: []
      parameters:
        - name: party
          in: query
          required: false
          schema:
            type: string
        - name: projectId
          in: query
          required: false
          schema:
            type: string
      responses:
        '200':
          description: The grants.
        '400':
          description: Neither party nor projectId was supplied.
        '401':
          description: Unauthorized.
        '403':
          description: Forbidden. Requires role sysadmin.

  /api/credentials/revoke:
    post:
      summary: Revoke Selected Credentials
      description: |-
        Ends grants by `id`, by `batchId`, by `party`, or over a `projectId` — exactly one
        selector per request. A revoke stamps `revokedAt`; the row stays as the record of what was
        granted and when it stopped. Each revoked grant is audited, and a set revoke adds one
        summary row.

        On the instance serving the request the effect is immediate; on any other it lands within
        the 60-second credential cache TTL.
      security:
        - ApiKeyAuth: []
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                id:
                  type: string
                batchId:
                  type: string
                party:
                  type: string
                projectId:
                  type: string
                cause:
                  type: string
                  description: Recorded in the audit row, e.g. `project-closed`.
      responses:
        '200':
          description: How many grants were revoked, and their ids.
        '400':
          description: No selector, or more than one.
        '401':
          description: Unauthorized.
        '403':
          description: Forbidden. Requires role sysadmin.

  /api/db/stats:
    get:
      summary: Item counts per container
      description: >-
        An operational reading of the whole database, counted under systemAccess() — the numbers
        are the container totals, not what the caller may read. Index-build state is on
        GET /api/admin/index-progress, which issues no container query.
      security:
        - ApiKeyAuth: []
        - BearerAuth: []
      responses:
        '200':
          description: One count per container, plus index-build progress when available.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  database:
                    type: string
                  connectionState:
                    type: string
                  driver:
                    type: string
                  stats:
                    type: object
                    properties:
                      projects:
                        type: integer
                        description: Every project row.
                      trackProjects:
                        type: integer
                        description: Projects with a Track counterpart.
                      unlinkedProjects:
                        type: integer
                        description: Eagle-sourced projects Track has no counterpart for.
                      documents:
                        type: integer
                        description: Every document row.
                      boundaries:
                        type: integer
                        description: Every administrative region boundary.
                      projectsWithCentroid:
                        type: integer
                        description: Projects carrying a usable centroid, so they can be map-placed.
                      documentsExtracted:
                        type: integer
                        description: Documents whose content has been extracted.
                      documentsExtractionErrors:
                        type: integer
                        description: Documents whose last extraction attempt failed.
                  indexProgress:
                    type: object
                    description: Index-build percentage per container, omitted when unreadable.
        '401':
          description: Unauthorized.

  /api/admin/audit:
    get:
      summary: The audit trail
      description: >-
        Rows from DemiAudit_CL over the chosen window, newest first, with a count per action over
        the whole window. The API queries Log Analytics with its own managed identity — the caller
        never reaches Azure. `action` and `actor` are matched against a fixed pattern before they
        reach the query; anything else is a 400.
      security:
        - ApiKeyAuth: []
        - BearerAuth: []
      parameters:
        - name: hours
          in: query
          required: false
          schema:
            type: integer
            enum: [24, 168, 720]
            default: 24
        - name: action
          in: query
          required: false
          description: Exact Action value, lower case and dots only.
          schema:
            type: string
            pattern: '^[a-z][a-z.]{0,40}$'
        - name: actor
          in: query
          required: false
          description: Matches either ActorId or ActorName.
          schema:
            type: string
            pattern: '^[\w.@-]{1,80}$'
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 500
            default: 100
      responses:
        '200':
          description: The rows, and the per-action counts behind the window total.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  hours:
                    type: integer
                  total:
                    type: integer
                    description: Rows in the window, which `limit` does not cap.
                  byAction:
                    type: array
                    items:
                      type: object
                      properties:
                        action:
                          type: string
                        count:
                          type: integer
                  rows:
                    type: array
                    items:
                      type: object
                      description: One DemiAudit_CL row. SourceIp arrives already masked.
                      properties:
                        TimeGenerated:
                          type: string
                          format: date-time
                        EventId:
                          type: string
                        Action:
                          type: string
                        Outcome:
                          type: string
                        ActorId:
                          type: string
                        ActorName:
                          type: string
                        ActorType:
                          type: string
                        ActorRoles:
                          type: string
                        SourceIp:
                          type: string
                        TargetType:
                          type: string
                        TargetId:
                          type: string
                        ProjectId:
                          type: string
                        CorrelationId:
                          type: string
                        Env:
                          type: string
                        Detail:
                          type: string
        '400':
          description: An unlisted `hours`, a `limit` outside 1-500, or an `action`/`actor` that does not match its pattern.
        '401':
          description: Unauthorized.
        '403':
          description: Forbidden. Requires an admin role.
        '503':
          description: '`{ "error": "not configured" }` — AUDIT_WORKSPACE_CUSTOMER_ID is unset in this environment.'

  /api/admin/analytics:
    get:
      summary: DEMI usage and API request health
      description: >-
        The DemiEventsHourly_CL rollup over the window (events per day, top event names) beside
        AppRequests from the application workspace, for the same window and for the last 24 hours.
        The raw DemiEvents_CL table is Auxiliary-plan and is not read here. `peakHourUsers` is an
        upper bound: per-bucket distinct users summed within the busiest hour, so a user seen under
        two event names counts twice. It is not a window total — users are counted from AnonId, a
        daily-salted value, and per-hour distinct counts cannot be added together.
      security:
        - ApiKeyAuth: []
        - BearerAuth: []
      parameters:
        - name: days
          in: query
          required: false
          schema:
            type: integer
            enum: [7, 30]
            default: 7
      responses:
        '200':
          description: Usage and request health.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  days:
                    type: integer
                  totals:
                    type: object
                    properties:
                      events:
                        type: integer
                      peakHourUsers:
                        type: integer
                  perDay:
                    type: array
                    items:
                      type: object
                      properties:
                        day:
                          type: string
                          format: date-time
                        events:
                          type: integer
                        peakHourUsers:
                          type: integer
                  topEvents:
                    type: array
                    items:
                      type: object
                      properties:
                        name:
                          type: string
                        count:
                          type: integer
                  requests:
                    type: object
                    description: Null on either side when the workspace returned no rows for that window.
                    properties:
                      window:
                        $ref: '#/components/schemas/RequestStats'
                      last24h:
                        $ref: '#/components/schemas/RequestStats'
        '400':
          description: '`days` was neither 7 nor 30.'
        '401':
          description: Unauthorized.
        '403':
          description: Forbidden. Requires an admin role.
        '503':
          description: '`{ "error": "not configured" }` — AUDIT_WORKSPACE_CUSTOMER_ID or APP_LOGS_WORKSPACE_CUSTOMER_ID is unset.'

  /api/admin/cost:
    get:
      summary: Month-to-date Azure spend
      description: >-
        Actual cost for the resource group so far this month, by resource and by service, with the
        monthly budget beside it. Cached for an hour in Cosmos and shared by every instance, so
        `asOf` is when the figures were fetched rather than when they were asked for.
        `budget.spend` comes from Azure's own `currentSpend`, which has been seen reporting 0 —
        `total` is the figure to trust.

        Cost Management rate-limits per tenant. When it refuses, the last cached figures are
        returned with `stale: true` whatever their age; with nothing cached the answer is 503.
      security:
        - ApiKeyAuth: []
        - BearerAuth: []
      responses:
        '200':
          description: The month-to-date breakdown.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  asOf:
                    type: string
                    format: date-time
                  stale:
                    type: boolean
                    description: >-
                      Present and true only when Cost Management refused the refresh and these are
                      the cached figures. Read `asOf` for how old they are.
                  currency:
                    type: string
                    description: The subscription's billing currency, CAD here.
                  total:
                    type: number
                  byResource:
                    type: array
                    items:
                      type: object
                      properties:
                        resourceId:
                          type: string
                        cost:
                          type: number
                  byService:
                    type: array
                    items:
                      type: object
                      properties:
                        service:
                          type: string
                        cost:
                          type: number
                  budget:
                    type: object
                    nullable: true
                    description: Null when BUDGET_NAME is unset; the spend figures still come back.
                    properties:
                      name:
                        type: string
                      amount:
                        type: number
                      spend:
                        type: number
                      currency:
                        type: string
        '401':
          description: Unauthorized.
        '403':
          description: Forbidden. Requires an admin role.
        '503':
          description: >-
            `not configured` when COST_SCOPE is unset in this environment, or `cost data
            rate-limited by Azure, retry in a few minutes` when Cost Management refused and
            nothing is cached yet.

components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-Api-Key
      description: |-
        Registry key, `demi_<env>_<keyId>_<secret>`, issued by `POST /api/admin/api-keys` with its
        own roles. Roles a key may carry (`GRANTABLE_ROLES` in
        `src/controllers/nosql/api-key.js`), least privilege first:

          * `public`             — no privilege; the anonymous tier, named explicitly.
          * `compliance`         — the sealed compartment (level 0). Matched against each row's
                                   `read[]`, not privileged, and the only role admitted to
                                   `/api/sealed` — which is the only place it reads a sealed row.
                                   Every other route excludes level 0 from every caller, its holder
                                   included, so no sealed read goes unaudited. Only a caller that
                                   already holds it may mint a key carrying it — anyone else gets
                                   400 `compliance is not grantable by this caller`.
          * `demi-service-read`  — reads every row the ACL allows. Writes nothing.
          * `demi-service-write` — the same reads, plus every data write: projects, documents,
                                   chunks, boundaries and the Eagle mirror. Refused on
                                   `/api/admin/*`, so it cannot mint or revoke a key. This is what
                                   a machine writer (the eagle-api push, the extractor) holds.
          * `staff`, `sysadmin`, `demi-admin` — data writes AND `/api/admin/*`.

        A key carrying any write role must be minted with `allowWrite: true`.

        Machine callers that arrive through API Management present no key of their own: the
        gateway proves them, and `POST /api/admin/api-keys` with `id: apim:<subscription-name>`
        (the only id a caller may choose, and only in that shape) records the roles that
        subscription holds. Such a row carries no secret, never expires on its own — API
        Management owns the subscription's lifecycle — and 409s if the id already exists.
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |-
        Keycloak token, realm `eao-epic`. Privilege comes from `realm_access.roles`, read with the
        same meanings as the registry-key roles above. `project:<id>` roles are the orthogonal
        project-scope dimension and never enter the `read[]` predicate.

        A token that verifies but whose `azp` (or `client_id`) is not listed in
        `DEMI_ALLOWED_CLIENTS` is rejected with 401. The setting is required in test and prod; an
        empty list is permissive and only reachable in local development.

        When `SSO_AUDIENCE` is set, a token whose `aud` does not match it fails verification with
        401. Empty, which is what every environment ships today, means the claim is not checked.

  schemas:
    RequestStats:
      type: object
      nullable: true
      properties:
        requests:
          type: integer
        failed:
          type: integer
          description: Requests AppRequests recorded as unsuccessful.
        p95DurationMs:
          type: number
      description: One AppRequests summary row.
    BulkDownloadAccepted:
      type: object
      properties:
        id: { type: string, format: uuid, description: The job id, and the capability that reads it back. }
        status: { type: string, enum: [queued] }
        documentCount: { type: integer, description: Documents visible to this caller, so possibly fewer than were asked for. }
        estimatedPartCount: { type: integer, description: Zip parts the selection is expected to pack into. An estimate — a document with no recorded size counts as nothing here, so the real count can differ. Poll for `partCount`. }
        statusUrl: { type: string, example: /api/bulk-downloads/6f1c4b9e-0d2a-4d9d-9c3e-1f5f9a2b7c40 }
    BulkDownloadStatus:
      type: object
      properties:
        id: { type: string, format: uuid }
        status: { type: string, enum: [queued, running, ready, failed, expired] }
        documentCount: { type: integer }
        partCount: { type: integer, description: Zip parts the job actually produced. 0 until the job is ready. }
        partsReady: { type: integer, description: Parts finished so far. }
        includedCount: { type: integer, description: Documents actually written into the zip. }
        errorCount: { type: integer }
        errors:
          type: array
          description: At most 100; the full list ships as errors.txt inside the last part.
          items:
            type: object
            properties:
              documentId: { type: string }
              name: { type: string, description: File name, empty when the document could not be read at all. }
              reason: { type: string, example: not available }
        bytes: { type: integer }
        parts:
          type: array
          description: Present only when ready. Fetch each URL in turn; the browser prompts once to allow several downloads.
          items:
            type: object
            properties:
              n: { type: integer }
              url: { type: string }
              bytes: { type: integer }
              count: { type: integer }
              expiresIn: { type: integer }
              fileName: { type: string }
    Me:
      type: object
      properties:
        roles:
          type: array
          items:
            type: string
        level:
          type: integer
          minimum: 0
          maximum: 4
        tier:
          type: string
          enum: [privileged, scoped, public]
        privileged:
          type: boolean
          description: >-
            True when the caller holds a row-plane privileged role (`sysadmin`, `demi-admin`,
            `demi-service-*`). `staff` is not privileged.
        staffUi:
          type: boolean
          description: >-
            True when the caller passes authMiddleware; the frontend gates staff screens on it.

    AccessSimulateRequest:
      type: object
      additionalProperties: false
      description: The caller to simulate. Every field is optional; an empty body is an anonymous one.
      properties:
        roles:
          type: array
          description: >-
            Realm roles. `team` and `idir` are stripped, as they are on a real token — a realm role
            must not forge a ladder token.
          items:
            type: string
        identityProvider:
          type: string
          nullable: true
          enum: [idir, bceid, github]
          description: The `identity_provider` claim. Only `idir` moves the caller to level 3.
        teams:
          type: array
          description: Project ids the caller is a team member of, as `project:<id>` realm roles.
          items:
            type: string
        projectScope:
          type: array
          description: >-
            Project ids a minted key restricts the caller to. Present, even empty, makes the tier
            `scoped`.
          items:
            type: string
        credential:
          type: object
          nullable: true
          additionalProperties: false
          description: >-
            A Selected Credential the caller holds, validated as `POST /credentials` would validate
            it. The window is supplied by the simulator.
          properties:
            scope:
              type: object
              properties:
                type:
                  type: string
                  enum: [document, project]
                ids:
                  type: array
                  items:
                    type: string
            levels:
              type: array
              items:
                type: integer
                enum: [1, 2, 3]

    AccessSimulateResponse:
      type: object
      description: >-
        The `Me` answer for the simulated caller, plus what it reaches on the row plane and the
        field plane.
      allOf:
        - $ref: '#/components/schemas/Me'
      properties:
        rows:
          type: object
          description: >-
            One entry per ladder level, keyed `1`-`4`. `read` is the `read[]` a record at that
            level stores. `via` names the arm that got the caller there: `role`, `team`,
            `credential`, or null when the row is out of reach.
          additionalProperties:
            type: object
            properties:
              readable:
                type: boolean
              via:
                type: string
                nullable: true
                enum: [role, team, credential]
              read:
                type: array
                items:
                  type: string
        fields:
          type: object
          description: >-
            Every catalogued field of each entity, including the plumbing keys pinned to level 0.
          properties:
            projects:
              type: array
              items:
                $ref: '#/components/schemas/AccessSimulateField'
            documents:
              type: array
              items:
                $ref: '#/components/schemas/AccessSimulateField'
        predicatesAssumedFalse:
          type: boolean
          description: >-
            Always true: no record is simulated, so every catalog `when` reads false and each field
            sits at its `defaultVis`.
        notes:
          type: object
          properties:
            sealedCompartment:
              type: string

    AccessSimulateField:
      type: object
      properties:
        field:
          type: string
        defaultVis:
          type: integer
        maxVis:
          type: integer
        when:
          type: string
          nullable: true
          description: Name of the catalog predicate that widens this field, or null.
        visible:
          type: boolean

    Project:
      type: object
      properties:
        _id:
          type: string
        trackProjectId:
          type: integer
        name:
          type: string
        region:
          type: string
        centroid:
          $ref: '#/components/schemas/GeoPoint'
    
    ProjectInput:
      type: object
      required:
        - trackProjectId
        - name
        - centroid
      properties:
        trackProjectId:
          type: integer
        name:
          type: string
        region:
          type: string
        centroid:
          $ref: '#/components/schemas/GeoPoint'

    DocumentInput:
      type: object
      required:
        - project
        - displayName
        - s3Key
      properties:
        project:
          type: string
        displayName:
          type: string
        s3Key:
          type: string
        region:
          type: string
        edrmsRecordNumber:
          type: string
        orcsClassification:
          type: string

    GeoPoint:
      type: object
      required:
        - type
        - coordinates
      properties:
        type:
          type: string
          enum: [Point]
        coordinates:
          type: array
          minItems: 2
          maxItems: 2
          items:
            type: number

    EaglePush:
      type: object
      required:
        - doc
      properties:
        doc:
          type: object
          description: |-
            The raw Eagle record, exactly as eagle-api stores it. `doc._id` must equal the
            `eagleId` path parameter. For a document, `doc.project` is the parent project's
            Eagle `_id` (or an object carrying it as `_id`).
        labels:
          type: object
          description: |-
            Documents only. The resolved `List` names for the record's ObjectId references, so
            DEMI stores the label beside the id without a List collection of its own.
          properties:
            type:
              type: string
            milestone:
              type: string
            projectPhase:
              type: string
            documentAuthorType:
              type: string

    EaglePushResult:
      type: object
      properties:
        id:
          type: string
          description: The DEMI id of the mirrored record.
        projectId:
          type: string
          description: Documents only — the parent project's DEMI id.
        action:
          type: string
          enum: [upsert]

    ShortLink:
      type: object
      properties:
        id:
          type: string
          description: The code. It is also the Cosmos id and partition key.
        url:
          type: string
          description: The destination, as validated when it was written.
        note:
          type: string
          nullable: true
          description: What the link is for, e.g. a campaign or poster reference.
        shortUrl:
          type: string
          description: '`LINK_BASE_URL` + `/s/` + the code, composed by the API.'
        createdAt:
          type: string
          format: date-time
        createdBy:
          type: string
        updatedAt:
          type: string
          format: date-time
          nullable: true
          description: Null until the link is repointed.
        personal:
          type: boolean
          description: >-
            True when the link is listed to its creator only. It is a listing filter, not access
            control: `GET /s/{code}` stays public, so anyone holding the short URL can still
            follow it.

    ShortLinkInput:
      type: object
      required:
        - url
      properties:
        url:
          type: string
          description: https only, no credentials, host on LINK_ALLOWED_HOSTS. Max 2048 characters.
        note:
          type: string
          maxLength: 200
        code:
          type: string
          pattern: '^[A-Za-z0-9_-]{3,64}$'
          description: >-
            Vanity alias: lowercase letters, digits, `_`, `-`, 3-64 characters. Case-insensitive
            on lookup — an uppercase value is lowercased before validation and storage. Omit for a
            generated 8-character code.
        personal:
          type: boolean
          default: false
          description: >-
            Hide the link from other callers' `GET /api/links`. The redirect stays public — anyone
            with the short URL can still open it.

    MyData:
      type: object
      properties:
        prefs:
          $ref: '#/components/schemas/Prefs'
        lassos:
          type: array
          items:
            $ref: '#/components/schemas/LassoItem'

    LassoItem:
      type: object
      properties:
        slug:
          type: string
          description: 'Derived from the name: `a-z0-9-`. The delete key, and unique per user.'
        name:
          type: string
          maxLength: 80
        ring:
          type: array
          description: 3-500 `[longitude, latitude]` pairs, GeoJSON order.
          items:
            type: array
            items:
              type: number
        updatedAt:
          type: string
          format: date-time

    Prefs:
      type: object
      required:
        - landing
        - perPage
      properties:
        landing:
          type: string
          description: The screen key the app opens on, e.g. `map`.
        perPage:
          type: integer
          enum: [6, 12, 24]
