openapi: 3.0.3
info:
  title: DEMI Central Repository API (demi-api)
  description: |-
    Central authoritative storage and spatial search engine for projects, documents, and
    administrative region boundaries.

    NOT THE CONTRACT. This file is hand-maintained, covers 41 of the 54 paths in src/http/routes.js
    (53 of its 70 operations), and has drifted from what the API actually serves. Undocumented here:
    /search/summary, /boundaries, /admin/api-keys and more. GET /s/{code} is a
    browser redirect rather than an API call and is documented in the wiki. The routes in
    src/http/routes.js are authoritative; read them, or the endpoint itself, before relying on
    anything here.
  version: 1.0.0
paths:
  /api/search:
    get:
      summary: Search or list one dataset
      description: >-
        Project, Document and DocumentChunk are answered by Azure AI Search. The rest are Cosmos
        list reads of the mirrored Eagle records, on the same envelope: a one-element array of
        `{searchResults, count, meta}`, where `meta[0].searchResultsTotal` is the measured total to
        page against. An unknown dataset, or any query parameter not listed here, is a 400.
      parameters:
        - name: dataset
          in: query
          required: true
          description: Which records to read.
          schema:
            type: string
            enum:
              - Project
              - Document
              - DocumentChunk
              - List
              - Organization
              - CommentPeriod
              - Comment
              - RecentActivity
              - ProjectNotification
        - name: q
          in: query
          required: false
          description: >-
            Search query string. Also accepted as `keywords`. Ignored by the Cosmos datasets except
            RecentActivity, which matches it against the headline and the content,
            case-insensitively.
          schema:
            type: string
        - name: project
          in: query
          required: false
          description: >-
            Eagle project id. Also accepted as `and[project]`. Applies to Document, DocumentChunk,
            CommentPeriod and RecentActivity; on any other dataset the read answers no rows and
            reports the key under `meta[0].dropped.filter`.
          schema:
            type: string
        - name: docIds
          in: query
          required: false
          description: Pipe-separated Eagle document ids, for dataset=Document.
          schema:
            type: string
        - name: period
          in: query
          required: false
          description: >-
            Comment period id, required by dataset=Comment. Also accepted as `and[period]`.
          schema:
            type: string
        - name: companyType
          in: query
          required: false
          description: Narrows dataset=Organization. Also accepted as `and[companyType]`.
          schema:
            type: string
        - name: top
          in: query
          required: false
          description: >-
            `true` on dataset=RecentActivity answers the home-page strip: up to four rows, pinned
            first, newest by dateAdded.
          schema:
            type: boolean
        - name: _id
          in: query
          required: false
          description: >-
            Fetch one record by Eagle id, on CommentPeriod, Comment and ProjectNotification. Also
            accepted as `and[_id]`.
          schema:
            type: string
        - name: and[type]
          in: query
          required: false
          description: >-
            Narrows dataset=ProjectNotification, with `and[region]`, `and[pcp]` and
            `and[decision]`. A key the dataset does not consume is reported under
            `meta[0].dropped.filter` rather than ignored.
          schema:
            type: string
        - name: sortBy
          in: query
          required: false
          description: >-
            One key, `-` for descending. On RecentActivity `-score` orders by dateAdded, and on
            ProjectNotification `-_id` orders by notificationReceivedDate — neither field is stored,
            and an ORDER BY on a field a row lacks drops the row.
          schema:
            type: string
      responses:
        '200':
          description: >-
            One-element array of search results, the measured total and metadata. A field the live
            index could not answer is dropped from the query and named under
            `meta[0].degraded.missing`, so the page is served with that column missing rather than
            failed — except for the visibility fields, which stay a 502.
        '400':
          description: Unknown dataset, unsupported query parameter, or dataset=Comment with no period.
        '502':
          description: >-
            The backing search index or database could not be read. The body carries `code`
            (`SEARCH_SCHEMA_DRIFT` when the live index is missing a field this app needs, and then
            `field` names it; `SEARCH_UPSTREAM` otherwise) and `traceId`.

  /api/health/search-schema:
    get:
      summary: Can the live search indexes answer what this app asks them?
      description: >-
        Unauthenticated, like the other health routes. Each live index is asked for an empty page
        (`top: 0`) with the `select` and the `$orderby` clauses the app emits; Azure AI Search
        answers a 400 naming the first field the index does not carry. Nothing applies index
        definitions on deploy, so the committed `azure/search/indexes/*.json` can be wider than the
        live index — this is the only check that compares the two.

        Returns no rows and no counts, and nothing is cached.
      responses:
        '200':
          description: >-
            `{ "ok": true, "indexes": { "documents": { "ok": true }, ... } }` — every live index can
            answer every query this app builds.
        '503':
          description: >-
            `{ "ok": false, "indexes": { "documents": { "ok": false, "missing": ["fileSize"] } } }`
            — the named index is narrower than the app, so every query against it is a 400. Also
            answered when `SEARCH_ENDPOINT` is unset, and when a probe failed for a reason that is
            not a missing field (`"error": "probe failed"`, details in the log).
    post:
      summary: Probe the live indexes with a supplied schema
      description: >-
        The same check, against selects the caller supplies rather than the deployed ones, so a
        release pipeline can hold the INCOMING tag's schema against the live index before it swaps
        the code.

        Per index, either `{"select": [...], "orderby": [...]}` or a committed index definition
        as-is (`{"fields": [{"name": ...}]}`, whose retrievable fields become the select). An index
        named in the body but not queried by this app is a 400; an index left out keeps the
        deployed select.

        Bounded, because the route is anonymous and every entry becomes a live query: at most the
        three known indexes, 64 entries per `select` and per `orderby`, each a field name of at
        most 64 characters optionally followed by `asc` or `desc`, and 12 probes per request. The
        committed definitions fit inside all of them.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                indexes:
                  type: object
                  additionalProperties:
                    type: object
      responses:
        '200':
          description: Every supplied field exists in the live index.
        '400':
          description: >-
            The body named an index this app does not query, or an override was outside the bounds
            above (`{"error": "schema override out of bounds"}`). No probe is issued.
        '503':
          description: A supplied field is missing from the live index, or the probe could not run.

  /api/config:
    get:
      summary: DEMI admin console runtime configuration
      description: >-
        Unauthenticated, and everything it answers is public — never add a secret. The app settings
        of the running container, overlaid with the `OVERRIDABLE_KEYS` the `config` document
        carries. A Cosmos failure or an unseeded container degrades to the app settings alone
        rather than failing, so a database outage cannot take the frontend down. `BUILD_ID` comes
        from the deploy package and the document cannot override it.
      responses:
        '200':
          description: The admin console's configuration. Always answered.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Config'

  /api/config/public:
    get:
      summary: Public site runtime configuration
      description: >-
        Unauthenticated, and everything it answers is public — never add a secret. What eagle-public
        boots on, served from the `public` document exactly as stored: only the allowlisted keys
        below, no app-settings overlay and no defaults. eagle-api's Mongo `Config` is the source of
        truth; this is a live mirror of it — eagle-api pushes every Config write to
        `PUT /api/eagle/config/public`, and `src/scripts/seed-public-config.js` bootstraps the
        document before the first push.

        Unlike `/api/config` this route does NOT degrade. A defaulted payload would answer
        `ACCESS_GATE: false` and open the access curtain on a site meant to be gated, so a missing
        or unreadable document is a 503 and the caller falls back to eagle-api's own `/api/config`.
      responses:
        '200':
          description: The public site's configuration — the allowlisted keys the document carries.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicConfig'
        '503':
          description: >-
            `{ "error": "Public configuration is unavailable." }` — the `public` document is not
            seeded, or Cosmos could not be read.
          headers:
            Cache-Control:
              description: Always `no-store`, so no cache holds the refusal once the document is seeded.
              schema:
                type: string

  /api/gate:
    post:
      summary: Public site access curtain
      description: >-
        Unauthenticated: the caller is a visitor who holds nothing yet and the password in the body
        is the only credential in play. Ported from eagle-api so eagle-public calls one API, with
        the same three answers.

        The password is an app setting (`ACCESS_GATE_PASSWORD`) compared in constant time. It is
        never served — `/api/config/public` carries the boolean `ACCESS_GATE` only, which is all a
        browser is told about the curtain.

        404 means `ACCESS_GATE` is false, so the route's existence is not advertised on an
        environment that runs ungated; a `true` flag with no password configured is a 503, never a
        404, since that would misreport a misconfigured environment as ungated. A wrong password is
        a 401 whatever its length.

        NO PER-CALLER THROTTLE. APIM is Consumption, where `rate-limit-by-key` does not exist and
        plain `rate-limit` counts per subscription, which the anonymous `/api` product has none of.
        What bounds guessing is the password's own entropy, so it must stay long and random.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [password]
              properties:
                password: { type: string }
      responses:
        '204':
          description: Password matched. No body.
        '401':
          description: '`{ "error": "Invalid password" }` — wrong password, or none in the body.'
        '404':
          description: '`{ "message": "Not Found" }` — `ACCESS_GATE` is false. This environment runs no curtain.'
        '503':
          description: >-
            Either `{ "error": "Public configuration is unavailable." }` — the `public` document
            could not be read, so whether the curtain is drawn is unknown — or, with `ACCESS_GATE`
            true and no password configured, `{ "error": "Gate misconfigured" }`. Neither is ever a
            404: that would report an ungated environment.
          headers:
            Cache-Control:
              description: Always `no-store`.
              schema:
                type: string

  /api/me:
    get:
      summary: Caller's own access
      description: >-
        What the caller's credential (or lack of one) resolves to, plus the Selected Credentials
        they hold and when each expires. Unauthenticated, like /api/config — an anonymous caller
        gets the public tier and an empty credential list, not a 401.
      responses:
        '200':
          description: The caller's roles, visibility level, access tier and live grants.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'

  /api/access/simulate:
    post:
      summary: What a hypothetical caller could see
      description: >-
        Runs the access engine over a described caller and returns the answer, without reading any
        data and without granting the real caller anything. Authenticated: the body describes
        somebody else, but the answer is the whole field catalog and a role-privilege oracle.
      security:
        - ApiKeyAuth: []
        - BearerAuth: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AccessSimulateRequest'
      responses:
        '200':
          description: The level, ladder rows and field visibility this caller would get.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessSimulateResponse'
        '400':
          description: Unknown field, malformed list, or a credential the registry would refuse.
        '401':
          description: Unauthorized.

  /api/projects:
    get:
      summary: Retrieve projects
      description: Get all projects, optionally filtered by spatial administrative region containment. Restricted to published projects for unauthenticated public requests.
      parameters:
        - name: region
          in: query
          required: false
          description: Name of the region shapefile boundary to execute point-in-polygon containment check.
          schema:
            type: string
        - name: pageSize
          in: query
          required: false
          description: >-
            Rows per page. Unauthenticated requests are capped at 100 and asking for more is
            refused with 400; authenticated requests may ask for up to 1000. Omitting it returns
            the cap that applies to the caller.
          schema:
            type: integer
            minimum: 1
            maximum: 1000
      responses:
        '200':
          description: A list of projects.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Project'
        '400':
          description: pageSize above 100 on an unauthenticated request.
    post:
      summary: Create project
      description: >-
        Ingest a new project with name and geographic centroid coordinates. The project is
        admitted at level 1 (team only): `isPublished` and `read` in the body are ignored, not
        refused. Raising a project's level is `PUT /api/projects/{id}/level`.
      security:
        - ApiKeyAuth: []
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProjectInput'
      responses:
        '201':
          description: Project successfully created.
        '400':
          description: Missing required fields.
        '401':
          description: Unauthorized.
        '403':
          description: Forbidden. Insufficient roles.

  /api/projects/{id}:
    get:
      summary: Get project by ID
      description: >-
        Get details of a single project. Returns 404 to unauthenticated users if unpublished.
        Which FIELDS the response carries depends on the caller's visibility level, so a
        privileged caller sees a superset of the anonymous response.
      parameters:
        - name: id
          in: path
          required: true
          description: >-
            A DEMI project id (a Track project number, or `eagle-<ObjectId>`), or the project's
            Eagle ObjectId — a 24-character hex string, which is resolved through `eagleId`.
            The two id spaces cannot collide, and both answer under the same ACL.
          schema:
            type: string
      responses:
        '200':
          description: >-
            Project document. It carries `shortCode` and, composed from it, `shortUrl` — the
            `/s/<code>` link to the project's public page.
        '404':
          description: Project not found.
    put:
      summary: Update project
      description: >-
        Modify an existing project's metadata or coordinates. It does not change visibility:
        `isPublished` and `read` in the body are ignored and the stored ACL is kept. Use
        `PUT /api/projects/{id}/level`.
      security:
        - ApiKeyAuth: []
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProjectInput'
      responses:
        '200':
          description: Project successfully updated.
        '400':
          description: Body contains a field the caller cannot see, or a vis key.
        '401':
          description: Unauthorized.
        '404':
          description: Project not found.
    delete:
      summary: Delete project
      description: Permanently remove a project from the master directory.
      security:
        - ApiKeyAuth: []
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Project successfully deleted.
        '401':
          description: Unauthorized.
        '404':
          description: Project not found.

  /api/projects/{id}/summary:
    get:
      summary: Get a project's stored AI summary
      description: >-
        The per-project summary generated offline and stored, not computed on request — nothing
        here calls a model. Privileged only, like `/api/search/summary`, and gated on the PROJECT:
        a caller who gets 404 from `GET /api/projects/{id}` gets 404 here. Returns
        `{"summary": null, "reason": "disabled"}` while `SUMMARY_ENABLED` is off.
      security:
        - ApiKeyAuth: []
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: A DEMI project id, or the project's Eagle ObjectId.
          schema:
            type: string
      responses:
        '200':
          description: >-
            The stored record — `facts` (counts and document ids, computed by code), `sections`
            (model output, each item citing its sources) and `citations` (the chunks cited).
        '401':
          description: Unauthorized.
        '404':
          description: >-
            Project not found, or `{"error": "no_summary"}` when the project has no stored record —
            which includes a record whose `sourceAccess` is not `public`, since one written before
            the generator filtered its sources may cite documents this caller cannot read.
    put:
      summary: Store a project's AI summary
      description: >-
        The generator's write (`npm run ai:project-summary -- --project <id> --live`). The stored
        `id` and `projectId` come from the resolved project, not from the body. `sourceAccess` must
        be `public`: the record is read back under the project's ACL alone, so it may only cite
        documents an anonymous caller could read.
      security:
        - ApiKeyAuth: []
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [generatedAt, sourceAccess, facts, sections, citations]
              properties:
                generatedAt:
                  type: string
                sourceAccess:
                  type: string
                  enum: [public]
                  description: The access every cited document satisfied when the record was built.
                model:
                  type: string
                  description: The deployment that ran.
                pricedAs:
                  type: string
                  description: The model `estimatedCostCad` was priced against.
                promptVersion:
                  type: integer
                usage:
                  type: object
                estimatedCostCad:
                  type: number
                facts:
                  type: object
                sections:
                  type: object
                citations:
                  type: array
                  items:
                    type: object
      responses:
        '200':
          description: The stored record.
        '400':
          description: The body is not a summary record, its `sourceAccess` is not `public`, or a section cites a source number outside the record's citations.
        '401':
          description: Unauthorized.
        '404':
          description: Project not found.

  /api/projects/{id}/level:
    put:
      summary: Set a project's ladder level
      description: >-
        Move a project on the row plane (docs/rbac-architecture.md §1, "Widening is an act").
        Nothing else raises a record's level — no job, no push, no merge. Every move is audited as
        `record.widen` or `record.narrow`, and the change cascades to the project's documents.
        Pulling a project back from level 4 needs the `sysadmin` role and is audited as
        `record.takedown`; narrowing the row alone does not finish a takedown, see
        `docs/takedown-runbook.md`.
      security:
        - ApiKeyAuth: []
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [level]
              properties:
                level:
                  type: integer
                  enum: [1, 2, 3, 4]
                  description: >-
                    1 team only, 2 all EAO, 3 all IDIR, 4 public. Level 0 is the sealed
                    compartment and is not reachable here.
                confirm:
                  type: boolean
                  description: Required and `true` for level 4.
                reason:
                  type: string
                  description: Required and non-empty for level 4; optional on every other move.
      responses:
        '200':
          description: Project moved to the requested level.
        '400':
          description: level is outside 1-4, or level 4 was sent without `confirm` or a `reason`.
        '401':
          description: Unauthorized.
        '403':
          description: Only sysadmin may pull a record back from level 4.
        '404':
          description: Project not found.

  /api/projects/{id}/visibility:
    patch:
      summary: Classify project fields
      description: >-
        Set per-field visibility dials on one project. `sysadmin` only — a dial is access policy,
        not content, so the ordinary PUT refuses a `vis` key at every level. A dial never raises a
        field above its catalogued `maxVis`, and it is independent of the project's own record
        level. A level of `null` removes the dial and the field falls back to its `defaultVis`;
        a field the body does not name keeps the dial it had.
      security:
        - ApiKeyAuth: []
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [vis]
              properties:
                vis:
                  type: object
                  description: Field name to level. At most 10 fields per request.
                  additionalProperties:
                    type: integer
                    nullable: true
                    minimum: 0
                    maximum: 4
              example:
                vis:
                  complianceLead: 2
                  projectLeadEmail: null
      responses:
        '200':
          description: The updated project, redacted for the caller.
        '400':
          description: >-
            An uncatalogued field, a level outside 0..maxVis for that field, a non-integer level,
            more than 10 fields, or an empty vis object.
        '403':
          description: Forbidden. Requires role sysadmin.
        '404':
          description: Project not found.

  /api/documents:
    get:
      summary: Retrieve documents
      description: Get all documents, optionally filtered by spatial administrative region of their parent project. Restricts to published documents for unauthenticated public requests.
      parameters:
        - name: region
          in: query
          required: false
          schema:
            type: string
        - name: pageSize
          in: query
          required: false
          description: >-
            Rows per page. Unauthenticated requests are capped at 100 and asking for more is
            refused with 400; authenticated requests may ask for up to 1000. Omitting it returns
            the cap that applies to the caller.
          schema:
            type: integer
            minimum: 1
            maximum: 1000
      responses:
        '200':
          description: A list of documents.
        '400':
          description: pageSize above 100 on an unauthenticated request.
    post:
      summary: Create document
      description: >-
        Register a document metadata record. The document is admitted at level 1 (team only),
        capped at its parent project's level: `isPublished` and `read` in the body are ignored,
        not refused. Raising a document's level is `PUT /api/documents/{id}/level`.
      security:
        - ApiKeyAuth: []
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DocumentInput'
      responses:
        '201':
          description: Document successfully created.
        '401':
          description: Unauthorized.

  /api/documents/extract:
    post:
      summary: Upload and extract document
      description: >-
        Uploads document file to S3 MinIO and queues/processes text extraction. The new record is
        admitted at level 1 (team only), like `POST /api/documents`; widen it with
        `PUT /api/documents/{id}/level`.
      security:
        - ApiKeyAuth: []
        - BearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                upfile:
                  type: string
                  format: binary
                project:
                  type: string
                displayName:
                  type: string
      responses:
        '200':
          description: Document successfully uploaded and parsed.
        '401':
          description: Unauthorized.

  /api/documents/{id}:
    get:
      summary: Get document by ID
      description: >-
        Retrieve details of a single document. Which FIELDS the response carries depends on the
        caller's visibility level, so a privileged caller sees a superset of the anonymous
        response.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Document successfully retrieved.
        '404':
          description: Document not found.
    put:
      summary: Update document
      description: Modify document metadata, parent project reference, or publication state.
      security:
        - ApiKeyAuth: []
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DocumentInput'
      responses:
        '200':
          description: Document successfully updated.
        '400':
          description: Body contains a field the caller cannot see, or a vis key.
        '401':
          description: Unauthorized.
    delete:
      summary: Delete document
      description: Delete a document and its parsed chunks.
      security:
        - ApiKeyAuth: []
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Document successfully deleted.
        '401':
          description: Unauthorized.

  /api/documents/{id}/download:
    get:
      summary: Presigned download for a document's bytes
      description: >-
        A short-lived presigned URL for the stored file. Unauthenticated callers get the public
        tier rather than a 401, exactly as `GET /api/documents/{id}` does — the row's `read[]` is
        the gate and it runs inside the controller, so an unpublished document is a 404 to a caller
        who may not see it. A download of a document the public cannot see is audited as
        `document.download`; every download is an analytics event.

        TWO MODES, same visibility check. By default the URL is returned as JSON. With `redirect=1`,
        or an `Accept` that starts with `text/html`, the caller is sent to the file with a 302
        instead — that is what an `<a href>` needs, since a browser navigation cannot read the JSON
        body. Only a 200 redirects: a 404 or 500 answers JSON in both modes.

        The presigned URL carries the file name as `response-content-disposition`, so the browser
        saves `Report.pdf` rather than the storage key.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: project
          in: query
          required: false
          schema:
            type: string
          description: Parent project id, the partition key. Avoids a cross-partition lookup.
        - name: redirect
          in: query
          required: false
          schema:
            type: string
            enum: ['1']
          description: >-
            `1` answers 302 to the presigned URL instead of returning it as JSON. An
            `Accept: text/html…` request redirects without it.
      responses:
        '200':
          description: A presigned download URL. JSON mode.
          content:
            application/json:
              schema:
                type: object
                properties:
                  url: { type: string }
                  expiresIn: { type: integer, description: Seconds until the URL expires. }
                  fileName: { type: string }
                  displayName: { type: string, nullable: true }
        '302':
          description: Redirect mode. The presigned URL is the `Location`.
          headers:
            Location:
              description: The presigned URL. Expires with the same TTL the JSON mode reports.
              schema:
                type: string
            Cache-Control:
              description: >-
                Always `no-store`. The `Location` is itself the credential, so no cache or history
                entry may replay this response.
              schema:
                type: string
        '404':
          description: No document with this id the caller may read, or it has no stored file.
        '500':
          description: '`{ "error": "Failed to generate download link." }` — the presign failed.'

  /api/documents/{id}/level:
    put:
      summary: Set a document's ladder level
      description: >-
        Move a document on the row plane (docs/rbac-architecture.md §1, "Widening is an act").
        A document may not out-rank its project, so a widen past the project's own level is
        refused. Every move is audited as `record.widen` or `record.narrow`. Pulling a document
        back from level 4 needs the `sysadmin` role and is audited as `record.takedown`; narrowing
        the row alone does not finish a takedown, see `docs/takedown-runbook.md`.
      security:
        - ApiKeyAuth: []
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: project
          in: query
          required: false
          schema:
            type: string
          description: Parent project id, the partition key. Avoids a cross-partition lookup.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [level]
              properties:
                level:
                  type: integer
                  enum: [1, 2, 3, 4]
                  description: >-
                    1 team only, 2 all EAO, 3 all IDIR, 4 public. Level 0 is the sealed
                    compartment and is not reachable here.
                confirm:
                  type: boolean
                  description: Required and `true` for level 4.
                reason:
                  type: string
                  description: Required and non-empty for level 4; optional on every other move.
      responses:
        '200':
          description: Document moved to the requested level.
        '400':
          description: level is outside 1-4, or level 4 was sent without `confirm` or a `reason`.
        '401':
          description: Unauthorized.
        '403':
          description: Only sysadmin may pull a record back from level 4.
        '404':
          description: Document not found.
        '409':
          description: The document would out-rank its project.

  /api/documents/{id}/chunks:
    get:
      summary: A document's extracted text, in page order
      description: >-
        The ONLY route that returns full chunk `content`; the chunk search deliberately does not.
        It exists so the project-summary generator can read a document's text from outside the
        VNet, where Cosmos and AI Search are unreachable. Privileged only, like
        `/api/search/summary`, and the parent document's ACL is re-applied before anything is
        fetched — a chunk's own `read[]` is an ingest-time snapshot and can outlive its parent's
        visibility.
      security:
        - ApiKeyAuth: []
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: project
          in: query
          required: false
          description: Parent project id, the partition key.
          schema:
            type: string
        - name: page
          in: query
          required: false
          description: One-based page number.
          schema:
            type: integer
            default: 1
        - name: pageSize
          in: query
          required: false
          description: Same ceiling as every other list read; see `pageSizeFor`.
          schema:
            type: integer
            default: 1000
            maximum: 1000
      responses:
        '200':
          description: >-
            `{items, count, page, pageSize}`. `count` is the whole document, not the page. Each
            item carries `chunkId`, `documentId`, `projectId`, `pageNumber` and `content`.
        '401':
          description: Unauthorized.
        '404':
          description: Document not found.

  /api/documents/{id}/published:
    put:
      deprecated: true
      summary: Publish or unpublish a document (deprecated)
      description: >-
        Deprecated alias for `PUT /api/documents/{id}/level`: `{ "isPublished": true }` is level 4
        and `{ "isPublished": false }` is level 2. It runs the same guards, so unpublishing a
        public document needs the `sysadmin` role and is audited as `record.takedown` — see
        `docs/takedown-runbook.md`. Use the level route.
      security:
        - ApiKeyAuth: []
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: project
          in: query
          required: false
          schema:
            type: string
          description: Parent project id, the partition key.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [isPublished]
              properties:
                isPublished:
                  type: boolean
                reason:
                  type: string
                  description: Recorded on the audit row when publishing.
      responses:
        '200':
          description: Document visibility changed.
        '401':
          description: Unauthorized.
        '403':
          description: Only sysadmin may unpublish a public document.
        '404':
          description: Document not found.
        '409':
          description: The document's project is not published.

  /api/bulk-downloads:
    post:
      summary: Request a bulk document download
      description: >-
        Asks for many documents as one download. Exactly ONE id is answered inline with the same
        presigned URL `GET /api/documents/{id}/download` hands out (`single: true`, no job); two or
        more start an asynchronous job — 202 now, poll `GET /api/bulk-downloads/{id}`, download the
        zip parts from the presigned URLs it returns once the status is `ready`, or stop it with
        `DELETE /api/bulk-downloads/{id}`.

        Ids the caller may not see are dropped by the read ACL, and so are documents with no
        stored file, so `documentCount` is what will actually be zipped and may be lower than the
        number asked for. Caps REFUSE rather than truncate: 100 documents anonymously, 2500
        authenticated, and 20 GiB in total. The zip is split into ~2 GiB numbered parts rather than
        refused. Three jobs may be in flight per requester and 20 may be started in 24 hours.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [documentIds]
              additionalProperties: false
              properties:
                documentIds:
                  type: array
                  minItems: 1
                  items:
                    type: string
      responses:
        '200':
          description: One id only — a direct presigned download, never a zip.
          content:
            application/json:
              schema:
                type: object
                properties:
                  url: { type: string }
                  expiresIn: { type: integer, description: Seconds until the URL expires. }
                  fileName: { type: string }
                  displayName: { type: string, nullable: true }
                  single: { type: boolean, enum: [true] }
        '202':
          description: The job was recorded and queued.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BulkDownloadAccepted'
        '400':
          description: >-
            An unknown body parameter, a malformed `documentIds`, more documents than the caller's
            cap allows, or a selection over the total byte limit.
        '404':
          description: None of the requested documents are visible to this caller.
        '429':
          description: >-
            This requester is at a quota: either the maximum number of jobs in flight, or the
            number of jobs one requester may start in 24 hours. Both are counted per API key, per
            signed-in user, or per client address for anonymous callers. A job gives its in-flight
            slot back when it is refused, when it finishes, when it is cancelled, or when it runs
            out of retries — a failure that will be retried keeps its slot. The daily count only resets 24 hours after
            the requester's first job of the window.
        '503':
          description: >-
            Bulk download is disabled in this environment (no queue configured), or the job was
            recorded but could not be queued — in which case it is marked `failed` rather than left
            waiting for a worker that will never come.

  /api/bulk-downloads/{id}:
    get:
      summary: Bulk download status
      description: >-
        The job id is the capability. An anonymous job is answered to whoever holds its id; a job
        made by an authenticated caller is answered only to that caller, and anyone else gets 404
        rather than 403. A `running` job whose worker stopped reporting for longer than the queue's
        visibility timeout is reported as `failed`.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Job status, with one presigned URL per zip part once it is ready.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BulkDownloadStatus'
        '404':
          description: >-
            No such job, it belongs to another caller, or the id is not a job id. The three are
            deliberately indistinguishable.
    delete:
      summary: Cancel a bulk download
      description: >-
        Stops a job that is still `queued`, `running` or `failed`: the job becomes `cancelled` and
        the worker deletes the zip parts it had already written. `failed` is included because the
        queue redelivers such a job and the worker re-runs it. The requester's in-flight slot is
        given back if the job was still holding it. Idempotent — a job that already reached
        `ready`, `expired` or `cancelled` is left alone and answered 204 all the same. Same
        capability rule as the status read: an anonymous job is cancelled by whoever holds its id,
        an authenticated one only by the caller who made it.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: The job is cancelled, or had already finished. No body.
        '404':
          description: >-
            No such job, it belongs to another caller, or the id is not a job id. The three are
            deliberately indistinguishable.

  /api/sealed:
    post:
      summary: Seal a record
      description: >-
        Write a document into the sealed compartment — level 0
        (docs/rbac-architecture.md §1, "Level 0"). The row is an ordinary document in the ordinary
        container carrying `read: ['compliance']`, and only these routes read it — every other
        route excludes level 0 from every caller, the privileged ones, `systemAccess()` and the
        `compliance` holder alike. Requires the `compliance` role; every other role, `sysadmin`
        included, gets 403. Audited as `sealed.create`.
      security:
        - ApiKeyAuth: []
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [project, displayName, s3Key]
              properties:
                project:
                  type: string
                  description: Parent project id. The project must exist; its own level is not a cap.
                displayName:
                  type: string
                s3Key:
                  type: string
      responses:
        '201':
          description: Record sealed.
        '400':
          description: project, displayName or s3Key is missing.
        '401':
          description: Unauthorized.
        '403':
          description: The caller does not hold the compliance role.
        '404':
          description: Parent project not found.
    get:
      summary: List sealed records
      description: >-
        Ids, seal timestamps and titles of the sealed records this caller may read — enough to find
        a record and ask for it, never enough to read one. Audited as `sealed.list`.
      security:
        - ApiKeyAuth: []
        - BearerAuth: []
      parameters:
        - name: pageSize
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 1000
        - name: continuationToken
          in: query
          required: false
          schema:
            type: string
      responses:
        '200':
          description: A list of `{ id, projectId, sealedAt, title }`.
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id: { type: string }
                    projectId: { type: string }
                    sealedAt: { type: string, format: date-time }
                    title: { type: string }
        '401':
          description: Unauthorized.
        '403':
          description: The caller does not hold the compliance role.

  /api/sealed/{id}:
    get:
      summary: Read a sealed record
      description: >-
        The record, redacted by the field catalog like any other document read. A record that is
        not sealed answers 404 here: this route is the compartment, not a second door onto the
        ladder. Audited as `sealed.read` — reads are audited here and nowhere else in DEMI.
      security:
        - ApiKeyAuth: []
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: project
          in: query
          required: false
          schema:
            type: string
          description: Parent project id, the partition key. Avoids a cross-partition lookup.
      responses:
        '200':
          description: The sealed record.
        '401':
          description: Unauthorized.
        '403':
          description: The caller does not hold the compliance role.
        '404':
          description: No sealed record with this id.

  /api/sealed/{id}/download:
    get:
      summary: Presigned download for a sealed record's bytes
      description: >-
        The same short-lived presigned URL `GET /api/documents/{id}/download` hands out, gated the
        same way `GET /api/sealed/{id}` is: only the compartment's own access opens a level-0 row.
        A record that is not sealed answers 404 here, same as the metadata read. Audited as
        `sealed.download`.
      security:
        - ApiKeyAuth: []
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: project
          in: query
          required: false
          schema:
            type: string
          description: Parent project id, the partition key. Avoids a cross-partition lookup.
      responses:
        '200':
          description: A presigned download URL.
          content:
            application/json:
              schema:
                type: object
                properties:
                  url: { type: string }
                  expiresIn: { type: integer, description: Seconds until the URL expires. }
                  fileName: { type: string }
                  displayName: { type: string, nullable: true }
        '401':
          description: Unauthorized.
        '403':
          description: The caller does not hold the compliance role.
        '404':
          description: No sealed record with this id, or it has no stored file.

  /api/sealed/{id}/release:
    post:
      summary: Release a sealed record to level 1
      description: >-
        The ONLY exit from the sealed compartment — `PUT /api/documents/{id}/level` refuses level 0
        in both directions. Rewrites `read[]` to level 1 (team only), re-derives the record's chunk
        ACLs and its search-index row, and audits `sealed.release` with the case number and the
        decision. One compliance holder is enough; two-person release is a later policy toggle.
        That audit row is the record of the release; nobody is emailed.
      security:
        - ApiKeyAuth: []
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: project
          in: query
          required: false
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [caseNumber, decision]
              properties:
                caseNumber:
                  type: string
                decision:
                  type: string
      responses:
        '200':
          description: Record released to level 1.
        '400':
          description: caseNumber or decision is missing or empty.
        '401':
          description: Unauthorized.
        '403':
          description: The caller does not hold the compliance role.
        '404':
          description: No sealed record with this id.
        '500':
          description: Released, but the record's extracted text was not fully updated.

  /api/eagle/projects/{eagleId}:
    put:
      summary: Mirror a project from eagle-api
      description: |-
        Receives one project pushed by eagle-api on every write it makes, keyed by the Eagle
        `_id`. The body carries the RAW Eagle record — DEMI holds the merge rules, so the same
        record produces the same row here as a re-seed would. Idempotent: the same eagleId
        replaces. The DEMI id is the Track project id when the project is already matched to
        Track, otherwise `eagle-<eagleId>`. Enrichment blocks under `sources` other than
        `track`/`eagle` are preserved, and a change in publication state cascades onto the
        project's documents.
      security:
        - ApiKeyAuth: []
        - BearerAuth: []
      parameters:
        - name: eagleId
          in: path
          required: true
          description: The Eagle `_id` of the project. Must equal `doc._id` in the body.
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EaglePush'
      responses:
        '200':
          description: Project mirrored.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EaglePushResult'
        '400':
          description: |-
            Body is not `{ doc }`, `doc._id` disagrees with the path, or the record names no
            legislation block that holds content — a nameless project would otherwise be mirrored
            as published.
        '401':
          description: Unauthorized.
        '403':
          description: |-
            Forbidden. The credential is read-only — the mirror needs `demi-service-write` or
            higher.

  /api/eagle/documents/{eagleId}:
    put:
      summary: Mirror a document from eagle-api
      description: |-
        Receives one document pushed by eagle-api, keyed by the Eagle `_id`. The body carries the
        RAW Eagle record plus the labels for its four List ObjectId references. Idempotent: the
        same eagleId replaces. Two things are NOT taken from the push — extraction state, carried
        off the row already in DEMI, and the ACL, which is the lower of the document's own ladder
        level and its parent project's. `doc.project` may name a `ProjectNotification` instead of a
        project; such a document is partitioned under the notification's own id and keeps its own
        ACL, since a notification has no ACL to narrow against.

        eagle-api hard-deletes a document, so it pushes the record it removed with
        `doc.isDeleted: true`. The row is kept and narrowed to staff instead of deleted, and no
        later project publish widens it again.
      security:
        - ApiKeyAuth: []
        - BearerAuth: []
      parameters:
        - name: eagleId
          in: path
          required: true
          description: The Eagle `_id` of the document. Must equal `doc._id` in the body.
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EaglePush'
      responses:
        '200':
          description: Document mirrored.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EaglePushResult'
        '400':
          description: Body is not `{ doc }`, or `doc._id` disagrees with the path.
        '401':
          description: Unauthorized.
        '403':
          description: |-
            Forbidden. The credential is read-only — the mirror needs `demi-service-write` or
            higher.
        '404':
          description: The parent named by `doc.project` is in neither `projects` nor `notifications`.

  /api/eagle/updates/{eagleId}:
    put:
      summary: Mirror an Update from eagle-api
      description: |-
        Receives one Update (Eagle `RecentActivity`) pushed by eagle-api, keyed by the Eagle `_id`.
        The body carries the RAW Eagle record. Idempotent: the same eagleId replaces. Publication
        follows `read[]`, not `active`: an update whose ACL keeps it off the public site is
        mirrored but never announced. DEMI owns Updates, so it is also what tells eagle-notify
        about a publication — once per update, and again as a cancellation when a published update
        is withdrawn. A notification that fails is logged and retried by the next push; it never
        fails the mirror.
      security:
        - ApiKeyAuth: []
        - BearerAuth: []
      parameters:
        - name: eagleId
          in: path
          required: true
          description: The Eagle `_id` of the update. Must equal `doc._id` in the body.
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EaglePush'
      responses:
        '200':
          description: Update mirrored.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EaglePushResult'
        '400':
          description: Body is not `{ doc }`, or `doc._id` disagrees with the path.
        '401':
          description: Unauthorized.
        '403':
          description: |-
            Forbidden. The credential is read-only — the mirror needs `demi-service-write` or
            higher.

  /api/eagle/commentperiods/{eagleId}:
    put:
      summary: Mirror a comment period from eagle-api
      description: |-
        Receives one `CommentPeriod` pushed by eagle-api, keyed by the Eagle `_id`. The body
        carries the RAW Eagle record. The stored ACL is the period's own, CONSTRAINED to its
        project's: a period may never out-rank the project it belongs to, so one published under a
        project that is not stays private here. `doc.project` may name a `ProjectNotification`
        instead; that period is partitioned under the notification's own id and keeps its own ACL,
        since a notification has no ACL to narrow against.

        Whenever the stored level moves, the comments under the period are re-derived from it:
        `/search?dataset=Comment` filters on the comment's own ACL and never re-reads the period.

        eagle-api hard-deletes a period, so it pushes the record it removed with
        `doc.isDeleted: true`. The row is kept and narrowed to staff instead of deleted, and its
        comments are narrowed with it. Nothing in DEMI widens it again.
      security:
        - ApiKeyAuth: []
        - BearerAuth: []
      parameters:
        - name: eagleId
          in: path
          required: true
          description: The Eagle `_id` of the record. Must equal `doc._id` in the body.
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EaglePush'
      responses:
        '200':
          description: Record mirrored.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EaglePushResult'
        '400':
          description: Body is not `{ doc }`, or `doc._id` disagrees with the path.
        '401':
          description: Unauthorized.
        '403':
          description: |-
            Forbidden. The credential is read-only — the mirror needs `demi-service-write` or
            higher.
        '404':
          description: The parent named by `doc.project` is in neither `projects` nor `notifications`.
        '500':
          description: |-
            The period was mirrored, but the comments under it were not all re-derived. The push
            is not retried; the nightly reconcile reports the drift.

  /api/eagle/comments/{eagleId}:
    put:
      summary: Mirror a public comment from eagle-api
      description: |-
        Receives one `Comment` pushed by eagle-api, keyed by the Eagle `_id`. The body carries
        the RAW Eagle record. The stored ACL is the comment's own, CONSTRAINED to its period's
        (which is already constrained to the project's). The submitter's name is stored but is
        withheld from anonymous responses unless `isAnonymous` is explicitly false.
      security:
        - ApiKeyAuth: []
        - BearerAuth: []
      parameters:
        - name: eagleId
          in: path
          required: true
          description: The Eagle `_id` of the record. Must equal `doc._id` in the body.
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EaglePush'
      responses:
        '200':
          description: Record mirrored.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EaglePushResult'
        '400':
          description: Body is not `{ doc }`, or `doc._id` disagrees with the path.
        '401':
          description: Unauthorized.
        '403':
          description: |-
            Forbidden. The credential is read-only — the mirror needs `demi-service-write` or
            higher.
        '404':
          description: The comment period named by `doc.period` is not mirrored yet.

  /api/eagle/organizations/{eagleId}:
    put:
      summary: Mirror an organization from eagle-api
      description: |-
        Receives one `Organization` pushed by eagle-api, keyed by the Eagle `_id`. Stored in the
        `lists` container as `kind: Organization`. An organization is not project data, so its own
        `read[]` is the whole ACL.
      security:
        - ApiKeyAuth: []
        - BearerAuth: []
      parameters:
        - name: eagleId
          in: path
          required: true
          description: The Eagle `_id` of the record. Must equal `doc._id` in the body.
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EaglePush'
      responses:
        '200':
          description: Record mirrored.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EaglePushResult'
        '400':
          description: Body is not `{ doc }`, or `doc._id` disagrees with the path.
        '401':
          description: Unauthorized.
        '403':
          description: |-
            Forbidden. The credential is read-only — the mirror needs `demi-service-write` or
            higher.

  /api/eagle/notifications/{eagleId}:
    put:
      summary: Mirror a project notification from eagle-api
      description: |-
        Receives one `ProjectNotification` pushed by eagle-api, keyed by the Eagle `_id`. The
        record keeps its own `read[]`: `associatedProjectId` names a project that usually does not
        exist yet, so there is no parent to constrain against.
      security:
        - ApiKeyAuth: []
        - BearerAuth: []
      parameters:
        - name: eagleId
          in: path
          required: true
          description: The Eagle `_id` of the record. Must equal `doc._id` in the body.
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EaglePush'
      responses:
        '200':
          description: Record mirrored.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EaglePushResult'
        '400':
          description: Body is not `{ doc }`, or `doc._id` disagrees with the path.
        '401':
          description: Unauthorized.
        '403':
          description: |-
            Forbidden. The credential is read-only — the mirror needs `demi-service-write` or
            higher.

  /api/eagle/config/public:
    put:
      summary: Mirror the public site configuration from eagle-api
      description: |-
        Receives eagle-api's live public config and stores it as the `public` document that
        `GET /api/config/public` serves. The config mirror, and the reason that document is a live
        copy rather than a snapshot: eagle-api pushes on every `Config` write, so a hand edit in its
        Mongo lands here without anyone re-running the seeder.

        Unlike the record mirrors the body is the payload itself, not `{ doc }`, and there is no
        `{eagleId}`: there is one config document and Eagle has no id for it. Only the `PublicConfig`
        allowlist is stored, so eagle-api may push its whole `/api/config` and the `KEYCLOAK_*`
        block, `BUILD_ID` and `API_LOCATION` stay out of a document an anonymous site reads.
        Idempotent — the same body stores the same document.
      security:
        - ApiKeyAuth: []
        - BearerAuth: []
      requestBody:
        required: true
        description: >-
          eagle-api's config payload. Anything outside the allowlist is dropped rather than
          rejected; `ENVIRONMENT` and `ACCESS_GATE` are required because a payload missing either
          is not an eagle-api config, and a missing gate leaves the access curtain undecided.
        content:
          application/json:
            schema:
              type: object
              required: [ENVIRONMENT, ACCESS_GATE]
              properties:
                ENVIRONMENT:
                  type: string
                ACCESS_GATE:
                  type: boolean
              additionalProperties: true
              description: Extra keys are dropped to the `PublicConfig` allowlist.
      responses:
        '200':
          description: Stored. The body is the document as `GET /api/config/public` will serve it.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicConfig'
        '400':
          description: >-
            Body is not a JSON object, `ENVIRONMENT` is missing or empty, or `ACCESS_GATE` is not a
            boolean.
        '401':
          description: Unauthorized.
        '403':
          description: |-
            Forbidden. The credential is read-only — the mirror needs `demi-service-write` or
            higher.

  /api/links:
    get:
      summary: List short links
      description: |-
        Every short link, newest first. Read-only, so any authenticated caller may list — the rows
        carry no ACL and nothing secret. Each row carries `shortUrl` already composed, so a client
        never builds it from a second copy of the base URL.
      security:
        - ApiKeyAuth: []
        - BearerAuth: []
      responses:
        '200':
          description: The short links.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ShortLink'
        '401':
          description: Unauthorized.
    post:
      summary: Mint a short link
      description: |-
        Creates `<LINK_BASE_URL>/s/<code>` pointing at `url`. The destination must be `https:`,
        carry no credentials, and its hostname must equal or be a dot-suffix of an entry in
        `LINK_ALLOWED_HOSTS` (default `gov.bc.ca`) — checked here and never again at redirect time.

        Omit `code` and one is generated. Supply it for a vanity alias; a taken one is refused
        with 409 rather than replaced.
      security:
        - ApiKeyAuth: []
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ShortLinkInput'
      responses:
        '201':
          description: Short link created.
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: string
                  shortUrl:
                    type: string
                  url:
                    type: string
        '400':
          description: |-
            The destination failed validation, `note` is over 200 characters, or a supplied `code`
            is not 3-64 characters of `a-z0-9_-` (case-insensitive). The body says which.
        '401':
          description: Unauthorized.
        '403':
          description: Forbidden. The credential is read-only.
        '409':
          description: The supplied `code` is already in use.

  /api/links/{code}:
    put:
      summary: Repoint a short link
      description: |-
        Changes where an existing code sends the public. The redirect answers `no-store`, so a
        repoint takes effect on the next request — which is the reason the redirect is a 302.
      security:
        - ApiKeyAuth: []
        - BearerAuth: []
      parameters:
        - name: code
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - url
              properties:
                url:
                  type: string
      responses:
        '200':
          description: The updated short link.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShortLink'
        '400':
          description: The destination failed validation.
        '401':
          description: Unauthorized.
        '403':
          description: Forbidden. The credential is read-only.
        '404':
          description: Short link not found.
    delete:
      summary: Delete a short link
      description: |-
        Hard delete — the code stops resolving immediately and may be minted again. The audit row
        is the record that the link existed.
      security:
        - ApiKeyAuth: []
        - BearerAuth: []
      parameters:
        - name: code
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Short link deleted.
        '401':
          description: Unauthorized.
        '403':
          description: Forbidden. The credential is read-only.
        '404':
          description: Short link not found.

  /api/me/data:
    get:
      summary: Everything stored for the calling user
      description: |-
        One bootstrap read: preferences and saved map areas in a single response. The owner is
        taken from the bearer token, never from the request — there is no way to ask for another
        user's data. `prefs` falls back to the defaults (`map`, 6) when the user has saved none.

        A future stored type appears here without a new route.
      security:
        - BearerAuth: []
      responses:
        '200':
          description: The caller's data.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MyData'
        '401':
          description: Unauthorized.

  /api/me/lassos:
    put:
      summary: Save a map area
      description: |-
        Upsert by name: the name is slugified to `a-z0-9-` and that slug is the key, so saving the
        same name twice replaces the area rather than adding a second one. No `requireWrite` — this
        is the caller's own scratch data, so a read-only staff account may still save its own.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, ring]
              properties:
                name:
                  type: string
                  maxLength: 80
                ring:
                  type: array
                  items:
                    type: array
                    items:
                      type: number
      responses:
        '200':
          description: The saved area.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LassoItem'
        '400':
          description: |-
            The name is empty or over 80 characters, the ring is not 3-500 in-range
            `[longitude, latitude]` pairs, the body is over 64 KB, an unknown field was sent, or
            the user already holds 50 saved areas. The body says which.
        '401':
          description: Unauthorized.

  /api/me/lassos/{slug}:
    delete:
      summary: Delete a saved map area
      description: Deletes from the caller's own partition only.
      security:
        - BearerAuth: []
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Saved area deleted.
        '401':
          description: Unauthorized.
        '404':
          description: The caller has no saved area with that slug.

  /api/me/prefs:
    put:
      summary: Save the calling user's preferences
      description: |-
        Whole-object write of `{landing, perPage}`. Stored server-side so the preference follows
        the user across devices; the frontend keeps localStorage as a cache and the server value
        wins on load.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Prefs'
      responses:
        '200':
          description: The stored preferences.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Prefs'
        '400':
          description: '`landing` is not a known screen key, `perPage` is not 6, 12 or 24, or an unknown field was sent.'
        '401':
          description: Unauthorized.

  /api/credentials:
    post:
      summary: Grant a Selected Credential
      description: |-
        Gives one named party sight of specified records at levels 1-3, for a fixed window.
        `sysadmin` only. The grant changes no record, changes nobody else's access and never
        touches the field plane — the holder's own level still decides which attributes they see.

        `end` is required and enforced here rather than at login; 90 days is what the UI offers,
        not a cap. Renewal is the norm on EA timelines, so an expiring grant is replaced by a new
        one rather than edited. Supply `batchId` to mint several grants that one revoke takes back
        together; omit it and one is generated.
      security:
        - ApiKeyAuth: []
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [party, scope, levels, end]
              properties:
                party:
                  type: object
                  required: [type, id]
                  properties:
                    type:
                      type: string
                      enum: [user, group, apikey]
                    id:
                      type: string
                      description: Keycloak `sub`, a realm group name, or a registry key id.
                scope:
                  type: object
                  required: [type, ids]
                  properties:
                    type:
                      type: string
                      enum: [document, project]
                    ids:
                      type: array
                      maxItems: 200
                      items:
                        type: string
                levels:
                  type: array
                  description: >-
                    Record levels this grant admits. 0 is the sealed compartment and 4 is public;
                    neither can be granted.
                  items:
                    type: integer
                    minimum: 1
                    maximum: 3
                start:
                  type: string
                  format: date-time
                end:
                  type: string
                  format: date-time
                batchId:
                  type: string
                note:
                  type: string
              example:
                party:
                  type: user
                  id: 8f2c1a3e-0000-4b6d-9f11-2c9d5a7e4b10
                scope:
                  type: project
                  ids: ['207']
                levels: [1, 2]
                end: '2026-11-29T00:00:00.000Z'
                note: Working group, Skeena LNG
      responses:
        '201':
          description: The stored grant.
        '400':
          description: >-
            A missing or past `end`, an unknown `party.type` or `scope.type`, an empty scope, more
            than 200 scope ids, or `levels` naming 0 or 4. The body says which.
        '401':
          description: Unauthorized.
        '403':
          description: Forbidden. Requires role sysadmin.
    get:
      summary: List Selected Credentials
      description: |-
        Live grants held by one party, or live grants over one project. Exactly one of the two
        query parameters is required. `projectId` matches project-scoped grants only — a
        document-scoped grant names document ids.
      security:
        - ApiKeyAuth: []
        - BearerAuth: []
      parameters:
        - name: party
          in: query
          required: false
          schema:
            type: string
        - name: projectId
          in: query
          required: false
          schema:
            type: string
      responses:
        '200':
          description: The grants.
        '400':
          description: Neither party nor projectId was supplied.
        '401':
          description: Unauthorized.
        '403':
          description: Forbidden. Requires role sysadmin.

  /api/credentials/revoke:
    post:
      summary: Revoke Selected Credentials
      description: |-
        Ends grants by `id`, by `batchId`, by `party`, or over a `projectId` — exactly one
        selector per request. A revoke stamps `revokedAt`; the row stays as the record of what was
        granted and when it stopped. Each revoked grant is audited, and a set revoke adds one
        summary row.

        On the instance serving the request the effect is immediate; on any other it lands within
        the 60-second credential cache TTL.
      security:
        - ApiKeyAuth: []
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                id:
                  type: string
                batchId:
                  type: string
                party:
                  type: string
                projectId:
                  type: string
                cause:
                  type: string
                  description: Recorded in the audit row, e.g. `project-closed`.
      responses:
        '200':
          description: How many grants were revoked, and their ids.
        '400':
          description: No selector, or more than one.
        '401':
          description: Unauthorized.
        '403':
          description: Forbidden. Requires role sysadmin.

  /api/db/stats:
    get:
      summary: Item counts per container
      description: >-
        An operational reading of the whole database, counted under systemAccess() — the numbers
        are the container totals, not what the caller may read. Index-build state is on
        GET /api/admin/index-progress, which issues no container query.
      security:
        - ApiKeyAuth: []
        - BearerAuth: []
      responses:
        '200':
          description: One count per container, plus index-build progress when available.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  database:
                    type: string
                  connectionState:
                    type: string
                  driver:
                    type: string
                  stats:
                    type: object
                    properties:
                      projects:
                        type: integer
                        description: Every project row.
                      trackProjects:
                        type: integer
                        description: Projects with a Track counterpart.
                      unlinkedProjects:
                        type: integer
                        description: Eagle-sourced projects Track has no counterpart for.
                      documents:
                        type: integer
                        description: Every document row.
                      boundaries:
                        type: integer
                        description: Every administrative region boundary.
                      projectsWithCentroid:
                        type: integer
                        description: Projects carrying a usable centroid, so they can be map-placed.
                      documentsExtracted:
                        type: integer
                        description: Documents whose content has been extracted.
                      documentsExtractionErrors:
                        type: integer
                        description: Documents whose last extraction attempt failed.
                  indexProgress:
                    type: object
                    description: Index-build percentage per container, omitted when unreadable.
        '401':
          description: Unauthorized.

  /api/admin/audit:
    get:
      summary: The audit trail
      description: >-
        Audit rows over the chosen window, newest first, with a count per action over the whole
        window. Two tables in one answer: this app's rows in EagleAudit_CL, which every EPIC app
        writes to, unioned with the DemiAudit_CL rows written before the audit pipeline moved. The
        API queries Log Analytics with its own managed identity — the caller never reaches Azure.
        `action` and `actor` are matched against a fixed pattern before they reach the query;
        anything else is a 400.
      security:
        - ApiKeyAuth: []
        - BearerAuth: []
      parameters:
        - name: hours
          in: query
          required: false
          schema:
            type: integer
            enum: [24, 168, 720]
            default: 24
        - name: action
          in: query
          required: false
          description: Exact Action value, lower case and dots only.
          schema:
            type: string
            pattern: '^[a-z][a-z.]{0,40}$'
        - name: actor
          in: query
          required: false
          description: Matches either ActorId or ActorName.
          schema:
            type: string
            pattern: '^[\w.@-]{1,80}$'
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 500
            default: 100
      responses:
        '200':
          description: The rows, and the per-action counts behind the window total.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  hours:
                    type: integer
                  total:
                    type: integer
                    description: Rows in the window, which `limit` does not cap.
                  byAction:
                    type: array
                    items:
                      type: object
                      properties:
                        action:
                          type: string
                        count:
                          type: integer
                  rows:
                    type: array
                    items:
                      type: object
                      description: One audit row, from either table. SourceIp arrives already masked.
                      properties:
                        TimeGenerated:
                          type: string
                          format: date-time
                        EventId:
                          type: string
                        Action:
                          type: string
                        Outcome:
                          type: string
                        ActorId:
                          type: string
                        ActorName:
                          type: string
                        ActorType:
                          type: string
                        ActorRoles:
                          type: string
                        SourceIp:
                          type: string
                        TargetType:
                          type: string
                        TargetId:
                          type: string
                        ProjectId:
                          type: string
                        CorrelationId:
                          type: string
                        Env:
                          type: string
                        Detail:
                          type: string
        '400':
          description: An unlisted `hours`, a `limit` outside 1-500, or an `action`/`actor` that does not match its pattern.
        '401':
          description: Unauthorized.
        '403':
          description: Forbidden. Requires an admin role.
        '503':
          description: '`{ "error": "not configured" }` — AUDIT_WORKSPACE_CUSTOMER_ID is unset in this environment.'

  /api/admin/analytics:
    get:
      summary: DEMI usage and API request health
      description: >-
        The DemiEventsHourly_CL rollup over the window (events per day, top event names) beside
        AppRequests from the application workspace, for the same window and for the last 24 hours.
        The raw DemiEvents_CL table is Auxiliary-plan and is not read here. `peakHourUsers` is an
        upper bound: per-bucket distinct users summed within the busiest hour, so a user seen under
        two event names counts twice. It is not a window total — users are counted from AnonId, a
        daily-salted value, and per-hour distinct counts cannot be added together.
      security:
        - ApiKeyAuth: []
        - BearerAuth: []
      parameters:
        - name: days
          in: query
          required: false
          schema:
            type: integer
            enum: [7, 30]
            default: 7
      responses:
        '200':
          description: Usage and request health.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  days:
                    type: integer
                  totals:
                    type: object
                    properties:
                      events:
                        type: integer
                      peakHourUsers:
                        type: integer
                  perDay:
                    type: array
                    items:
                      type: object
                      properties:
                        day:
                          type: string
                          format: date-time
                        events:
                          type: integer
                        peakHourUsers:
                          type: integer
                  topEvents:
                    type: array
                    items:
                      type: object
                      properties:
                        name:
                          type: string
                        count:
                          type: integer
                  requests:
                    type: object
                    description: Null on either side when the workspace returned no rows for that window.
                    properties:
                      window:
                        $ref: '#/components/schemas/RequestStats'
                      last24h:
                        $ref: '#/components/schemas/RequestStats'
        '400':
          description: '`days` was neither 7 nor 30.'
        '401':
          description: Unauthorized.
        '403':
          description: Forbidden. Requires an admin role.
        '503':
          description: '`{ "error": "not configured" }` — AUDIT_WORKSPACE_CUSTOMER_ID or APP_LOGS_WORKSPACE_CUSTOMER_ID is unset.'

  /api/admin/cost:
    get:
      summary: Month-to-date Azure spend
      description: >-
        Actual cost for the resource group so far this month, by resource and by service, with the
        monthly budget beside it. Cached for an hour in Cosmos and shared by every instance, so
        `asOf` is when the figures were fetched rather than when they were asked for.
        `budget.spend` comes from Azure's own `currentSpend`, which has been seen reporting 0 —
        `total` is the figure to trust.

        Cost Management rate-limits per tenant. When it refuses, the last cached figures are
        returned with `stale: true` whatever their age; with nothing cached the answer is 503.
      security:
        - ApiKeyAuth: []
        - BearerAuth: []
      responses:
        '200':
          description: The month-to-date breakdown.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  asOf:
                    type: string
                    format: date-time
                  stale:
                    type: boolean
                    description: >-
                      Present and true only when Cost Management refused the refresh and these are
                      the cached figures. Read `asOf` for how old they are.
                  currency:
                    type: string
                    description: The subscription's billing currency, CAD here.
                  total:
                    type: number
                  byResource:
                    type: array
                    items:
                      type: object
                      properties:
                        resourceId:
                          type: string
                        cost:
                          type: number
                  byService:
                    type: array
                    items:
                      type: object
                      properties:
                        service:
                          type: string
                        cost:
                          type: number
                  budget:
                    type: object
                    nullable: true
                    description: Null when BUDGET_NAME is unset; the spend figures still come back.
                    properties:
                      name:
                        type: string
                      amount:
                        type: number
                      spend:
                        type: number
                      currency:
                        type: string
        '401':
          description: Unauthorized.
        '403':
          description: Forbidden. Requires an admin role.
        '503':
          description: >-
            `not configured` when COST_SCOPE is unset in this environment, or `cost data
            rate-limited by Azure, retry in a few minutes` when Cost Management refused and
            nothing is cached yet.

components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-Api-Key
      description: |-
        Registry key, `demi_<env>_<keyId>_<secret>`, issued by `POST /api/admin/api-keys` with its
        own roles. Roles a key may carry (`GRANTABLE_ROLES` in
        `src/controllers/nosql/api-key.js`), least privilege first:

          * `public`             — no privilege; the anonymous tier, named explicitly.
          * `compliance`         — the sealed compartment (level 0). Matched against each row's
                                   `read[]`, not privileged, and the only role admitted to
                                   `/api/sealed` — which is the only place it reads a sealed row.
                                   Every other route excludes level 0 from every caller, its holder
                                   included, so no sealed read goes unaudited. Only a caller that
                                   already holds it may mint a key carrying it — anyone else gets
                                   400 `compliance is not grantable by this caller`.
          * `demi-service-read`  — reads every row the ACL allows. Writes nothing.
          * `demi-service-write` — the same reads, plus every data write: projects, documents,
                                   chunks, boundaries and the Eagle mirror. Refused on
                                   `/api/admin/*`, so it cannot mint or revoke a key. This is what
                                   a machine writer (the eagle-api push, the extractor) holds.
          * `staff`, `sysadmin`, `demi-admin` — data writes AND `/api/admin/*`.

        A key carrying any write role must be minted with `allowWrite: true`.

        Machine callers that arrive through API Management present no key of their own: the
        gateway proves them, and `POST /api/admin/api-keys` with `id: apim:<subscription-name>`
        (the only id a caller may choose, and only in that shape) records the roles that
        subscription holds. Such a row carries no secret, never expires on its own — API
        Management owns the subscription's lifecycle — and 409s if the id already exists.
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |-
        Keycloak token, realm `eao-epic`. Privilege comes from `realm_access.roles`, read with the
        same meanings as the registry-key roles above. `project:<id>` roles are the orthogonal
        project-scope dimension and never enter the `read[]` predicate.

        A token that verifies but whose `azp` (or `client_id`) is not listed in
        `DEMI_ALLOWED_CLIENTS` is rejected with 401. The setting is required in test and prod; an
        empty list is permissive and only reachable in local development.

        When `SSO_AUDIENCE` is set, a token whose `aud` does not match it fails verification with
        401. Empty, which is what every environment ships today, means the claim is not checked.

  schemas:
    RequestStats:
      type: object
      nullable: true
      properties:
        requests:
          type: integer
        failed:
          type: integer
          description: Requests AppRequests recorded as unsuccessful.
        p95DurationMs:
          type: number
      description: One AppRequests summary row.
    BulkDownloadAccepted:
      type: object
      properties:
        id: { type: string, format: uuid, description: The job id, and the capability that reads it back. }
        status: { type: string, enum: [queued] }
        documentCount: { type: integer, description: Documents visible to this caller, so possibly fewer than were asked for. }
        estimatedPartCount: { type: integer, description: Zip parts the selection is expected to pack into. An estimate — a document with no recorded size counts as nothing here, so the real count can differ. Poll for `partCount`. }
        statusUrl: { type: string, example: /api/bulk-downloads/6f1c4b9e-0d2a-4d9d-9c3e-1f5f9a2b7c40 }
    BulkDownloadStatus:
      type: object
      properties:
        id: { type: string, format: uuid }
        status: { type: string, enum: [queued, running, ready, failed, expired, cancelled] }
        documentCount: { type: integer }
        partCount: { type: integer, description: Zip parts the job actually produced. 0 until the job is ready. }
        partsReady: { type: integer, description: Parts finished so far. }
        includedCount: { type: integer, description: Documents actually written into the zip. }
        errorCount: { type: integer }
        errors:
          type: array
          description: At most 100; the full list ships as errors.txt inside the last part.
          items:
            type: object
            properties:
              documentId: { type: string }
              name: { type: string, description: File name, empty when the document could not be read at all. }
              reason: { type: string, example: not available }
        bytes: { type: integer }
        parts:
          type: array
          description: Present only when ready. Fetch each URL in turn; the browser prompts once to allow several downloads.
          items:
            type: object
            properties:
              n: { type: integer }
              url: { type: string }
              bytes: { type: integer }
              count: { type: integer }
              expiresIn: { type: integer }
              fileName:
                type: string
                description: >-
                  Named after what the part holds: `EPIC documents - <project name>.zip`, or
                  `EPIC documents - <N> projects.zip` when the selection spans several. Several
                  parts add ` (part <n> of <partCount>)` before the extension. Baked into the
                  presigned URL as its content-disposition.
    Config:
      type: object
      description: >-
        App settings overlaid with the `config` document. Additional properties are possible: the
        overlay is bounded by `OVERRIDABLE_KEYS` in `src/controllers/config.js`, which is the list
        that decides what a stored value may change.
      properties:
        BUILD_ID:
          type: string
          description: >-
            Short git sha and deploy timestamp, read once at load from `build-id.txt` in the deploy
            package. `unknown` outside a packaged deploy. The document cannot override it — an
            env-var build id would prove a restart happened, not that new code is answering.
        ENVIRONMENT:
          type: string
        API_LOCATION:
          type: string
          description: Empty means same-origin `/api`.
        API_PATH:
          type: string
        KEYCLOAK_CLIENT_ID:
          type: string
        KEYCLOAK_URL:
          type: string
        KEYCLOAK_REALM:
          type: string
        KEYCLOAK_ENABLED:
          type: boolean
          description: >-
            Real JSON boolean. A stored value is only accepted when it is a boolean, so Bicep's
            `'True'` cannot switch a feature on or off through a string comparison.
        BANNER_COLOUR:
          type: string
        USE_MOCK_DATA:
          type: boolean
        configEndpoint:
          type: boolean

    PublicConfig:
      type: object
      additionalProperties: false
      description: >-
        The `PUBLIC_KEYS` allowlist in `src/controllers/config.js`, and nothing else. Every property
        is optional: what the `public` document does not carry is absent rather than defaulted, so
        a consumer that needs a key must treat its absence as "ask eagle-api instead". A field added
        to the document is not published until it is added to the allowlist too.
      properties:
        ENVIRONMENT:
          type: string
        BANNER_COLOUR:
          type: string
        LOG_LEVEL:
          type: string
        API_PATH:
          type: string
        SEARCH_API_PATH:
          type: string
          description: >-
            Where the public site sends search. `/demi-search` on test and prod; empty is the kill
            switch that sends it back to eagle-api's own search.
        DEMI_PROJECTS_PATH:
          type: string
        ADMIN_PATH:
          type: string
        CONTENT_SEARCH:
          type: boolean
        EAGLE_ANALYTICS_URL:
          type: string
        APPINSIGHTS_CONNECTION_STRING:
          type: string
          description: Ingestion endpoint and instrumentation key. Public by design, not a secret.
        SURVEY_URL:
          type: string
        SHOW_SURVEY_BANNER:
          type: boolean
        ACCESS_GATE:
          type: boolean
          description: >-
            Whether the public site closes its access curtain. A stored `false` is served as
            boolean `false`; absent is NOT `false`, which is why an unseeded document answers 503
            rather than a payload.

    MeBase:
      type: object
      properties:
        roles:
          type: array
          items:
            type: string
        level:
          type: integer
          minimum: 0
          maximum: 4
        tier:
          type: string
          enum: [privileged, scoped, public]
        privileged:
          type: boolean
          description: >-
            True when the caller holds a row-plane privileged role (`sysadmin`, `demi-admin`,
            `demi-service-*`). `staff` is not privileged.
        staffUi:
          type: boolean
          description: >-
            True when the caller passes authMiddleware; the frontend gates staff screens on it.
    Me:
      allOf:
        - $ref: '#/components/schemas/MeBase'
      properties:
        credentials:
          type: array
          description: >-
            The Selected Credentials this caller holds right now, and where the holder reads their
            own `end`. Revoked and out-of-window grants are absent. Empty for an anonymous caller.
            The grantor's view of the same rows is `GET /api/credentials`.
          items:
            type: object
            properties:
              id:
                type: string
              scope:
                type: object
                properties:
                  type:
                    type: string
                    enum: [document, project]
                  ids:
                    type: array
                    items:
                      type: string
              levels:
                type: array
                items:
                  type: integer
                  enum: [1, 2, 3]
              end:
                type: string
                format: date-time

    AccessSimulateRequest:
      type: object
      additionalProperties: false
      description: The caller to simulate. Every field is optional; an empty body is an anonymous one.
      properties:
        roles:
          type: array
          description: >-
            Realm roles. `team` and `idir` are stripped, as they are on a real token — a realm role
            must not forge a ladder token.
          items:
            type: string
        identityProvider:
          type: string
          nullable: true
          enum: [idir, bceid, github]
          description: The `identity_provider` claim. Only `idir` moves the caller to level 3.
        teams:
          type: array
          description: Project ids the caller is a team member of, as `project:<id>` realm roles.
          items:
            type: string
        projectScope:
          type: array
          description: >-
            Project ids a minted key restricts the caller to. Present, even empty, makes the tier
            `scoped`.
          items:
            type: string
        credential:
          type: object
          nullable: true
          additionalProperties: false
          description: >-
            A Selected Credential the caller holds, validated as `POST /credentials` would validate
            it. The window is supplied by the simulator.
          properties:
            scope:
              type: object
              properties:
                type:
                  type: string
                  enum: [document, project]
                ids:
                  type: array
                  items:
                    type: string
            levels:
              type: array
              items:
                type: integer
                enum: [1, 2, 3]

    AccessSimulateResponse:
      type: object
      description: >-
        The `Me` answer for the simulated caller, plus what it reaches on the row plane and the
        field plane.
      allOf:
        - $ref: '#/components/schemas/MeBase'
      properties:
        rows:
          type: object
          description: >-
            One entry per ladder level, keyed `1`-`4`. `read` is the `read[]` a record at that
            level stores. `via` names the arm that got the caller there: `role`, `team`,
            `credential`, or null when the row is out of reach.
          additionalProperties:
            type: object
            properties:
              readable:
                type: boolean
              via:
                type: string
                nullable: true
                enum: [role, team, credential]
              read:
                type: array
                items:
                  type: string
        fields:
          type: object
          description: >-
            Every catalogued field of each entity, including the plumbing keys pinned to level 0.
          properties:
            projects:
              type: array
              items:
                $ref: '#/components/schemas/AccessSimulateField'
            documents:
              type: array
              items:
                $ref: '#/components/schemas/AccessSimulateField'
        predicatesAssumedFalse:
          type: boolean
          description: >-
            Always true: no record is simulated, so every catalog `when` reads false and each field
            sits at its `defaultVis`.
        notes:
          type: object
          properties:
            sealedCompartment:
              type: string

    AccessSimulateField:
      type: object
      properties:
        field:
          type: string
        defaultVis:
          type: integer
        maxVis:
          type: integer
        when:
          type: string
          nullable: true
          description: Name of the catalog predicate that widens this field, or null.
        visible:
          type: boolean

    Project:
      type: object
      properties:
        _id:
          type: string
        trackProjectId:
          type: integer
        name:
          type: string
        region:
          type: string
        centroid:
          $ref: '#/components/schemas/GeoPoint'
        shortCode:
          type: string
          description: >-
            The project's short link code, minted once by the seed or the nightly Track sync for
            every project with an Eagle id. Absent on a project with no public page.
        shortUrl:
          type: string
          description: >-
            `shortCode` as a URL, composed per environment. Response only — it is never stored.
          example: https://projects.eao.gov.bc.ca/s/mkq7bt2r
    
    ProjectInput:
      type: object
      required:
        - trackProjectId
        - name
        - centroid
      properties:
        trackProjectId:
          type: integer
        name:
          type: string
        region:
          type: string
        centroid:
          $ref: '#/components/schemas/GeoPoint'

    DocumentInput:
      type: object
      required:
        - project
        - displayName
        - s3Key
      properties:
        project:
          type: string
        displayName:
          type: string
        s3Key:
          type: string
        region:
          type: string
        edrmsRecordNumber:
          type: string
        orcsClassification:
          type: string

    GeoPoint:
      type: object
      required:
        - type
        - coordinates
      properties:
        type:
          type: string
          enum: [Point]
        coordinates:
          type: array
          minItems: 2
          maxItems: 2
          items:
            type: number

    EaglePush:
      type: object
      required:
        - doc
      properties:
        doc:
          type: object
          description: |-
            The raw Eagle record, exactly as eagle-api stores it. `doc._id` must equal the
            `eagleId` path parameter. For a document, `doc.project` is the parent project's
            Eagle `_id` (or an object carrying it as `_id`).
        labels:
          type: object
          description: |-
            Documents only. The resolved `List` names for the record's ObjectId references, so
            DEMI stores the label beside the id without a List collection of its own.
          properties:
            type:
              type: string
            milestone:
              type: string
            projectPhase:
              type: string
            documentAuthorType:
              type: string

    EaglePushResult:
      type: object
      properties:
        id:
          type: string
          description: The DEMI id of the mirrored record.
        projectId:
          type: string
          description: Documents only — the parent project's DEMI id.
        action:
          type: string
          enum: [upsert, delete]
          description: |-
            `delete` when the push carried `doc.isDeleted: true`. Documents and comment periods
            only — the other mirrors always answer `upsert`.

    ShortLink:
      type: object
      properties:
        id:
          type: string
          description: The code. It is also the Cosmos id and partition key.
        url:
          type: string
          description: The destination, as validated when it was written.
        note:
          type: string
          nullable: true
          description: What the link is for, e.g. a campaign or poster reference.
        shortUrl:
          type: string
          description: '`LINK_BASE_URL` + `/s/` + the code, composed by the API.'
        createdAt:
          type: string
          format: date-time
        createdBy:
          type: string
        updatedAt:
          type: string
          format: date-time
          nullable: true
          description: Null until the link is repointed.
        personal:
          type: boolean
          description: >-
            True when the link is listed to its creator only. It is a listing filter, not access
            control: `GET /s/{code}` stays public, so anyone holding the short URL can still
            follow it.

    ShortLinkInput:
      type: object
      required:
        - url
      properties:
        url:
          type: string
          description: https only, no credentials, host on LINK_ALLOWED_HOSTS. Max 2048 characters.
        note:
          type: string
          maxLength: 200
        code:
          type: string
          pattern: '^[A-Za-z0-9_-]{3,64}$'
          description: >-
            Vanity alias: lowercase letters, digits, `_`, `-`, 3-64 characters. Case-insensitive
            on lookup — an uppercase value is lowercased before validation and storage. Omit for a
            generated 8-character code.
        personal:
          type: boolean
          default: false
          description: >-
            Hide the link from other callers' `GET /api/links`. The redirect stays public — anyone
            with the short URL can still open it.

    MyData:
      type: object
      properties:
        prefs:
          $ref: '#/components/schemas/Prefs'
        lassos:
          type: array
          items:
            $ref: '#/components/schemas/LassoItem'

    LassoItem:
      type: object
      properties:
        slug:
          type: string
          description: 'Derived from the name: `a-z0-9-`. The delete key, and unique per user.'
        name:
          type: string
          maxLength: 80
        ring:
          type: array
          description: 3-500 `[longitude, latitude]` pairs, GeoJSON order.
          items:
            type: array
            items:
              type: number
        updatedAt:
          type: string
          format: date-time

    Prefs:
      type: object
      required:
        - landing
        - perPage
      properties:
        landing:
          type: string
          description: The screen key the app opens on, e.g. `map`.
        perPage:
          type: integer
          enum: [6, 12, 24]
