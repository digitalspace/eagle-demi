# Build and publish the API to a Flex Consumption Function App.
#
# Extracted so the production rollback deploys through the SAME steps as the forward deploy. A
# copy of these steps in a rollback job is a copy that drifts, and it would drift in the one path
# nobody exercises until an outage.
#
# The caller checks out the ref to deploy first, at fetch-depth 0: this action packages the source
# tree it is pointed at, and BUILD_ID comes from `git describe --tags`, which needs the tag ancestry.
#
# `working-directory` separates the two: the SOURCE being packaged can be an old tag in a
# subdirectory, while the tooling (scripts/) always runs from the workspace root, which holds the
# checkout of the ref this workflow is running. Older tags do not carry these scripts.

name: Deploy API to a Flex app
description: Install, package and config-zip the API onto a Flex Consumption Function App, then wait for the function to register.

inputs:
  resource-group:
    description: Resource group holding the Function App.
    required: true
  app-name:
    description: Flex Consumption Function App to publish to.
    required: true
  client-id:
    description: Entra application (client) id of the deploy identity.
    required: true
  tenant-id:
    description: Entra tenant id.
    required: true
  subscription-id:
    description: Subscription holding the Function App.
    required: true
  working-directory:
    description: Directory holding the source to install and package, relative to the workspace root. Tooling under scripts/ is always read from the root.
    required: false
    default: '.'

runs:
  using: composite
  steps:
    - name: Azure Login
      uses: azure/login@v3
      with:
        client-id: ${{ inputs.client-id }}
        tenant-id: ${{ inputs.tenant-id }}
        subscription-id: ${{ inputs.subscription-id }}

    # Before setup-node: its Yarn 4 cache detection reads the corepack shim (actions/setup-node#1027).
    - name: Enable Corepack
      shell: bash
      run: corepack enable

    # 22 is the Flex host's runtime (azure/modules/api-function-flex.bicep).
    - name: Setup Node.js
      uses: actions/setup-node@v7
      with:
        node-version: '22'
        cache: 'yarn'
        cache-dependency-path: ${{ inputs.working-directory }}/yarn.lock

    # Dependencies only. Packaging belongs to `scripts/package-api.py`. demi-api-prod is retired
    # from serving and a deploy onto it broke it (2026-09-01) — the Flex app is the only target.
    - name: Install Dependencies
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: yarn install --immutable

    # Dev dependencies are half the package's file count, and the Flex extract phase is paid per
    # file. Nothing after this step needs them.
    - name: Drop dev dependencies from the package
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: yarn workspaces focus --production

    # `config-zip`: a Flex app has no Kudu wwwroot to POST into — it publishes to the deployment
    # blob container declared in the module.
    - name: Deploy API to the Flex app
      shell: bash
      env:
        AZURE_RESOURCE_GROUP: ${{ inputs.resource-group }}
        API_FLEX_APP_NAME: ${{ inputs.app-name }}
        SOURCE_DIR: ${{ inputs.working-directory }}
      run: |
        set -euo pipefail
        # BUILD_ID names the source being shipped, so `git describe` reads the source tree's tags.
        export BUILD_ID="$(git -C "$SOURCE_DIR" describe --tags --always --dirty)-$(date -u +%H%M%S)"
        python3 scripts/package-api.py "$SOURCE_DIR" /tmp/api-flex.zip
        az functionapp deployment source config-zip \
          -g "$AZURE_RESOURCE_GROUP" \
          -n "$API_FLEX_APP_NAME" \
          --src /tmp/api-flex.zip

    # `api` is the catch-all route in api/index.js; a deploy that registers nothing 404s every route.
    # Reads no repository file — it polls Azure — so it runs from the root like the rest of scripts/.
    - name: Verify the api function is registered
      shell: bash
      run: ./scripts/wait-for-function.sh "${{ inputs.resource-group }}" "${{ inputs.app-name }}" api
