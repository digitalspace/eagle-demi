# Deploy the OpenShift secret sync to the nonprod Flex Consumption app. Application only, same as
# the API workflow: the CI identity holds Website Contributor on the app and cannot run an ARM
# deployment. Infrastructure comes from scripts/deploy-infra.sh.

name: Deploy DEMI secret sync to Azure staging

on:
  push:
    branches:
      - main
    paths:
      - 'src/secret-sync/**'
      # The sync packages the shared logger and the config it reads its level from.
      - 'src/utils/**'
      - 'src/config.js'
      - 'scripts/package-secret-sync.sh'
      - '.github/workflows/azure-deploy-staging-secret-sync.yaml'
  workflow_dispatch:

concurrency:
  group: deploy-azure-staging-secret-sync
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read

env:
  SECRET_SYNC_APP_NAME: demi-secret-sync-test

jobs:
  deploy-secret-sync:
    name: Build & Deploy secret sync (Azure Function App)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Declaring an environment CHANGES THE OIDC SUBJECT CLAIM to
    # `repo:digitalspace/eagle-demi:environment:test`; only `gh-env-test` on demi-cicd-test matches it.
    environment: test
    env:
      AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Azure Login
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      # `config-zip`: a Flex app has no Kudu wwwroot to POST a zip into — it publishes to the
      # deployment blob container. No existence probe: a missing app must fail loudly, not skip.
      - name: Deploy the secret sync to the Flex app
        run: |
          set -euo pipefail
          ./scripts/package-secret-sync.sh . /tmp/secret-sync.zip
          az functionapp deployment source config-zip \
            -g "$AZURE_RESOURCE_GROUP" \
            -n "$SECRET_SYNC_APP_NAME" \
            --src /tmp/secret-sync.zip

      # The Event Grid subscription points at this function BY NAME. A deploy that registers
      # nothing leaves the subscription delivering to an endpoint that does not exist, and every
      # rotation is then dropped after its retries.
      - name: Verify the Event Grid trigger is registered
        run: ./scripts/wait-for-function.sh "$AZURE_RESOURCE_GROUP" "$SECRET_SYNC_APP_NAME" secretSyncVaultEvent

      - name: Verify the daily timer is registered
        run: ./scripts/wait-for-function.sh "$AZURE_RESOURCE_GROUP" "$SECRET_SYNC_APP_NAME" secretSyncDaily

      - name: Report failure to job summary
        if: failure()
        run: |
          echo "### ❌ Secret sync deployment failed" >> $GITHUB_STEP_SUMMARY
          echo "Check the step logs above for packaging, zipdeploy or trigger-registration errors." >> $GITHUB_STEP_SUMMARY
