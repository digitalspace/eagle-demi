# Publish the DEMI Angular bundle to the `$web` container of the staging static-website storage
# account, which is the Front Door origin. Application only. Details: wiki CI-Workflows.

name: Deploy DEMI Frontend to Azure staging

on:
  push:
    branches:
      - main
    paths:
      # The deploy runs `yarn --cwd frontend build`, so nothing outside this directory can change
      # the bundle. Root package.json / yarn.lock belong to the API.
      - 'frontend/**'
      - '.github/workflows/azure-deploy-staging-frontend.yaml'
  workflow_dispatch:

concurrency:
  group: deploy-azure-staging-frontend
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read

jobs:
  deploy-frontend:
    name: Build & Deploy Frontend (Azure Web App)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Declaring an environment CHANGES THE OIDC SUBJECT CLAIM to
    # `repo:digitalspace/eagle-demi:environment:test`; only `gh-env-test` on demi-cicd-test matches it.
    environment: test
    env:
      AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      # Rewritten in the SOURCE, before the build, so `yarn build` copies the corrected file. A
      # deploy that skips it serves the DEV realm while looking healthy — found live 2026-08-11.
      - name: Point env.js at the test environment
        env:
          APPINSIGHTS_CONNECTION_STRING: ${{ vars.APPINSIGHTS_CONNECTION_STRING_TEST }}
        run: ./scripts/point-env-js.sh test

      # Before setup-node: its Yarn 4 cache detection reads the corepack shim (actions/setup-node#1027).
      - name: Enable Corepack
        run: corepack enable

      # 24 to match pr.yaml, so the build that deploys runs on the runtime the build that gated it
      # ran on. Angular 22 floors Node at ^22.22.3 || ^24.15.0.
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'yarn'
          cache-dependency-path: frontend/yarn.lock

      # Dependencies only. The build belongs to the deploy script.
      - name: Install Frontend Dependencies
        run: yarn --cwd frontend install --immutable

      - name: Azure Login
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      # The script, not a bare `upload-batch`: it stamps Cache-Control per blob, which `$web` cannot
      # supply as a response header. Account name is a variable — bicep gives it a uniqueString suffix.
      - name: Deploy Frontend
        env:
          FRONTEND_STORAGE_ACCOUNT: ${{ vars.AZURE_FRONTEND_STORAGE_ACCOUNT }}
        run: ./scripts/deploy-azure.sh frontend "$AZURE_RESOURCE_GROUP"

      - name: Report Frontend Failure to Job Summary
        if: failure()
        run: |
          echo "### ❌ Frontend Deployment Failed" >> $GITHUB_STEP_SUMMARY
          echo "Check step logs above for env.js rewrite, build, or \$web upload errors." >> $GITHUB_STEP_SUMMARY
