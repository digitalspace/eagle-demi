# =============================================================================
# Build and Deploy the DEMI Frontend to Azure staging
# =============================================================================
# Publishes the Angular bundle to the `$web` container of the static-website storage
# account, which is the origin for the Front Door profile that lives in eagle-search.
#
# Frontend only. The API has its own file, `azure-deploy-staging-api.yaml`, and its own
# trigger. They were one workflow until 2026-08-05, which meant an Angular-only
# change redeployed the API and a controller change rebuilt the frontend. The two
# target different resources and share no build output, so they now run
# independently — including their concurrency groups.
#
# This workflow deploys the application only. It must NEVER deploy infrastructure.
# Infrastructure changes go through `az deployment group create` by hand with
# `azure/main.test.bicepparam` — CI holds no credential that could run an ARM
# deployment, and that is deliberate.
#
# The credential is scoped to match: `demi-cicd-test` holds Website Contributor on
# demi-api-fc-test, plus Storage Blob Data Contributor on the static-website account
# (assigned by `azure/modules/static-site.bicep` from `frontendUploaderPrincipalId`),
# plus Storage Account Contributor on that SAME account and nothing wider — see below.
# Nothing at resource-group scope, so it cannot run an ARM deployment even if a job
# were added. Keep it that way: do not add an infra job, and do not widen further.
# Note that a data-plane role is what publishing needs now; Website Contributor grants
# nothing on a storage account.
#
# Storage Account Contributor is there for exactly one call. The deploy script's first
# step turns static website hosting on (`az storage blob service-properties update
# --static-website`), which bicep cannot do because ARM has no property for it. That is
# a service-properties write needing
# `Microsoft.Storage/storageAccounts/blobServices/write`, and Storage Blob Data
# Contributor does not carry it — without the second assignment every deploy stops on a
# 403 before it builds. Narrow it to a custom role with that single action if the
# account-scoped grant ever reads as too broad.
#
# Bicep still gets validated, in `pr.yaml`. A template that will not compile is a
# pull-request problem; it has no bearing on whether a zipdeploy should run.
# =============================================================================

name: Deploy DEMI Frontend to Azure staging

on:
  push:
    branches:
      - main
    paths:
      # `frontend/**` is the whole trigger. The deploy runs `yarn --cwd frontend build`
      # and ships `frontend/dist`, so nothing outside this directory can change the
      # bundle. Root package.json / yarn.lock are the API's manifest — frontend has its
      # own — so they are deliberately absent.
      - 'frontend/**'
      - '.github/workflows/azure-deploy-staging-frontend.yaml'
  workflow_dispatch:

concurrency:
  group: deploy-azure-staging-frontend
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read

jobs:
  deploy-frontend:
    name: Build & Deploy Frontend (Azure Web App)
    runs-on: ubuntu-latest
    # Subscription, resource group and the two Azure ids all come from this
    # environment — only the app names below are pinned in the file.
    #
    # STAGING IS SPELLED `-test` IN AZURE: `demi-api-fc-test` and the `demiwebtest…`
    # storage account in `c4b0a8-test-rg`, subscription `c4b0a8-test`. The environment
    # model is dev = sandbox (redeployable, not wired to CI), test = staging, prod = prod.
    #
    # Declaring an environment CHANGES THE OIDC SUBJECT CLAIM. It becomes
    # `repo:digitalspace/eagle-demi:environment:test` instead of
    # `...:ref:refs/heads/main`, so only the `gh-env-test` federated credential on
    # demi-cicd-test matches. Remove the environment and Azure Login fails with
    # AADSTS700213; rename it and it fails the same way — create the credential for
    # the new subject BEFORE renaming anything here.
    environment: test
    steps:
      - name: Checkout repository
        # Kept byte-identical to the API workflow's checkout so the two cannot drift, NOT because
        # this path needs it: `git describe --tags` lives in deploy_api() in scripts/deploy-azure.sh
        # and the frontend path stamps no BUILD_ID today. Depth 0 is what the API path requires —
        # at the default depth of 1 the tag refs can arrive while HEAD has no ancestry path to them
        # and describe fails with "No tags can describe '<sha>'", which `fetch-tags: true` does not
        # fix. At roughly 67 MB and 296 commits the extra clone cost is noise, so matching costs
        # less than remembering which of the two workflows was allowed to differ.
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # env.js ships inside the bundle with DEV URLs baked in, and the app bootstraps its
      # /api/config fetch FROM env.js — so a staging deploy that skips this rewrite talks to
      # the DEV API and authenticates against the DEV realm while looking entirely healthy.
      # That is not hypothetical; it was found running live on 2026-08-11.
      #
      # Rewritten in the SOURCE, before the build, so `yarn build` copies the corrected file.
      # It used to be patched afterwards in `scripts/deploy-azure.sh`, on `frontend/dist`,
      # gated on the app name — one more place the guard could be missed.
      #
      # `sed` exits 0 when it matches NOTHING, so every rewrite is followed by a grep that
      # fails the job. A silent no-op is the exact failure being guarded against, and the
      # only way to see one is to assert the result.
      - name: Point env.js at the test environment
        run: |
          ENV_JS=frontend/public/env.js
          # API_LOCATION stays empty and API_PATH stays /api: the deployed bundle calls
          # same-origin /api, which Front Door routes to APIM (eagle-edge apiOrigin).
          sed -i "s|window.__env.configEndpoint = false|window.__env.configEndpoint = true|" "$ENV_JS"
          sed -i "s|window.__env.NOTIFY_API_LOCATION = '/notify-api'|window.__env.NOTIFY_API_LOCATION = 'https://notify-api-test.azurewebsites.net'|" "$ENV_JS"
          grep -qF "window.__env.NOTIFY_API_LOCATION = 'https://notify-api-test.azurewebsites.net'" "$ENV_JS" \
            || { echo "::error file=$ENV_JS::NOTIFY_API_LOCATION rewrite did not take"; exit 1; }
          grep -qF "window.__env.configEndpoint = true" "$ENV_JS" \
            || { echo "::error file=$ENV_JS::configEndpoint rewrite did not take"; exit 1; }
          sed -i 's|https://dev.loginproxy.gov.bc.ca|https://test.loginproxy.gov.bc.ca|g' "$ENV_JS"
          grep -qF 'https://test.loginproxy.gov.bc.ca' "$ENV_JS" \
            || { echo "::error file=$ENV_JS::Keycloak URL rewrite did not take — the bundle would use the DEV realm"; exit 1; }
          sed -i "s|window.__env.ENVIRONMENT = 'dev'|window.__env.ENVIRONMENT = 'test'|" "$ENV_JS"
          grep -qF "window.__env.ENVIRONMENT = 'test'" "$ENV_JS" \
            || { echo "::error file=$ENV_JS::ENVIRONMENT rewrite did not take — the banner would read 'dev'"; exit 1; }

      # 24 to match pr.yaml, so the build that deploys runs on the runtime the build
      # that gated it ran on. Angular 22 floors Node at ^22.22.3 || ^24.15.0, which
      # `'22'` also satisfies today — but only because setup-node resolves the newest
      # 22.x, which is not a guarantee worth depending on.
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      # Dependencies only. The build belongs to the deploy script, which runs
      # `yarn --cwd frontend build` itself — `angular.json` sets
      # `defaultConfiguration: production`, so there is nothing to pass.
      - name: Install Frontend Dependencies
        run: |
          corepack enable
          yarn --cwd frontend install --immutable

      # There is no "Check design CSS is in sync" step here: this workflow checks out
      # only eagle-demi, and eagle-design-kit/eagle-demi-admin are private repos in the
      # same org with no cross-repo Actions access granted (access_level: none), so
      # GITHUB_TOKEN cannot check them out — a PAT would be required, and this repo does
      # not add one for that. `sync-design-css.sh --check` still runs locally for devs
      # who have the sibling repos cloned next to this one; see its own header comment.
      - name: Azure Login
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      # `scripts/deploy-azure.sh`, not a bare `az storage blob upload-batch`: the script builds
      # the bundle and then stamps Cache-Control per blob, which $web cannot supply as a
      # response header and Front Door will happily cache the wrong way round without.
      #
      # The account name is a repository VARIABLE, not a literal: `main.bicep` names the
      # account with a uniqueString suffix (output `frontendStorageAccountName`), so it differs
      # per environment and cannot be written down here.
      #
      # A plain `run:` step, not `azure/cli`: that action runs in a container, and the script
      # needs THIS host's `az` login. `ubuntu-latest` already ships az, python3 and curl.
      - name: Deploy Frontend
        env:
          FRONTEND_STORAGE_ACCOUNT: ${{ vars.AZURE_FRONTEND_STORAGE_ACCOUNT }}
        run: ./scripts/deploy-azure.sh frontend ${{ vars.AZURE_RESOURCE_GROUP }}

      - name: Report Frontend Failure to Job Summary
        if: failure()
        run: |
          echo "### ❌ Frontend Deployment Failed" >> $GITHUB_STEP_SUMMARY
          echo "Check step logs above for env.js rewrite, build, or \$web upload errors." >> $GITHUB_STEP_SUMMARY
