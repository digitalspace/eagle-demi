# =============================================================================
# Build and Deploy the DEMI Frontend to Azure staging
# =============================================================================
# Deploys the Angular frontend to the Azure Web App `demi-frontend-test`.
#
# Frontend only. The API has its own file, `azure-deploy-staging-api.yaml`, and its own
# trigger. They were one workflow until 2026-08-05, which meant an Angular-only
# change redeployed the API and a controller change rebuilt the frontend. The two
# target different App Services and share no build output, so they now run
# independently — including their concurrency groups.
#
# This workflow deploys the application only. It must NEVER deploy infrastructure.
# Infrastructure changes go through `az deployment group create` by hand with
# `azure/main.test.bicepparam` — CI holds no credential that could run an ARM
# deployment, and that is deliberate.
#
# The credential is scoped to match: `demi-cicd-test` holds Website Contributor on
# demi-api-test and demi-frontend-test individually, nothing at resource-group scope,
# so it cannot run an ARM deployment even if a job were added. Keep it that way — do
# not add an infra job, and do not widen the role assignment.
#
# Bicep still gets validated, in `pr.yaml`. A template that will not compile is a
# pull-request problem; it has no bearing on whether a zipdeploy should run.
# =============================================================================

name: Deploy DEMI Frontend to Azure staging

on:
  push:
    branches:
      - main
    paths:
      # `frontend/**` is the whole trigger. The deploy runs `yarn --cwd frontend build`
      # and ships `frontend/dist`, so nothing outside this directory can change the
      # bundle. Root package.json / yarn.lock are the API's manifest — frontend has its
      # own — so they are deliberately absent.
      - 'frontend/**'
      - '.github/workflows/azure-deploy-staging-frontend.yaml'
  workflow_dispatch:

concurrency:
  group: deploy-azure-staging-frontend
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read

jobs:
  deploy-frontend:
    name: Build & Deploy Frontend (Azure Web App)
    runs-on: ubuntu-latest
    # Subscription, resource group and the two Azure ids all come from this
    # environment — only the app names below are pinned in the file.
    #
    # STAGING IS SPELLED `-test` IN AZURE: `demi-api-test` and `demi-frontend-test`
    # in `c4b0a8-test-rg`, subscription `c4b0a8-test`. The environment model is
    # dev = sandbox (redeployable, not wired to CI), test = staging, prod = prod.
    #
    # Declaring an environment CHANGES THE OIDC SUBJECT CLAIM. It becomes
    # `repo:digitalspace/eagle-demi:environment:test` instead of
    # `...:ref:refs/heads/main`, so only the `gh-env-test` federated credential on
    # demi-cicd-test matches. Remove the environment and Azure Login fails with
    # AADSTS700213; rename it and it fails the same way — create the credential for
    # the new subject BEFORE renaming anything here.
    environment: test
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      # 24 to match pr.yaml, so the build that deploys runs on the runtime the build
      # that gated it ran on. Angular 22 floors Node at ^22.22.3 || ^24.15.0, which
      # `'22'` also satisfies today — but only because setup-node resolves the newest
      # 22.x, which is not a guarantee worth depending on.
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      # Dependencies only. The build belongs to the deploy script, which runs
      # `yarn --cwd frontend build` itself — `angular.json` sets
      # `defaultConfiguration: production`, so there is nothing to pass.
      - name: Install Frontend Dependencies
        run: |
          corepack enable
          yarn --cwd frontend install --immutable

      - name: Azure Login
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      # `scripts/deploy-azure.sh`, not `az webapp deploy`. Beyond deploying, it PRUNES the
      # superseded hashed bundles that zipdeploy's merge leaves behind — by 2026-08-05 that was
      # 19 assets, 5.6 MB, of which 3 were referenced. The old workflow never pruned at all.
      #
      # A plain `run:` step, not `azure/cli`: that action runs in a container, and the script
      # needs THIS host's `az` login for `az account get-access-token`. `ubuntu-latest` already
      # ships az, python3, curl and zip.
      - name: Deploy Frontend
        env:
          FRONTEND_APP_NAME: demi-frontend-test
        run: ./scripts/deploy-azure.sh frontend ${{ vars.AZURE_RESOURCE_GROUP }}

      - name: Report Frontend Failure to Job Summary
        if: failure()
        run: |
          echo "### ❌ Frontend Deployment Failed" >> $GITHUB_STEP_SUMMARY
          echo "Check step logs above for details on build or Azure Web App deployment errors." >> $GITHUB_STEP_SUMMARY
