# Deploy the DEMI API to the staging Flex Consumption app. Application only: the CI identity holds
# Website Contributor on that one app, so it cannot run an ARM deployment. Details: wiki CI-Workflows.

name: Deploy DEMI API to Azure staging

on:
  push:
    branches:
      - main
    paths:
      # Mirrors `scripts/package-api.py`. The geojson lives under `frontend/` but is packaged with
      # the API, so it fires both deploy workflows — that is correct, not a bug.
      - 'src/**'
      - 'api/**'
      - 'index.js'
      - 'host.json'
      - 'package.json'
      - 'yarn.lock'
      - 'frontend/public/assets/geojson/**'
      - '.github/workflows/azure-deploy-staging-api.yaml'
  workflow_dispatch:

concurrency:
  group: deploy-azure-staging-api
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read

env:
  API_FLEX_APP_NAME: demi-api-fc-test

jobs:
  deploy-api:
    name: Build & Deploy API (Azure Function App)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Declaring an environment CHANGES THE OIDC SUBJECT CLAIM to
    # `repo:digitalspace/eagle-demi:environment:test`; only `gh-env-test` on demi-cicd-test matches it.
    environment: test
    env:
      AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
    steps:
      - name: Checkout repository
        # Depth 0 because BUILD_ID comes from `git describe --tags`: at depth 1 the tag refs arrive
        # with no ancestry path from HEAD and describe fails. `fetch-tags: true` does not fix it.
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Before setup-node: its Yarn 4 cache detection reads the corepack shim (actions/setup-node#1027).
      - name: Enable Corepack
        run: corepack enable

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'yarn'

      # Dependencies only. Packaging belongs to `scripts/package-api.py`.
      - name: Install Dependencies
        run: yarn install --immutable

      - name: Azure Login
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      # Dev dependencies are half the package's file count, and the Flex extract phase is paid per
      # file. Nothing after this step needs them.
      - name: Drop dev dependencies from the package
        run: yarn workspaces focus --production

      # `config-zip`: a Flex app has no Kudu wwwroot to POST a zip into — it publishes to the
      # deployment blob container. No existence probe: a missing app must fail loudly, not skip.
      - name: Deploy API to the Flex app
        run: |
          set -euo pipefail
          export BUILD_ID="$(git describe --tags --always --dirty)-$(date -u +%H%M%S)"
          python3 scripts/package-api.py . /tmp/api-flex.zip
          az functionapp deployment source config-zip \
            -g "$AZURE_RESOURCE_GROUP" \
            -n "$API_FLEX_APP_NAME" \
            --src /tmp/api-flex.zip

      # `api` is the catch-all route in api/index.js; a deploy that registers nothing 404s every route.
      - name: Verify the api function is registered
        run: ./scripts/wait-for-function.sh "$AZURE_RESOURCE_GROUP" "$API_FLEX_APP_NAME" api

      # Registered is not the same fact as serving. `/health` is liveness only and needs no auth
      # (src/http/routes.js), and host.json sets routePrefix "" so it is not under /api.
      - name: Smoke test the deployed API
        run: |
          set -euo pipefail
          # az functionapp show returns null hostname for Flex; default host is <app>.azurewebsites.net
          curl -fsS --retry 3 --retry-delay 5 "https://${API_FLEX_APP_NAME}.azurewebsites.net/health"

      - name: Report API Failure to Job Summary
        if: failure()
        run: |
          echo "### ❌ API Deployment Failed" >> $GITHUB_STEP_SUMMARY
          echo "Check step logs above for details on packaging or Azure Function App deployment errors." >> $GITHUB_STEP_SUMMARY
