# =============================================================================
# Build and Deploy the DEMI API to Azure staging
# =============================================================================
# Deploys the Node.js Express API to the Azure Function App `demi-api-test`.
#
# API only. The frontend has its own file, `azure-deploy-staging-frontend.yaml`, and its
# own trigger. They were one workflow until 2026-08-05, which meant an Angular-only
# change redeployed the API and a controller change rebuilt the frontend. The two
# target different App Services and share no build output, so they now run
# independently — including their concurrency groups.
#
# This workflow deploys the application only. It must NEVER deploy infrastructure.
# Infrastructure changes go through `az deployment group create` by hand with
# `azure/main.test.bicepparam` — CI holds no credential that could run an ARM
# deployment, and that is deliberate.
#
# The credential is scoped to match: `demi-cicd-test` holds Website Contributor on
# demi-api-test alone (the frontend is published to blob storage now, under a
# data-plane role), nothing at resource-group scope,
# so it cannot run an ARM deployment even if a job were added. Keep it that way — do
# not add an infra job, and do not widen the role assignment.
#
# Bicep still gets validated, in `pr.yaml`. A template that will not compile is a
# pull-request problem; it has no bearing on whether a zipdeploy should run.
# =============================================================================

name: Deploy DEMI API to Azure staging

on:
  push:
    branches:
      - main
    paths:
      # `scripts/package-api.py` is the authority on what ends up in the package, and
      # these paths mirror it. Two are easy to miss:
      #   - root `public/` is not in its `root_exclude_dirs`, so it ships.
      #   - `frontend/public/assets/geojson/**` is re-included by `include_subpaths` —
      #     the boundary seeder reads it at runtime in Azure. It is the one path under
      #     `frontend/` that belongs to the API package, so it fires BOTH workflows.
      #     That is correct, not a bug.
      - 'src/**'
      - 'api/**'
      - 'public/**'
      - 'index.js'
      - 'host.json'
      - 'package.json'
      - 'yarn.lock'
      - 'frontend/public/assets/geojson/**'
      - '.github/workflows/azure-deploy-staging-api.yaml'
  workflow_dispatch:

concurrency:
  group: deploy-azure-staging-api
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read

jobs:
  deploy-api:
    name: Build & Deploy API (Azure Function App)
    runs-on: ubuntu-latest
    # Subscription, resource group and the two Azure ids all come from this
    # environment — only the app names below are pinned in the file.
    #
    # STAGING IS SPELLED `-test` IN AZURE: `demi-api-test` in `c4b0a8-test-rg`,
    # subscription `c4b0a8-test`. The environment model is
    # dev = sandbox (redeployable, not wired to CI), test = staging, prod = prod.
    #
    # Declaring an environment CHANGES THE OIDC SUBJECT CLAIM. It becomes
    # `repo:digitalspace/eagle-demi:environment:test` instead of
    # `...:ref:refs/heads/main`, so only the `gh-env-test` federated credential on
    # demi-cicd-test matches. Remove the environment and Azure Login fails with
    # AADSTS700213; rename it and it fails the same way — create the credential for
    # the new subject BEFORE renaming anything here.
    environment: test
    steps:
      - name: Checkout repository
        # Full history, because BUILD_ID comes from `git describe --tags`. At the default
        # fetch-depth of 1 the tag refs can arrive while HEAD has no ancestry path to them, and
        # describe fails with "No tags can describe '<sha>'" — leaving the deployed app reporting
        # a bare sha with no version. `fetch-tags: true` does not fix that; only depth 0 does. At
        # roughly 67 MB and 296 commits the extra clone cost is noise.
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      # Dependencies only. Packaging belongs to `scripts/package-api.py`, which the deploy script
      # calls. The inline zip that used to live here pruned only frontend/.git/dist/.angular, so it
      # shipped .claude, test, azure, .github and scripts into wwwroot — exactly the debris
      # `scripts/validate-deploy.sh` checks for.
      - name: Install Dependencies
        run: |
          corepack enable
          yarn install --immutable

      - name: Azure Login
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      # `scripts/deploy-azure.sh`, not `az functionapp deployment source config-zip`. The CLI
      # reports success from its own exit code, which is not the same fact as the deployment
      # succeeding: on 2026-08-05 an oversized package left Kudu at status 1 for over thirty
      # minutes, the client was killed, and Azure went on listing an OLDER deployment as active —
      # a mismatch that reverts the app on the next container recycle.
      #
      # The script instead POSTs /api/zipdeploy?isAsync=true, polls the deployment RECORD to a
      # terminal state (4 = success, 3 = failed), and then probes /api/search/summary for a 401 to
      # prove the NEW build is the one answering. A plain `run:` step for the reason above.
      - name: Deploy API
        env:
          API_APP_NAME: demi-api-test
        run: ./scripts/deploy-azure.sh api ${{ vars.AZURE_RESOURCE_GROUP }}

      - name: Report API Failure to Job Summary
        if: failure()
        run: |
          echo "### ❌ API Deployment Failed" >> $GITHUB_STEP_SUMMARY
          echo "Check step logs above for details on packaging or Azure Function App deployment errors." >> $GITHUB_STEP_SUMMARY
