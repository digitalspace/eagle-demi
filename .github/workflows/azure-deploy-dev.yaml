# =============================================================================
# Build and Deploy DEMI to Azure Dev
# =============================================================================
# Triggered on push to main branch (when azure or application files change) or
# workflow_dispatch. Validates the Bicep template, deploys the Angular frontend to
# Azure Web App (demi-frontend-dev), and deploys the Node.js Express API to Azure
# Web App (demi-api-dev).
#
# This workflow does NOT deploy infrastructure, and must not be changed back.
# `azure/main.bicep` does not describe dev: it never instantiates cosmos-nosql,
# ai-search, identity, document-storage or frontend-web-app, and there is no VNet
# in the resource group. Deploying it would not converge dev, it would damage it.
# Infrastructure changes go through `az` by hand until the template is rewritten
# to match reality. See TODO.md.
#
# That guard used to rest on CI having no credential at all. It no longer does —
# AZURE_CLIENT_ID is now a real federated identity — so `validate-infra` having no
# Azure login is the ONLY thing standing between this file and a bad infra deploy.
# Do not add a login step to it.
#
# The credential is scoped to match: Website Contributor on demi-api-dev and
# demi-frontend-dev individually, nothing at resource-group scope. It cannot run
# an ARM deployment even if a login step were added.
# =============================================================================

name: Deploy DEMI to Azure Dev

on:
  push:
    branches:
      - main
    paths:
      - 'src/**'
      - 'api/**'
      - 'frontend/**'
      - 'azure/**'
      - 'package.json'
      - 'yarn.lock'
      - '.github/workflows/azure-deploy-dev.yaml'
  workflow_dispatch:

concurrency:
  group: deploy-azure-dev
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read

env:
  AZURE_SUBSCRIPTION_ID: 'd2f8d048-2af3-44fd-81cc-858c040001f2' # c4b0a8-dev - EPIC.AI
  AZURE_RESOURCE_GROUP: 'c4b0a8-dev-rg'
  LOCATION: 'canadacentral'

jobs:
  validate-infra:
    name: Validate Infrastructure Template (Bicep)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # No Azure login: `az bicep build` compiles locally. That is deliberate — it
      # keeps this gate working while CI has no credential, and it makes deploying
      # from here impossible rather than merely unauthenticated.
      - name: Validate Bicep Template
        run: |
          az bicep build --file ./azure/main.bicep

      - name: Report Validation Failure to Job Summary
        if: failure()
        run: |
          echo "### ❌ Bicep template failed to compile" >> $GITHUB_STEP_SUMMARY
          echo "Fix \`azure/main.bicep\` — the app deploy jobs are gated on this." >> $GITHUB_STEP_SUMMARY


  deploy-frontend:
    name: Build & Deploy Frontend (Azure Web App)
    needs: validate-infra
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      # Dependencies only. The build belongs to the deploy script, which runs
      # `yarn --cwd frontend build` itself — `angular.json` sets
      # `defaultConfiguration: production`, so there is nothing to pass.
      - name: Install Frontend Dependencies
        run: |
          corepack enable
          yarn --cwd frontend install --immutable

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}

      # `scripts/deploy-azure.sh`, not `az webapp deploy`. Beyond deploying, it PRUNES the
      # superseded hashed bundles that zipdeploy's merge leaves behind — by 2026-08-05 that was
      # 19 assets, 5.6 MB, of which 3 were referenced. This workflow never pruned at all.
      #
      # A plain `run:` step, not `azure/cli@v2`: that action runs in a container, and the script
      # needs THIS host's `az` login for `az account get-access-token`. `ubuntu-latest` already
      # ships az, python3, curl and zip.
      - name: Deploy Frontend
        run: ./scripts/deploy-azure.sh frontend ${{ env.AZURE_RESOURCE_GROUP }}

      - name: Report Frontend Failure to Job Summary
        if: failure()
        run: |
          echo "### ❌ Frontend Deployment Failed" >> $GITHUB_STEP_SUMMARY
          echo "Check step logs above for details on build or Azure Web App deployment errors." >> $GITHUB_STEP_SUMMARY


  deploy-api:
    name: Build & Deploy API (Azure Function App)
    needs: validate-infra
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      # Dependencies only. Packaging belongs to `scripts/package-api.py`, which the deploy script
      # calls. The inline zip that used to live here pruned only frontend/.git/dist/.angular, so it
      # shipped .claude, test, azure, .github and scripts into wwwroot — exactly the debris
      # `scripts/validate-deploy.sh` checks for.
      - name: Install Dependencies
        run: |
          corepack enable
          yarn install --immutable

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}

      # `scripts/deploy-azure.sh`, not `az functionapp deployment source config-zip`. The CLI
      # reports success from its own exit code, which is not the same fact as the deployment
      # succeeding: on 2026-08-05 an oversized package left Kudu at status 1 for over thirty
      # minutes, the client was killed, and Azure went on listing an OLDER deployment as active —
      # a mismatch that reverts the app on the next container recycle.
      #
      # The script instead POSTs /api/zipdeploy?isAsync=true, polls the deployment RECORD to a
      # terminal state (4 = success, 3 = failed), and then probes /api/search/summary for a 401 to
      # prove the NEW build is the one answering. A plain `run:` step for the reason above.
      - name: Deploy API
        run: ./scripts/deploy-azure.sh api ${{ env.AZURE_RESOURCE_GROUP }}

      - name: Report API Failure to Job Summary
        if: failure()
        run: |
          echo "### ❌ API Deployment Failed" >> $GITHUB_STEP_SUMMARY
          echo "Check step logs above for details on packaging or Azure Function App deployment errors." >> $GITHUB_STEP_SUMMARY
