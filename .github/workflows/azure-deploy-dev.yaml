# =============================================================================
# Build and Deploy DEMI to Azure Dev
# =============================================================================
# Triggered on push to main branch (when azure or application files change) or
# workflow_dispatch. Validates the Bicep template, deploys the Angular frontend to
# Azure Web App (demi-frontend-dev), and deploys the Node.js Express API to Azure
# Web App (demi-api-dev).
#
# This workflow does NOT deploy infrastructure, and must not be changed back.
# `azure/main.bicep` does not describe dev: it never instantiates cosmos-nosql,
# ai-search, identity, document-storage or frontend-web-app, and there is no VNet
# in the resource group. Deploying it would not converge dev, it would damage it.
# The only reason that was ever harmless is that CI cannot authenticate
# (AZURE_CLIENT_ID is missing) — so the hazard would arrive the moment somebody
# fixed the credential. Infrastructure changes go through `az` by hand until the
# template is rewritten to match reality. See TODO.md.
# =============================================================================

name: Deploy DEMI to Azure Dev

on:
  push:
    branches:
      - main
    paths:
      - 'src/**'
      - 'api/**'
      - 'frontend/**'
      - 'azure/**'
      - 'package.json'
      - 'yarn.lock'
      - '.github/workflows/azure-deploy-dev.yaml'
  workflow_dispatch:

concurrency:
  group: deploy-azure-dev
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read

env:
  AZURE_SUBSCRIPTION_ID: 'd2f8d048-2af3-44fd-81cc-858c040001f2' # c4b0a8-dev - EPIC.AI
  AZURE_RESOURCE_GROUP: 'c4b0a8-dev-rg'
  LOCATION: 'canadacentral'

jobs:
  validate-infra:
    name: Validate Infrastructure Template (Bicep)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # No Azure login: `az bicep build` compiles locally. That is deliberate — it
      # keeps this gate working while CI has no credential, and it makes deploying
      # from here impossible rather than merely unauthenticated.
      - name: Validate Bicep Template
        run: |
          az bicep build --file ./azure/main.bicep

      - name: Report Validation Failure to Job Summary
        if: failure()
        run: |
          echo "### ❌ Bicep template failed to compile" >> $GITHUB_STEP_SUMMARY
          echo "Fix \`azure/main.bicep\` — the app deploy jobs are gated on this." >> $GITHUB_STEP_SUMMARY


  deploy-frontend:
    name: Build & Deploy Frontend (Azure Web App)
    needs: validate-infra
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install & Build Frontend
        run: |
          cd frontend
          corepack enable
          yarn install --immutable
          yarn build --configuration production
          
          # Zip dist output for Web App deployment
          DIST_DIR=$(test -d dist/browser && echo "dist/browser" || echo "dist")
          cd $DIST_DIR
          zip -r /tmp/frontend.zip .

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy Frontend Zip to Azure Web App
        uses: azure/cli@v2
        with:
          inlineScript: |
            az webapp deploy -g ${{ env.AZURE_RESOURCE_GROUP }} -n demi-frontend-dev --src-path /tmp/frontend.zip --type zip

      - name: Report Frontend Failure to Job Summary
        if: failure()
        run: |
          echo "### ❌ Frontend Deployment Failed" >> $GITHUB_STEP_SUMMARY
          echo "Check step logs above for details on build or Azure Web App deployment errors." >> $GITHUB_STEP_SUMMARY


  deploy-api:
    name: Build & Deploy API (Azure Function App)
    needs: validate-infra
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Dependencies & Package API
        run: |
          corepack enable
          yarn install --immutable
          
          python3 -c "
          import zipfile, os
          with zipfile.ZipFile('/tmp/api.zip', 'w', zipfile.ZIP_DEFLATED) as z:
              for root, dirs, files in os.walk('.'):
                  # Prune ONLY at the repo root. Excluding these names at every depth also
                  # removed node_modules/**/dist (e.g. @mongodb-js/saslprep), which ships a
                  # broken app that 500s on every request.
                  if os.path.normpath(root) == '.':
                      dirs[:] = [d for d in dirs if d not in ['frontend', '.git', 'dist', '.angular']]
                  for file in files:
                      if file.endswith('.pyc') or file.endswith('.log'): continue
                      # Never ship local secrets — app settings supply env vars in Azure.
                      if file == '.env' or file.startswith('.env.'): continue
                      p = os.path.join(root, file)
                      z.write(p, os.path.relpath(p, '.'))
          "

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy API Zip to Azure Function App
        uses: azure/cli@v2
        with:
          inlineScript: |
            az functionapp deployment source config-zip -g ${{ env.AZURE_RESOURCE_GROUP }} -n demi-api-dev --src /tmp/api.zip

      - name: Report API Failure to Job Summary
        if: failure()
        run: |
          echo "### ❌ API Deployment Failed" >> $GITHUB_STEP_SUMMARY
          echo "Check step logs above for details on packaging or Azure Function App deployment errors." >> $GITHUB_STEP_SUMMARY
