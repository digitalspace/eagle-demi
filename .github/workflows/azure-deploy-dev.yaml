# =============================================================================
# Build and Deploy DEMI to Azure Dev
# =============================================================================
# Triggered on push to main branch (when azure or application files change) or
# workflow_dispatch. Provisions Bicep IaC with DEMI tags, deploys Angular frontend
# to Azure Web App (demi-frontend-dev), and deploys Node.js Express API to Azure
# Web App (demi-api-dev).
# =============================================================================

name: Deploy DEMI to Azure Dev

on:
  push:
    branches:
      - main
    paths:
      - 'src/**'
      - 'api/**'
      - 'frontend/**'
      - 'azure/**'
      - 'package.json'
      - 'yarn.lock'
      - '.github/workflows/azure-deploy-dev.yaml'
  workflow_dispatch:

concurrency:
  group: deploy-azure-dev
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read

env:
  AZURE_SUBSCRIPTION_ID: 'd2f8d048-2af3-44fd-81cc-858c040001f2' # c4b0a8-dev - EPIC.AI
  AZURE_RESOURCE_GROUP: 'c4b0a8-dev-rg'
  LOCATION: 'canadacentral'

jobs:
  deploy-infra:
    name: Provision Infrastructure (Bicep)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check Credentials
        id: check-creds
        run: |
          if [ -n "${{ secrets.AZURE_CLIENT_ID }}" ] || [ -n "${{ secrets.AZURE_CREDENTIALS }}" ]; then
            echo "has_creds=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_creds=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Azure credentials (AZURE_CLIENT_ID or AZURE_CREDENTIALS) not set in repository secrets."
          fi

      - name: Azure Login
        if: steps.check-creds.outputs.has_creds == 'true'
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}
          creds: ${{ secrets.AZURE_CREDENTIALS }}
          allow-no-subscriptions: true

      - name: Validate Bicep Template
        if: steps.check-creds.outputs.has_creds == 'true'
        run: |
          az bicep build --file ./azure/main.bicep

      - name: Create Resource Group if not exists
        if: steps.check-creds.outputs.has_creds == 'true'
        uses: azure/cli@v2
        with:
          inlineScript: |
            az group create --name ${{ env.AZURE_RESOURCE_GROUP }} --location ${{ env.LOCATION }} --tags Project=DEMI Application=eagle-demi Environment=dev CostCenter=c4b0a8 ManagedBy=Bicep

      - name: Deploy Bicep IaC
        if: steps.check-creds.outputs.has_creds == 'true'
        uses: azure/arm-deploy@v1
        with:
          scope: resourcegroup
          resourceGroupName: ${{ env.AZURE_RESOURCE_GROUP }}
          template: ./azure/main.bicep
          parameters: ./azure/main.bicepparam minioAccessKey="${{ secrets.MINIO_ACCESS_KEY || 'minio' }}" minioSecretKey="${{ secrets.MINIO_SECRET_KEY || 'minio123' }}" typesenseApiKey="${{ secrets.TYPESENSE_API_KEY || 'demi-typesense-dev-key' }}"


  deploy-frontend:
    name: Build & Deploy Frontend (Azure Web App)
    needs: deploy-infra
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check Credentials
        id: check-creds
        run: |
          if [ -n "${{ secrets.AZURE_CLIENT_ID }}" ] || [ -n "${{ secrets.AZURE_CREDENTIALS }}" ]; then
            echo "has_creds=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_creds=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Azure credentials not set in repository secrets."
          fi

      - name: Setup Node.js
        if: steps.check-creds.outputs.has_creds == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install & Build Frontend
        if: steps.check-creds.outputs.has_creds == 'true'
        run: |
          cd frontend
          corepack enable
          yarn install --immutable
          yarn build --configuration production
          
          # Zip dist output for Web App deployment
          DIST_DIR=$(test -d dist/browser && echo "dist/browser" || echo "dist")
          cd $DIST_DIR
          zip -r /tmp/frontend.zip .

      - name: Azure Login
        if: steps.check-creds.outputs.has_creds == 'true'
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}
          creds: ${{ secrets.AZURE_CREDENTIALS }}
          allow-no-subscriptions: true

      - name: Deploy Frontend Zip to Azure Web App
        if: steps.check-creds.outputs.has_creds == 'true'
        uses: azure/cli@v2
        with:
          inlineScript: |
            az webapp deploy -g ${{ env.AZURE_RESOURCE_GROUP }} -n demi-frontend-dev --src-path /tmp/frontend.zip --type zip


  deploy-api:
    name: Build & Deploy API (Azure Web App)
    needs: deploy-infra
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check Credentials
        id: check-creds
        run: |
          if [ -n "${{ secrets.AZURE_CLIENT_ID }}" ] || [ -n "${{ secrets.AZURE_CREDENTIALS }}" ]; then
            echo "has_creds=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_creds=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Azure credentials not set in repository secrets."
          fi

      - name: Setup Node.js
        if: steps.check-creds.outputs.has_creds == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Dependencies & Package API
        if: steps.check-creds.outputs.has_creds == 'true'
        run: |
          corepack enable
          yarn install --immutable
          
          python3 -c "
          import zipfile, os
          with zipfile.ZipFile('/tmp/api.zip', 'w', zipfile.ZIP_DEFLATED) as z:
              for root, dirs, files in os.walk('.'):
                  dirs[:] = [d for d in dirs if d not in ['frontend', '.git', 'dist', '.angular']]
                  for file in files:
                      if file.endswith('.pyc') or file.endswith('.log'): continue
                      p = os.path.join(root, file)
                      z.write(p, os.path.relpath(p, '.'))
          "

      - name: Azure Login
        if: steps.check-creds.outputs.has_creds == 'true'
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}
          creds: ${{ secrets.AZURE_CREDENTIALS }}
          allow-no-subscriptions: true

      - name: Deploy API Zip to Azure Web App
        if: steps.check-creds.outputs.has_creds == 'true'
        uses: azure/cli@v2
        with:
          inlineScript: |
            az webapp deploy -g ${{ env.AZURE_RESOURCE_GROUP }} -n demi-api-dev --src-path /tmp/api.zip --type zip
