# =============================================================================
# Build and Deploy DEMI to Azure Prod
# =============================================================================
# Triggered on workflow_dispatch or tag/release.
# =============================================================================

name: Deploy DEMI to Azure Prod

on:
  workflow_dispatch:

concurrency:
  group: deploy-azure-prod
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read

env:
  AZURE_SUBSCRIPTION_ID: 'be5924ac-1083-4a1b-be92-7b444882cfd9' # c4b0a8-prod - EPIC.AI
  AZURE_RESOURCE_GROUP: 'c4b0a8-prod-rg'
  LOCATION: 'canadacentral'

jobs:
  deploy-infra:
    name: Provision Infrastructure (Bicep)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check Credentials
        id: check-creds
        run: |
          if [ -n "${{ secrets.AZURE_CLIENT_ID }}" ] || [ -n "${{ secrets.AZURE_CREDENTIALS }}" ]; then
            echo "has_creds=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_creds=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Azure credentials not set in repository secrets."
          fi

      - name: Azure Login
        if: steps.check-creds.outputs.has_creds == 'true'
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}
          creds: ${{ secrets.AZURE_CREDENTIALS }}
          allow-no-subscriptions: true

      - name: Validate Bicep Template
        if: steps.check-creds.outputs.has_creds == 'true'
        run: |
          az bicep build --file ./azure/main.bicep

      - name: Create Resource Group if not exists
        if: steps.check-creds.outputs.has_creds == 'true'
        uses: azure/cli@v2
        with:
          inlineScript: |
            az group create --name ${{ env.AZURE_RESOURCE_GROUP }} --location ${{ env.LOCATION }} --tags Project=DEMI Application=eagle-demi Environment=prod CostCenter=c4b0a8 ManagedBy=Bicep

      - name: Deploy Bicep IaC
        if: steps.check-creds.outputs.has_creds == 'true'
        uses: azure/arm-deploy@v1
        with:
          scope: resourcegroup
          resourceGroupName: ${{ env.AZURE_RESOURCE_GROUP }}
          template: ./azure/main.bicep
          parameters: ./azure/main.bicepparam environmentName=prod minioAccessKey="${{ secrets.MINIO_ACCESS_KEY }}" minioSecretKey="${{ secrets.MINIO_SECRET_KEY }}" typesenseApiKey="${{ secrets.TYPESENSE_API_KEY }}"


  deploy-frontend:
    name: Build & Deploy Frontend (Azure Web App)
    needs: deploy-infra
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check Credentials
        id: check-creds
        run: |
          if [ -n "${{ secrets.AZURE_CLIENT_ID }}" ] || [ -n "${{ secrets.AZURE_CREDENTIALS }}" ]; then
            echo "has_creds=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_creds=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Node.js
        if: steps.check-creds.outputs.has_creds == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install & Build Frontend
        if: steps.check-creds.outputs.has_creds == 'true'
        run: |
          cd frontend
          corepack enable
          yarn install --immutable
          yarn build --configuration production
          DIST_DIR=$(test -d dist/browser && echo "dist/browser" || echo "dist")
          cd $DIST_DIR
          zip -r /tmp/frontend.zip .

      - name: Azure Login
        if: steps.check-creds.outputs.has_creds == 'true'
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}
          creds: ${{ secrets.AZURE_CREDENTIALS }}
          allow-no-subscriptions: true

      - name: Deploy Frontend Zip to Azure Web App
        if: steps.check-creds.outputs.has_creds == 'true'
        uses: azure/cli@v2
        with:
          inlineScript: |
            az webapp deploy -g ${{ env.AZURE_RESOURCE_GROUP }} -n demi-frontend-prod --src-path /tmp/frontend.zip --type zip


  deploy-api:
    name: Build & Deploy API (Azure Function App)
    needs: deploy-infra
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check Credentials
        id: check-creds
        run: |
          if [ -n "${{ secrets.AZURE_CLIENT_ID }}" ] || [ -n "${{ secrets.AZURE_CREDENTIALS }}" ]; then
            echo "has_creds=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_creds=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Node.js
        if: steps.check-creds.outputs.has_creds == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Dependencies & Package API
        if: steps.check-creds.outputs.has_creds == 'true'
        run: |
          corepack enable
          yarn install --immutable
          python3 -c "
          import zipfile, os
          with zipfile.ZipFile('/tmp/api.zip', 'w', zipfile.ZIP_DEFLATED) as z:
              for root, dirs, files in os.walk('.'):
                  dirs[:] = [d for d in dirs if d not in ['frontend', '.git', 'dist', '.angular']]
                  for file in files:
                      if file.endswith('.pyc') or file.endswith('.log'): continue
                      p = os.path.join(root, file)
                      z.write(p, os.path.relpath(p, '.'))
          "

      - name: Azure Login
        if: steps.check-creds.outputs.has_creds == 'true'
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}
          creds: ${{ secrets.AZURE_CREDENTIALS }}
          allow-no-subscriptions: true

      - name: Deploy API Zip to Azure Function App
        if: steps.check-creds.outputs.has_creds == 'true'
        uses: azure/cli@v2
        with:
          inlineScript: |
            az functionapp deployment source config-zip -g ${{ env.AZURE_RESOURCE_GROUP }} -n demi-api-prod --src /tmp/api.zip
