# =============================================================================
# Build and Deploy DEMI to Azure Prod
# =============================================================================
# Triggered on push to main branch (when azure or application files change) or
# workflow_dispatch. Provisions Bicep IaC with DEMI tags, deploys Angular frontend
# to Azure Web App (demi-frontend-prod), and deploys Node.js Express API to Azure
# Web App (demi-api-prod).
# =============================================================================

name: Deploy DEMI to Azure Prod

on:
  push:
    branches:
      - main
    paths:
      - 'src/**'
      - 'api/**'
      - 'frontend/**'
      - 'azure/**'
      - 'package.json'
      - 'yarn.lock'
      - '.github/workflows/azure-deploy-prod.yaml'
  workflow_dispatch:

concurrency:
  group: deploy-azure-prod
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read

env:
  AZURE_SUBSCRIPTION_ID: 'd2f8d048-2af3-44fd-81cc-858c040001f2' # c4b0a8-prod - EPIC.AI
  AZURE_RESOURCE_GROUP: 'c4b0a8-prod-rg'
  LOCATION: 'canadacentral'

jobs:
  deploy-infra:
    name: Provision Infrastructure (Bicep)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}

      - name: Validate Bicep Template
        run: |
          az bicep build --file ./azure/main.bicep

      - name: Create Resource Group if not exists
        uses: azure/cli@v2
        with:
          inlineScript: |
            az group create --name ${{ env.AZURE_RESOURCE_GROUP }} --location ${{ env.LOCATION }} --tags Project=DEMI Application=eagle-demi Environment=prod CostCenter=c4b0a8 ManagedBy=Bicep

      - name: Deploy Bicep IaC
        uses: azure/arm-deploy@v1
        with:
          scope: resourcegroup
          resourceGroupName: ${{ env.AZURE_RESOURCE_GROUP }}
          template: ./azure/main.bicep
          parameters: ./azure/main.bicepparam environmentName=prod minioAccessKey="${{ secrets.MINIO_ACCESS_KEY }}" minioSecretKey="${{ secrets.MINIO_SECRET_KEY }}" typesenseApiKey="${{ secrets.TYPESENSE_API_KEY }}"

      - name: Report Infrastructure Failure to Job Summary
        if: failure()
        uses: azure/cli@v2
        with:
          inlineScript: |
            echo "### ❌ Infrastructure Deployment Failed" >> $GITHUB_STEP_SUMMARY
            echo "#### Azure Deployment Error Diagnostics:" >> $GITHUB_STEP_SUMMARY
            echo "\`\`\`json" >> $GITHUB_STEP_SUMMARY
            az deployment group list -g ${{ env.AZURE_RESOURCE_GROUP }} --query "[0].properties.error" -o json >> $GITHUB_STEP_SUMMARY 2>&1 || echo "No deployment error details found." >> $GITHUB_STEP_SUMMARY
            echo "\`\`\`" >> $GITHUB_STEP_SUMMARY


  deploy-frontend:
    name: Build & Deploy Frontend (Azure Web App)
    needs: deploy-infra
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install & Build Frontend
        run: |
          cd frontend
          corepack enable
          yarn install --immutable
          yarn build --configuration production
          
          # Zip dist output for Web App deployment
          DIST_DIR=$(test -d dist/browser && echo "dist/browser" || echo "dist")
          cd $DIST_DIR
          zip -r /tmp/frontend.zip .

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy Frontend Zip to Azure Web App
        uses: azure/cli@v2
        with:
          inlineScript: |
            az webapp deploy -g ${{ env.AZURE_RESOURCE_GROUP }} -n demi-frontend-prod --src-path /tmp/frontend.zip --type zip

      - name: Report Frontend Failure to Job Summary
        if: failure()
        run: |
          echo "### ❌ Frontend Deployment Failed" >> $GITHUB_STEP_SUMMARY
          echo "Check step logs above for details on build or Azure Web App deployment errors." >> $GITHUB_STEP_SUMMARY


  deploy-api:
    name: Build & Deploy API (Azure Function App)
    needs: deploy-infra
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Dependencies & Package API
        run: |
          corepack enable
          yarn install --immutable
          
          python3 -c "
          import zipfile, os
          with zipfile.ZipFile('/tmp/api.zip', 'w', zipfile.ZIP_DEFLATED) as z:
              for root, dirs, files in os.walk('.'):
                  dirs[:] = [d for d in dirs if d not in ['frontend', '.git', 'dist', '.angular']]
                  for file in files:
                      if file.endswith('.pyc') or file.endswith('.log'): continue
                      p = os.path.join(root, file)
                      z.write(p, os.path.relpath(p, '.'))
          "

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy API Zip to Azure Function App
        uses: azure/cli@v2
        with:
          inlineScript: |
            az functionapp deployment source config-zip -g ${{ env.AZURE_RESOURCE_GROUP }} -n demi-api-prod --src /tmp/api.zip

      - name: Report API Failure to Job Summary
        if: failure()
        run: |
          echo "### ❌ API Deployment Failed" >> $GITHUB_STEP_SUMMARY
          echo "Check step logs above for details on packaging or Azure Function App deployment errors." >> $GITHUB_STEP_SUMMARY
