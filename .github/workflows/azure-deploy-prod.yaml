# Deploy DEMI to production from a released tag, dispatch only. There is no `push:` trigger here and
# there must never be one. Prerequisites, approval gate and the publish step: wiki Release-Process.

name: Deploy DEMI to Azure production

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Tag to deploy (e.g. v1.2.3). Every push to main cuts one — pick the one verified on staging. Do NOT publish its draft first; this workflow publishes it after a green deploy.'
        required: true
        type: string
      allow_missing_schema_probe:
        description: 'first deploy after the /health/search-schema endpoint; skips the gate when the running app answers 404'
        required: false
        default: false
        type: boolean

concurrency:
  group: deploy-azure-prod
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read

env:
  # Still `eagle-extractor-*`: the code moved repositories, the deployed app did not.
  EXTRACTOR_APP_NAME: eagle-extractor-prod
  API_FLEX_APP_NAME: demi-api-fc-prod
  # The app's own host, the same one the staging workflow smokes. Not the public
  # www.projects.eao.gov.bc.ca/demi-search path: that answer also depends on the OpenShift rproxy,
  # which this workflow does not deploy and must not be able to fail on.
  API_BASE_URL: https://demi-api-fc-prod.azurewebsites.net

jobs:
  deploy-extractor:
    name: Deploy extractor (Azure Function App)
    runs-on: ubuntu-latest
    environment: prod
    timeout-minutes: 25
    env:
      AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
    steps:
      # Format first, because it decides what gets checked out below. The environment's tag policy
      # already refuses anything that is not `v*`; this says WHICH shape of `v*` is a release.
      - name: Validate version format
        # Through the environment, never interpolated into the script body: `${{ inputs.version }}`
        # is substituted before bash starts, so the regex would validate a string already run as shell.
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          VERSION="$INPUT_VERSION"
          if [[ ! $VERSION =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "❌ Version must be in the format v1.2.3, got '$VERSION'"
            exit 1
          fi

      # `ref:` is the whole point: without it the checkout is the branch the dispatch was fired from
      # and the job ships `main` while claiming to deploy a tag. Depth 0 for `git describe --tags`.
      - name: Checkout the tag
        uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ inputs.version }}
          fetch-depth: 0

      - name: Azure Login
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      # No extractor in prod yet, so "absent" skips and lets the API job behind `needs:` run. Only
      # ResourceNotFound or AuthorizationFailed means absent: the deploy identity's Website
      # Contributor role is granted per site by hand when a site is created, so a site that was
      # never created answers Forbidden, not NotFound. Any other error must still stop the release.
      - name: Does the extractor exist yet?
        id: probe
        run: |
          set -uo pipefail
          if err=$(az functionapp show -g "$AZURE_RESOURCE_GROUP" -n "$EXTRACTOR_APP_NAME" \
                     --query name -o tsv 2>&1 >/dev/null); then
            echo "found=true" >> "$GITHUB_OUTPUT"
          elif [[ "$err" == *ResourceNotFound* || "$err" == *AuthorizationFailed* ]]; then
            echo "found=false" >> "$GITHUB_OUTPUT"
            echo "⏭️ $EXTRACTOR_APP_NAME not present — skipping the extractor deploy." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::error::az functionapp show failed for $EXTRACTOR_APP_NAME: $err"
            exit 1
          fi

      # Zipped AT THE ROOT, and nothing else: `test_extract.py` and `__pycache__` are developer
      # files the remote build would carry into the app.
      - name: Package the extractor
        if: steps.probe.outputs.found == 'true'
        run: |
          cd extractor
          zip -r /tmp/extractor.zip function_app.py extract.py ocr.py requirements.txt host.json
          unzip -l /tmp/extractor.zip

      # `config-zip`, not `scripts/deploy-azure.sh`: a Flex app has no Kudu wwwroot, and the remote
      # build is what installs pypdfium2 and rapidocr-onnxruntime from `requirements.txt`.
      - name: Deploy the extractor
        if: steps.probe.outputs.found == 'true'
        run: |
          az functionapp deployment source config-zip \
            -g "$AZURE_RESOURCE_GROUP" \
            -n "$EXTRACTOR_APP_NAME" \
            --src /tmp/extractor.zip

      # A missing `extensionBundle` in host.json loads the app happily and never registers
      # `queueTrigger`, which is indistinguishable from "no documents arrived".
      - name: Verify the queue trigger is registered
        if: steps.probe.outputs.found == 'true'
        run: ./scripts/wait-for-function.sh "$AZURE_RESOURCE_GROUP" "$EXTRACTOR_APP_NAME" extract_document

      - name: Report extractor failure to job summary
        if: failure()
        run: |
          echo "### ❌ Extractor deployment failed" >> $GITHUB_STEP_SUMMARY
          echo "Check the step logs above for packaging, zipdeploy or trigger-registration errors." >> $GITHUB_STEP_SUMMARY

  # The index definitions of the tag ABOUT TO SHIP, asked of the app that is ALREADY SERVING. That
  # pairing is the whole gate: v0.77.2 selected `fileSize`, the live `documents` index did not have
  # it, and every Document query answered 502 for 65 minutes (2026-09-08) behind a green deploy.
  # Live indexes are widened by hand (`scripts/demi-devbox.sh apply --env prod`) because no CI
  # identity holds Search Service Contributor, so this checks rather than fixes.
  verify-search-schema:
    name: Verify the live search indexes fit this tag
    runs-on: ubuntu-latest
    # Behind the same approval as the deploys: it reads production, and only matters for a release
    # somebody has decided to ship.
    environment: prod
    timeout-minutes: 10
    steps:
      - name: Validate version format
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          VERSION="$INPUT_VERSION"
          if [[ ! $VERSION =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "❌ Version must be in the format v1.2.3, got '$VERSION'"
            exit 1
          fi

      # The TAG's index definitions, not main's. No fetch-depth: nothing here reads history.
      - name: Checkout the tag
        uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ inputs.version }}

      # No setup-node and no install: the probe reads JSON and curls, on the runner's own node.
      # The dispatch input is the only way a 404 passes, and it has to be ticked per run: a 404 on
      # any other release means the deployed app has no route and nothing checked the live indexes.
      - name: Probe the live indexes with this tag's index definitions
        env:
          SEARCH_SCHEMA_ALLOW_MISSING: ${{ inputs.allow_missing_schema_probe && '1' || '0' }}
        run: ./scripts/search-schema-probe.sh "$API_BASE_URL"

      - name: Report the failed gate to the job summary
        if: failure()
        run: |
          {
            echo "### ❌ The live search indexes were not proved to fit \`${{ inputs.version }}\`"
            echo ""
            echo "**If the step log shows drift (503):** deploying would 502 every affected query."
            echo "Widen the live indexes first, then re-run this workflow:"
            echo ""
            echo '```'
            echo "scripts/demi-devbox.sh apply --env prod"
            echo '```'
            echo ""
            echo "The missing field names are in the step log above."
            echo ""
            echo "**If the step log shows a 404:** the app serving production has no"
            echo "\`/health/search-schema\`. On the first release after that endpoint ships, re-run"
            echo "with **allow_missing_schema_probe** ticked — once. Any other time it means the"
            echo "deployed app lost the route, and no release should go out unchecked."
            echo ""
            echo "Runbook: \`eagle-demi.wiki/Runbook-Search-Outage.md\`."
          } >> "$GITHUB_STEP_SUMMARY"

  deploy-api:
    name: Build & Deploy API (Azure Function App)
    runs-on: ubuntu-latest
    # Ordered, not concurrent: all three jobs sit behind the same approval, the API must not serve
    # traffic while the extractor it feeds is still going up, and it must not ship selects the live
    # indexes cannot answer.
    needs: [deploy-extractor, verify-search-schema]
    environment: prod
    timeout-minutes: 30
    outputs:
      # Read by the rollback job. A failure BEFORE the app was published — packaging, zipdeploy —
      # leaves this unset, and rolling back a deploy that never landed would be a pointless deploy.
      smoke-failed: ${{ steps.smoke.outputs.failed }}
    env:
      AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
    steps:
      - name: Validate version format
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          VERSION="$INPUT_VERSION"
          if [[ ! $VERSION =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "❌ Version must be in the format v1.2.3, got '$VERSION'"
            exit 1
          fi

      - name: Checkout the tag
        uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ inputs.version }}
          fetch-depth: 0

      # Install, package, publish, wait. Shared with the rollback job below so the two cannot drift.
      - name: Deploy the API
        uses: ./.github/actions/deploy-api-flex
        with:
          resource-group: ${{ env.AZURE_RESOURCE_GROUP }}
          app-name: ${{ env.API_FLEX_APP_NAME }}
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      # Registered and started is not the same fact as answering. Three real queries, because the
      # 2026-09-08 outage had a healthy `/health` throughout.
      - name: Smoke test production search
        id: smoke
        env:
          # Empty falls back to the id documented in the script.
          SMOKE_PROJECT_ID: ${{ vars.SEARCH_SMOKE_PROJECT_ID }}
        run: |
          set -uo pipefail
          if ! ./scripts/search-smoke.sh "$API_BASE_URL" "$SMOKE_PROJECT_ID"; then
            # Recorded BEFORE failing: the rollback job keys off this output.
            echo "failed=true" >> "$GITHUB_OUTPUT"
            exit 1
          fi

      - name: Report API failure to job summary
        if: failure()
        run: |
          echo "### ❌ API deployment failed" >> $GITHUB_STEP_SUMMARY
          echo "Check step logs above for details on packaging or Azure Function App deployment errors." >> $GITHUB_STEP_SUMMARY

  # Only when the deployed build answered badly — not on a packaging or upload failure, which never
  # changed what production is serving.
  rollback:
    name: Roll back to the previous release
    runs-on: ubuntu-latest
    needs: deploy-api
    if: failure() && needs.deploy-api.outputs.smoke-failed == 'true'
    environment: prod
    timeout-minutes: 30
    env:
      AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
    steps:
      # The newest published release that is not the one just deployed. Drafts are excluded because
      # every push to main cuts one and none of them has ever been in production.
      - name: Find the release production was on
        id: previous
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ inputs.version }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          PREVIOUS=$(gh release list --repo "$REPO" --limit 50 --exclude-drafts \
            --json tagName,createdAt \
            | jq -r --arg current "$VERSION" \
                '[.[] | select(.tagName != $current)] | sort_by(.createdAt) | reverse
                 | .[0].tagName // empty')
          if [[ ! $PREVIOUS =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::no published release to roll back to (found '$PREVIOUS') — redeploy by hand"
            exit 1
          fi
          echo "previous=$PREVIOUS" >> "$GITHUB_OUTPUT"
          echo "Rolling production back to $PREVIOUS"

      - name: Checkout the previous release
        uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ steps.previous.outputs.previous }}
          fetch-depth: 0

      - name: Deploy the API
        uses: ./.github/actions/deploy-api-flex
        with:
          resource-group: ${{ env.AZURE_RESOURCE_GROUP }}
          app-name: ${{ env.API_FLEX_APP_NAME }}
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      # The rollback is a claim until search answers. A failure here means production is down on
      # BOTH versions and the cause is not the application build.
      - name: Smoke test production search
        env:
          SMOKE_PROJECT_ID: ${{ vars.SEARCH_SMOKE_PROJECT_ID }}
        run: ./scripts/search-smoke.sh "$API_BASE_URL" "$SMOKE_PROJECT_ID"

      # The run is already red — deploy-api failed. This says what production is now running, which
      # is the fact the person reading the failure needs first.
      - name: Report the rollback to the job summary
        if: always()
        run: |
          {
            echo "### ↩️ \`${{ inputs.version }}\` failed its search smoke test"
            echo ""
            if [ "${{ job.status }}" = "success" ]; then
              echo "Production was rolled back to \`${{ steps.previous.outputs.previous }}\` and answers search."
            else
              echo "**The rollback did not complete — production may be serving \`${{ inputs.version }}\`.**"
            fi
            echo ""
            echo "The release for \`${{ inputs.version }}\` was NOT published. Runbook:"
            echo "\`eagle-demi.wiki/Runbook-Search-Outage.md\`."
          } >> "$GITHUB_STEP_SUMMARY"

  publish-release:
    name: Publish the release
    runs-on: ubuntu-latest
    # LAST, and only on a fully successful deploy: a job with `needs` runs only when every one of
    # them succeeded. Add a deploy job above and it belongs in this list too.
    needs: [deploy-extractor, deploy-api]
    timeout-minutes: 5
    # Job-level permissions REPLACE the workflow-level block, which is what keeps `contents: read`
    # on the deploy jobs. No environment: a second approval gate here would gate only bookkeeping.
    permissions:
      contents: write
    steps:
      # `--latest` answers "what is in prod", not "what is the highest number", so a rollback moves
      # it backwards. The `else` branch is that rollback path: an older tag's draft is already gone.
      - name: Publish the release for this version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ inputs.version }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if gh release view "$VERSION" --repo "$REPO" >/dev/null 2>&1; then
            gh release edit "$VERSION" --draft=false --latest --repo "$REPO"
          else
            echo "No release exists for $VERSION — creating a published one (rollback path)."
            gh release create "$VERSION" --generate-notes --latest --repo "$REPO"
          fi
          {
            echo "### 🚀 \`$VERSION\` is in production"
            echo ""
            echo "Its GitHub release is now published and marked latest."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Report publish failure to job summary
        if: failure()
        run: |
          echo "### ⚠️ Deploy succeeded, publishing the release did not" >> $GITHUB_STEP_SUMMARY
          echo "The version IS deployed. Only the GitHub release record is stale — publish it by hand." >> $GITHUB_STEP_SUMMARY
