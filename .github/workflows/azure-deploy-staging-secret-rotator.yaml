# Deploy the Key Vault secret rotator to the nonprod Flex Consumption app. Application only, same as
# the secret sync workflow; infrastructure comes from scripts/deploy-infra.sh.

name: Deploy DEMI secret rotator to Azure staging

on:
  push:
    branches:
      - main
    paths:
      - 'src/secret-rotator/**'
      # The files scripts/package-secret-sync.sh copies in beside src/secret-rotator.
      - 'src/secret-sync/logger.js'
      - 'src/utils/azure-credential.js'
      - 'scripts/package-secret-sync.sh'
      - '.github/workflows/azure-deploy-staging-secret-rotator.yaml'
  workflow_dispatch:

concurrency:
  group: deploy-azure-staging-secret-rotator
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read

env:
  SECRET_ROTATOR_APP_NAME: demi-secret-rotator-test

jobs:
  deploy-secret-rotator:
    name: Build & Deploy secret rotator (Azure Function App)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # The environment sets the OIDC subject to `...:environment:test`, which `gh-env-test` on demi-cicd-test matches.
    environment: test
    env:
      AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Azure Login
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      # No existence probe: a missing app must fail loudly, not skip.
      - name: Deploy the secret rotator to the Flex app
        run: |
          set -euo pipefail
          ./scripts/package-secret-sync.sh . /tmp/secret-rotator.zip secret-rotator
          az functionapp deployment source config-zip \
            -g "$AZURE_RESOURCE_GROUP" \
            -n "$SECRET_ROTATOR_APP_NAME" \
            --src /tmp/secret-rotator.zip

      # A host that registers nothing loads happily, and then no secret is ever rotated or renewed.
      - name: Verify the hourly timer is registered
        run: ./scripts/wait-for-function.sh "$AZURE_RESOURCE_GROUP" "$SECRET_ROTATOR_APP_NAME" secretRotatorHourly

      - name: Report failure to job summary
        if: failure()
        run: |
          echo "### ❌ Secret rotator deployment failed" >> $GITHUB_STEP_SUMMARY
          echo "Check the step logs above for packaging, zipdeploy or timer-registration errors." >> $GITHUB_STEP_SUMMARY
