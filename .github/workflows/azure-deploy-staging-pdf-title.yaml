# Deploy the PDF title worker to the nonprod Flex Consumption app. Application only, same as the
# API workflow: the CI identity holds Website Contributor on the app and cannot run an ARM
# deployment. Infrastructure comes from scripts/deploy-infra.sh with deployPdfTitleWorker = true.

name: Deploy DEMI PDF title worker to Azure staging

on:
  push:
    branches:
      - main
    paths:
      - 'pdf-title/**'
      - '!pdf-title/test_*.py'
      - 'scripts/package-pdf-title.sh'
      - '.github/workflows/azure-deploy-staging-pdf-title.yaml'
  workflow_dispatch:

concurrency:
  group: deploy-azure-staging-pdf-title
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read

env:
  PDF_TITLE_APP_NAME: demi-pdf-title-test

jobs:
  deploy-pdf-title:
    name: Build & Deploy PDF title worker (Azure Function App)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Declaring an environment CHANGES THE OIDC SUBJECT CLAIM to
    # `repo:digitalspace/eagle-demi:environment:test`; only `gh-env-test` on demi-cicd-test matches it.
    environment: test
    env:
      AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Azure Login
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Does the PDF title app exist yet?
        id: probe
        run: |
          ./scripts/probe-function-app.sh "$AZURE_RESOURCE_GROUP" "$PDF_TITLE_APP_NAME" \
            "Deploy the test bicep with deployPdfTitleWorker = true first."

      # `config-zip`: a Flex app has no Kudu wwwroot to POST a zip into, and the remote build is what
      # installs `requirements.txt`.
      - name: Deploy the PDF title worker to the Flex app
        if: steps.probe.outputs.found == 'true'
        run: |
          set -euo pipefail
          ./scripts/package-pdf-title.sh . /tmp/pdf-title.zip
          az functionapp deployment source config-zip \
            -g "$AZURE_RESOURCE_GROUP" \
            -n "$PDF_TITLE_APP_NAME" \
            --src /tmp/pdf-title.zip

      # A host that registers nothing loads happily, and a timer that never fires looks the same as
      # "no untitled PDFs left".
      - name: Verify the timer is registered
        if: steps.probe.outputs.found == 'true'
        run: ./scripts/wait-for-function.sh "$AZURE_RESOURCE_GROUP" "$PDF_TITLE_APP_NAME" pdf_title_run

      - name: Report failure to job summary
        if: failure()
        run: |
          echo "### ❌ PDF title worker deployment failed" >> $GITHUB_STEP_SUMMARY
          echo "Check the step logs above for the existence probe, packaging, zipdeploy or timer-registration errors." >> $GITHUB_STEP_SUMMARY
