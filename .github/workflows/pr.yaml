# Lint, test and build both apps, and compile the Bicep templates, on every pull request.
# Why the Bicep gate lives here rather than in a deploy workflow: wiki CI-Workflows.

name: PR Validation

on:
  pull_request:
    branches:
      - main

concurrency:
  group: pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

# Every job here only reads the checkout. Without this block the token gets the repository default,
# which is broader, and Dependabot's read-only PRs would stop matching.
permissions:
  contents: read

jobs:
  test-api:
    name: Test & Lint API
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      # Before setup-node: its Yarn 4 cache detection reads the corepack shim (actions/setup-node#1027).
      - name: Enable Corepack
        run: corepack enable

      # 22, the Flex host's runtime (azure/modules/api-function-flex.bicep) and what both API deploy
      # jobs run. Testing on a version prod does not serve proves the wrong thing.
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'yarn'

      - name: Install dependencies
        run: yarn install --immutable

      - name: Lint API
        run: yarn lint

      - name: Run API tests
        run: yarn test

      # The extractor is Python in a Node repo, so `yarn test` cannot see it. Its suite checks
      # `decide()` against extraction-host/worker.py over 3,000 generated inputs.
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      # `extract.py` imports requests at module load, so the selftest dies on the import without it.
      # Pinned: an unpinned install makes the gate depend on whatever PyPI published this morning.
      - name: Install extractor test dependencies
        run: pip install requests==2.34.2

      - name: Run extractor tests
        run: python3 extractor/test_extract.py

  test-frontend:
    name: Test & Build Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      # Before setup-node: its Yarn 4 cache detection reads the corepack shim (actions/setup-node#1027).
      - name: Enable Corepack
        run: corepack enable

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'yarn'
          cache-dependency-path: frontend/yarn.lock

      - name: Install frontend dependencies
        run: yarn --cwd frontend install --immutable

      - name: Lint Frontend
        run: yarn --cwd frontend lint

      # This job ran no tests until 2026-08-07, which is how PR #70 bumped jasmine-core across a
      # major and merged green with its 44 specs never executed. `--no-watch` or `ng test` never exits.
      - name: Test Frontend
        run: yarn --cwd frontend test --no-watch

      - name: Build Frontend
        run: yarn --cwd frontend build

  validate-bicep:
    name: Validate Bicep Template
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # The param files read these with NO default (BCP427), and THE MISSING DEFAULTS ARE THE SAFETY
    # PROPERTY: a `''` fallback overwrote live credentials on 2026-08-13. Placeholders reach nothing.
    env:
      MINIO_ACCESS_KEY: ci-placeholder-not-a-real-key
      MINIO_SECRET_KEY: ci-placeholder-not-a-real-key
      ADMIN_API_KEY: ci-placeholder-not-a-real-key
      DOCLING_API_KEY: ci-placeholder-not-a-real-key
      TRACK_CLIENT_SECRET: ci-placeholder-not-a-real-key
      ROLE_SYNC_CLIENT_SECRET: ci-placeholder-not-a-real-key
      DEVBOX_SSH_PUBLIC_KEY: ci-placeholder-not-a-real-key
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      # No Azure login: `az bicep build` compiles locally. Keeping it loginless makes deploying from
      # this workflow impossible rather than merely unauthenticated.
      - name: Validate Bicep Template
        run: az bicep build --file ./azure/main.bicep

      # extractor.bicep is deliberately NOT wired into main.bicep — it is deployed on its own, so
      # compiling main.bicep alone would let a broken template reach a hand-run production deploy.
      - name: Validate Extractor Module
        run: az bicep build --file ./azure/modules/extractor.bicep

      # The param files are where the subnet ids, object-store coordinates and CORS origins live,
      # and none of it is covered by compiling main.bicep.
      - name: Validate Test Parameters
        run: az bicep build-params --file ./azure/main.test.bicepparam --outfile /dev/null

      - name: Validate Prod Parameters
        run: az bicep build-params --file ./azure/main.prod.bicepparam --outfile /dev/null

      - name: Report Validation Failure to Job Summary
        if: failure()
        run: |
          echo "### ❌ Bicep template failed to compile" >> $GITHUB_STEP_SUMMARY
          echo "Fix \`azure/main.bicep\`, \`azure/modules/extractor.bicep\`, \`azure/main.test.bicepparam\` or \`azure/main.prod.bicepparam\`." >> $GITHUB_STEP_SUMMARY
