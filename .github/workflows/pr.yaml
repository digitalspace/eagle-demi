# =============================================================================
# PR Validation
# =============================================================================
# Runs linting, tests, and builds for API and Frontend on pull requests, and
# compiles the Bicep template.
#
# `validate-bicep` moved here from the dev deploy workflow on 2026-08-05, where it
# gated both app deploys. That was backwards: dev deploys no infrastructure at all,
# so a template that will not compile has no bearing on whether a zipdeploy should
# run. It does have a bearing on whether a pull request is mergeable.
# =============================================================================

name: PR Validation

on:
  pull_request:
    branches:
      - main

concurrency:
  group: pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  test-api:
    name: Test & Lint API
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: yarn install --immutable

      - name: Lint API
        run: yarn lint

      - name: Run API tests
        run: yarn test

  test-frontend:
    name: Test & Build Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Enable Corepack
        run: corepack enable

      - name: Install frontend dependencies
        run: yarn --cwd frontend install --immutable

      - name: Lint Frontend
        run: yarn --cwd frontend lint

      - name: Build Frontend
        run: yarn --cwd frontend build

  validate-bicep:
    name: Validate Bicep Template
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      # No Azure login: `az bicep build` compiles locally, and `ubuntu-latest` ships az.
      # Keeping it loginless is deliberate — it makes deploying from this workflow
      # impossible rather than merely unauthenticated.
      - name: Validate Bicep Template
        run: az bicep build --file ./azure/main.bicep

      - name: Report Validation Failure to Job Summary
        if: failure()
        run: |
          echo "### ❌ Bicep template failed to compile" >> $GITHUB_STEP_SUMMARY
          echo "Fix \`azure/main.bicep\`." >> $GITHUB_STEP_SUMMARY
