# =============================================================================
# PR Validation
# =============================================================================
# Runs linting, tests, and builds for API and Frontend on pull requests, and
# compiles the Bicep template.
#
# `validate-bicep` moved here from the dev deploy workflow on 2026-08-05, where it
# gated both app deploys. That was backwards: dev deploys no infrastructure at all,
# so a template that will not compile has no bearing on whether a zipdeploy should
# run. It does have a bearing on whether a pull request is mergeable.
# =============================================================================

name: PR Validation

on:
  pull_request:
    branches:
      - main

concurrency:
  group: pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

# Every job here only reads the checkout — none comment, label or push. Without this
# block the GITHUB_TOKEN gets the repository default, which is broader; CodeQL flags
# it as `actions/missing-workflow-permissions`. It also keeps Dependabot's PRs working,
# since those already run with a read-only token.
permissions:
  contents: read

jobs:
  test-api:
    name: Test & Lint API
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: yarn install --immutable

      - name: Lint API
        run: yarn lint

      - name: Run API tests
        run: yarn test

      # The extractor is Python in a Node repo, so `yarn test` cannot see it. Its own suite checks
      # `decide()` against extraction-host/worker.py over 3,000 generated inputs — the parity that
      # keeps net-new chunks landing on the same boundaries as the migrated corpus.
      #
      # Both steps below are load-bearing. ubuntu-latest ships a python3 but which one drifts with
      # the image, and `extract.py` imports `requests` at module load — without it the selftest dies
      # on the import, before it has asserted anything.
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Install extractor test dependencies
        run: pip install requests

      - name: Run extractor tests
        run: python3 extractor/test_extract.py

  test-frontend:
    name: Test & Build Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Enable Corepack
        run: corepack enable

      - name: Install frontend dependencies
        run: yarn --cwd frontend install --immutable

      - name: Lint Frontend
        run: yarn --cwd frontend lint

      # This job ran lint and build and no tests until 2026-08-07, which is how PR #70 bumped
      # jasmine-core across a MAJOR (5.6 → 6.3) and merged green with its 44 specs never executed.
      # They were run by hand afterwards and passed — luck, not a gate.
      # `--no-watch` because `ng test` otherwise waits for file changes and never exits. No
      # `--browsers` flag: karma.conf.js already defaults to the sandbox-less ChromeNoSandbox
      # launcher, which is what a runner needs.
      - name: Test Frontend
        run: yarn --cwd frontend test --no-watch

      - name: Build Frontend
        run: yarn --cwd frontend build

  validate-bicep:
    name: Validate Bicep Template
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      # No Azure login: `az bicep build` compiles locally, and `ubuntu-latest` ships az.
      # Keeping it loginless is deliberate — it makes deploying from this workflow
      # impossible rather than merely unauthenticated.
      - name: Validate Bicep Template
        run: az bicep build --file ./azure/main.bicep

      # extractor.bicep is deliberately NOT wired into main.bicep — it is deployed on its own into
      # the target resource group — so compiling main.bicep alone would let a broken template reach
      # a hand-run production deploy unchallenged.
      - name: Validate Extractor Module
        run: az bicep build --file ./azure/modules/extractor.bicep

      - name: Report Validation Failure to Job Summary
        if: failure()
        run: |
          echo "### ❌ Bicep template failed to compile" >> $GITHUB_STEP_SUMMARY
          echo "Fix \`azure/main.bicep\`." >> $GITHUB_STEP_SUMMARY
