# Lint, test and build both apps, and compile the Bicep templates, on every pull request.
# Why the Bicep gate lives here rather than in a deploy workflow: wiki CI-Workflows.

name: PR Validation

on:
  pull_request:
    branches:
      - main

concurrency:
  group: pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

# Every job here only reads the checkout. Without this block the token gets the repository default,
# which is broader, and Dependabot's read-only PRs would stop matching.
permissions:
  contents: read

jobs:
  test-api:
    name: Test & Lint API
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      # Before setup-node: its Yarn 4 cache detection reads the corepack shim (actions/setup-node#1027).
      - name: Enable Corepack
        run: corepack enable

      # 22, the Flex host's runtime (azure/modules/api-function-flex.bicep) and what both API deploy
      # jobs run. Testing on a version prod does not serve proves the wrong thing.
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'yarn'

      - name: Install dependencies
        run: yarn install --immutable

      - name: Lint API
        run: yarn lint

      - name: Run API tests
        run: yarn test

      # The extractor is Python in a Node repo, so `yarn test` cannot see it. Its suite checks
      # `decide()` against extraction-host/worker.py over 3,000 generated inputs.
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      # `extract.py` imports requests at module load, so the selftest dies on the import without it.
      # Pinned: an unpinned install makes the gate depend on whatever PyPI published this morning.
      - name: Install extractor test dependencies
        run: pip install requests==2.34.2

      - name: Run extractor tests
        run: python3 extractor/test_extract.py

  test-frontend:
    name: Test & Build Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      # Before setup-node: its Yarn 4 cache detection reads the corepack shim (actions/setup-node#1027).
      - name: Enable Corepack
        run: corepack enable

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'yarn'
          cache-dependency-path: frontend/yarn.lock

      - name: Install frontend dependencies
        run: yarn --cwd frontend install --immutable

      - name: Lint Frontend
        run: yarn --cwd frontend lint

      - name: Test Frontend
        run: yarn --cwd frontend test

      - name: Build Frontend
        run: yarn --cwd frontend build

      # The app never imports Playwright, so it lives outside frontend/ and the smoke finds it through
      # PLAYWRIGHT_MODULE. Pinned so the gate does not move with each npm release.
      - name: Install Playwright Chromium
        run: |
          npm install --prefix "$RUNNER_TEMP/pw" --no-save --no-package-lock playwright@1.63.0
          "$RUNNER_TEMP/pw/node_modules/.bin/playwright" install --with-deps --only-shell chromium

      - name: Smoke test the build
        working-directory: frontend
        run: |
          yarn preview --host 127.0.0.1 --port 4173 --strictPort &
          server=$!
          trap 'kill "$server"' EXIT
          timeout 60 bash -c 'until curl -sf -o /dev/null http://127.0.0.1:4173/; do sleep 1; done'
          PLAYWRIGHT_MODULE="$RUNNER_TEMP/pw/node_modules/playwright/index.mjs" \
            node scripts/e2e-smoke.mjs --base http://127.0.0.1:4173

  # A schema-touching PR is the only kind that can take production search down (2026-09-08), and it
  # takes it down at DEPLOY time, long after review. Nothing in the other jobs can see it: they test
  # the code against the committed JSON, and both sides of that comparison move in the same PR.
  search-schema-change:
    name: Search Schema Change
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # The staging app (azure-deploy-staging-api.yaml). Anonymous endpoint, no secret, so this job
      # works on a fork PR too.
      TEST_API_BASE_URL: https://demi-api-fc-test.azurewebsites.net
      DEMI_ENV: test
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          # 0 so the base branch is fetched as well: the diff below is against origin/<base>.
          fetch-depth: 0

      # Two shapes count. `azure/search/**` is the index definition itself; the `*_SELECT` constants
      # in ai-search.js are the code asking for fields. Either one alone breaks the pair.
      - name: Does this PR change what search selects?
        id: touched
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          CHANGED=$(git diff --name-only "origin/$BASE_REF...HEAD")
          echo "$CHANGED"
          TOUCHED=false
          if grep '^azure/search/' <<<"$CHANGED" | grep -qvE '\.md$'; then
            TOUCHED=true
          fi
          # Values, not diff lines: the constants are multi-line concatenations, so a widening
          # lands on a continuation line that carries no `_SELECT` token.
          #
          # Captured on its own line: `set -e` does not fire on a command substitution inside an
          # `if` condition, so a broken script would read as "schema untouched" and pass the gate.
          SELECT_CHANGED=$(./scripts/search-select-changed.sh "origin/$BASE_REF")
          if [ "$SELECT_CHANGED" = changed ]; then
            TOUCHED=true
          fi
          echo "touched=$TOUCHED" >> "$GITHUB_OUTPUT"
          echo "search schema touched: $TOUCHED"

      # Against TEST, with the branch's own index definitions: test is where the author widens the
      # live index first, and this is the proof they did.
      #
      # SEARCH_SCHEMA_ALLOW_MISSING is deliberately unset here. The test app has the endpoint once
      # main with #349 is deployed to test; a 404 there after that is a regression, not a bootstrap.
      - name: Probe the test indexes with this branch's index definitions
        if: steps.touched.outputs.touched == 'true'
        run: ./scripts/search-schema-probe.sh "$TEST_API_BASE_URL"

      # Read through the environment, never interpolated into the script body: a PR body is
      # attacker-controlled text.
      - name: Require the PR to record that test was widened
        if: steps.touched.outputs.touched == 'true'
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          set -euo pipefail
          if ! grep -qiE '^[[:space:]]*Search-Schema:[[:space:]]*applied test' <<<"${PR_BODY:-}"; then
            echo "::error::This PR changes the search schema. Apply the index definitions to test" \
                 "(scripts/demi-devbox.sh apply --env test), then add a line to the PR description:" \
                 "Search-Schema: applied test"
            exit 1
          fi

      - name: Report the search schema failure to job summary
        if: failure()
        run: |
          {
            echo "### ❌ Search schema gate"
            echo ""
            echo "This PR changes \`azure/search/**\`, or the fields a \`*_SELECT\` in"
            echo "\`src/search/ai-search.js\` asks for."
            echo "Widen the live TEST indexes before merging:"
            echo ""
            echo '```'
            echo "scripts/demi-devbox.sh apply --env test"
            echo '```'
            echo ""
            echo "Then add \`Search-Schema: applied test\` to the PR description."
            echo "Production is widened by hand at release time — see \`docs/ci-search-guards.md\`."
          } >> "$GITHUB_STEP_SUMMARY"

  validate-bicep:
    name: Validate Bicep Template
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # The one parameter the param files still read from the environment with NO default (BCP427),
    # and the missing default IS the safety property: a `''` fallback overwrote live credentials on
    # 2026-08-13. It is a public key, not a credential, and this placeholder reaches nothing. Every
    # credential moved to demi-kv-<env> and reaches the app as a Key Vault reference instead.
    env:
      DEVBOX_SSH_PUBLIC_KEY: ci-placeholder-not-a-real-key
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      # No Azure login: `az bicep build` compiles locally. Keeping it loginless makes deploying from
      # this workflow impossible rather than merely unauthenticated.
      - name: Validate Bicep Template
        run: az bicep build --file ./azure/main.bicep

      # extractor.bicep is deliberately NOT wired into main.bicep — it is deployed on its own, so
      # compiling main.bicep alone would let a broken template reach a hand-run production deploy.
      - name: Validate Extractor Module
        run: az bicep build --file ./azure/modules/extractor.bicep

      # The param files are where the subnet ids, object-store coordinates and CORS origins live,
      # and none of it is covered by compiling main.bicep.
      - name: Validate Test Parameters
        run: az bicep build-params --file ./azure/main.test.bicepparam --outfile /dev/null

      - name: Validate Prod Parameters
        run: az bicep build-params --file ./azure/main.prod.bicepparam --outfile /dev/null

      - name: Report Validation Failure to Job Summary
        if: failure()
        run: |
          echo "### ❌ Bicep template failed to compile" >> $GITHUB_STEP_SUMMARY
          echo "Fix \`azure/main.bicep\`, \`azure/modules/extractor.bicep\`, \`azure/main.test.bicepparam\` or \`azure/main.prod.bicepparam\`." >> $GITHUB_STEP_SUMMARY
