# =============================================================================
# Rolling draft release
# =============================================================================
# Maintains exactly ONE draft GitHub release, whose tag name is the next semantic
# version computed from conventional-commit history since the last published release.
#
# The whole model hangs on one property: a DRAFT release mints no git tag. So this
# workflow can run on every push to `main` — retargeting and regenerating the draft
# each time — without spending a version number or creating a ref. The draft simply
# accumulates notes across many staging deploys. When a human clicks Publish, GitHub
# creates the tag at that moment, and that tag is what a future prod workflow will
# deploy ("a tag verified on staging rather than a branch", README). Publishing is
# therefore the release gate; this workflow only keeps the candidate up to date.
#
# Consequence worth stating plainly: the draft body is REGENERATED on every push.
# `--generate-notes` overwrites whatever is there, so any hand-edit to the draft's
# notes is discarded by the next push to `main`. Edit the notes immediately before
# publishing, or not at all.
#
# Trigger is a plain `on: push`, deliberately NOT `workflow_run` chained off the two
# staging deploys. Chaining looked tempting — "only draft what actually deployed" —
# and fails three ways: the `frontend/public/assets/geojson/**` path fires BOTH deploy
# workflows, so two events would race for one draft; a `workflow_run` workflow is
# unreviewable before merge because it only ever runs from the default branch; and
# `actions/checkout` inside a `workflow_run` job defaults to the default-branch head
# rather than the triggering `head_sha`. `on: push` is one event, is testable via
# `workflow_dispatch`, and hands us `github.sha` directly.
#
# The accepted cost: a docs-only push, or a push whose staging deploy later fails,
# still refreshes the draft. That is harmless — no tag is minted and nothing that
# runs changes — and the human publish remains the real gate.
#
# This workflow touches no Azure credential, so it declares no `environment:`.
# Adding one would change nothing here except the OIDC subject claim, which nothing
# in this file uses.
# =============================================================================

name: Draft release

on:
  push:
    branches:
      - main
  workflow_dispatch:

# `cancel-in-progress: false`, and it matters more here than in the deploy workflows.
# The draft is maintained by delete-then-create; a cancellation landing between those
# two steps leaves NO draft at all until someone pushes again. GitHub queues at most
# one pending run per group and coalesces the rest, so nothing piles up.
concurrency:
  group: draft-release
  cancel-in-progress: false

# Releases are `contents`, not a separate scope — `contents: write` is enough to list,
# delete and create them, and is the whole of what this workflow needs.
permissions:
  contents: write

jobs:
  draft-release:
    name: Refresh rolling draft release
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Shallow (the default) on purpose. Do NOT "fix" this by adding `fetch-depth: 0`:
      # nothing here reads git history. `scripts/next-version.js` asks `gh` for the last
      # published release and for the commit range `<lastTag>...$GITHUB_SHA`, which is
      # ancestry-independent and is the same boundary GitHub itself uses to generate
      # release notes — so the computed version and the generated notes cannot disagree.
      # `git describe` was rejected for exactly the opposite reason: it walks HEAD's
      # ancestry only, so a tag on a non-ancestor commit silently yields an older base
      # and a wrong version.
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      # No `yarn install`: the script is plain node with no dependencies, and it reads
      # its inputs from the `gh` CLI that the runner already ships.
      #
      # Assigned to a variable first rather than interpolated straight into the `echo`.
      # `set -e` does not fire on a command substitution that is merely an argument —
      # `echo` still exits 0 — so a failing script would quietly publish an empty version
      # and surface as a baffling `gh release create` error two steps later.
      - name: Compute next version
        id: version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          version=$(node scripts/next-version.js)
          echo "version=$version" >> "$GITHUB_OUTPUT"

      # Ref-safe by construction: `gh release delete` without `--cleanup-tag` removes the
      # release record only. `--cleanup-tag` is the ONE flag that would also delete the
      # git ref — never add it here. A draft has no ref to clean up today, but a mistaken
      # match against a published release would then destroy a shipped tag.
      #
      # Scoped to `vX.Y.Z` tag names, which is the only shape this workflow ever creates.
      # Selecting every draft would take hand-authored ones with it — a maintainer drafting
      # prod notes or a security advisory in the UI would find them deleted by the next
      # push to `main`, and release deletion has no undo. The same filter drops the empty
      # tag name a draft saved without picking a tag emits, which would otherwise become a
      # `gh release delete ""` that can never succeed.
      #
      # No `|| true`. The race it would cover cannot happen: the `concurrency` group above
      # already serialises runs of this workflow. What it would actually absorb is a real
      # failure — a ruleset denial, a 5xx, a token scope change — after which the create
      # step adds a SECOND draft, the job still reports success, and every later push adds
      # another. A red job here is recovered by the next push, which is the same self-heal
      # the create step already relies on.
      - name: Delete existing draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh release list --limit 100 --json tagName,isDraft \
            --jq '.[] | select(.isDraft) | .tagName | select(test("^v[0-9]+\\.[0-9]+\\.[0-9]+$"))' \
          | while read -r t; do gh release delete "$t" --yes; done

      # `--target "$GITHUB_SHA"` — a SHA, never a branch name. A branch target resolves at
      # publish time, so a draft created today would tag whatever `main` happens to point
      # at whenever the human clicks Publish. Pinning the SHA is what makes the eventual
      # tag land on the commit these notes actually describe.
      #
      # ponytail: delete-and-recreate rather than updating in place. The ceiling is a
      # sub-second window with no draft if a run dies between the two steps, which
      # self-heals on the next push to `main`. If that window ever matters, the upgrade is
      # `gh release edit --tag/--target` on the existing draft, with the body fetched from
      # `POST /repos/{owner}/{repo}/releases/generate-notes`.
      - name: Create draft release
        id: create
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          url=$(gh release create "$VERSION" --draft --generate-notes --target "$GITHUB_SHA")
          echo "url=$url" >> "$GITHUB_OUTPUT"

      # The version is otherwise invisible without opening the Releases tab — nothing else
      # in this repo writes a job summary on success.
      - name: Report draft to job summary
        env:
          VERSION: ${{ steps.version.outputs.version }}
          URL: ${{ steps.create.outputs.url }}
        run: |
          set -euo pipefail
          {
            echo "### 📝 Draft release refreshed"
            echo ""
            echo "- Version: \`$VERSION\`"
            echo "- Draft: $URL"
            echo "- Target commit: \`$GITHUB_SHA\`"
            echo ""
            echo "No git tag exists yet. Publishing this draft is what creates it."
          } >> "$GITHUB_STEP_SUMMARY"
