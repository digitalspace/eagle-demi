# Every push to `main` mints a git tag and refreshes the single draft release for that candidate.
# Why the tag is cut at test time, and what it costs: wiki Release-Process.

name: Tag and draft release

on:
  push:
    branches:
      - main
  workflow_dispatch:

# A cancellation between the tag push and the draft create leaves a tag with no release. Both
# halves self-heal on the next push, and GitHub coalesces queued runs, so nothing piles up.
concurrency:
  group: draft-release
  cancel-in-progress: false

jobs:
  draft-release:
    name: Tag the commit and refresh the draft release
    # GUARDED AT JOB LEVEL: `workflow_dispatch` carries no branch restriction, and guarding the tag
    # step alone would still let the delete step remove the live candidate's draft.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Tags and releases are both `contents`, and this is the only job that writes either.
    permissions:
      contents: write
    steps:
      # Shallow on purpose: nothing here reads git history, and the tag points at a commit the
      # remote already has. The checkout's persisted credential authenticates the `git push` below.
      - name: Checkout repository
        uses: actions/checkout@v7

      # No setup-node and no install: the runner ships node and the script has no dependencies.
      # Assigned to a variable because `set -e` ignores a command substitution used as an argument.
      - name: Compute next version
        id: version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          version=$(node scripts/next-version.js)
          echo "version=$version" >> "$GITHUB_OUTPUT"

      # BEFORE the draft is touched: a tag push refused by a ruleset then fails with the previous
      # draft still standing. Annotated, so the tag records who cut it — hence the tagger identity.
      - name: Tag the commit
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git tag -a "$VERSION" -m "Release $VERSION"
          git push origin "$VERSION"

      # Never add `--cleanup-tag`: it deletes the git ref too, leaving prod nothing to roll back to.
      # Filtered to this workflow's own drafts — a hand-authored one must survive; deletion has no undo.
      - name: Delete existing draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          # `gh api`, not `gh release list`: the latter's --json has no author field.
          gh api "repos/$REPO/releases?per_page=100" \
            --jq '.[] | select(.draft and .author.login == "github-actions[bot]") | .tag_name
                  | select(test("^v[0-9]+\\.[0-9]+\\.[0-9]+$"))' \
          | while read -r t; do gh release delete "$t" --yes --repo "$REPO"; done

      # `--generate-notes` starts from the last PUBLISHED release, a wider range than the bump was
      # computed over: a candidate that never shipped still spent a version, and its work ships here.
      # ponytail: delete-and-recreate, ceiling is a sub-second window with no draft that self-heals.
      - name: Create draft release
        id: create
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          url=$(gh release create "$VERSION" --draft --generate-notes --target "$GITHUB_SHA")
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - name: Report the candidate to the job summary
        env:
          VERSION: ${{ steps.version.outputs.version }}
          URL: ${{ steps.create.outputs.url }}
        run: |
          set -euo pipefail
          {
            echo "### 🏷️ Release candidate \`$VERSION\`"
            echo ""
            echo "- Tag: \`$VERSION\` at \`$GITHUB_SHA\` — deployable now"
            echo "- Draft: $URL"
            echo ""
            echo "Deploy it with the **Deploy DEMI to Azure production** workflow, which publishes"
            echo "this draft once the deploy is green. Nothing else publishes it."
          } >> "$GITHUB_STEP_SUMMARY"
