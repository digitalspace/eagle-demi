# Two npm entries: the API and the frontend are separate Yarn 4 projects with
# their own lockfiles. `npm` is the Dependabot ecosystem for Yarn.

version: 2

updates:
  # The API — root package.json / yarn.lock. These ship: the package includes
  # node_modules, so a vulnerable dependency here reaches demi-api-dev.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    # Minor and patch PRs merge on their own, so give a bad release a week to be pulled first.
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    groups:
      # Minor and patch only: no test mounts the Express app or touches MinIO,
      # so green CI says little about a major. Majors arrive one per PR.
      api-dependencies:
        patterns:
          - '*'
        update-types:
          - minor
          - patch

  # Only `frontend/dist` is deployed, so most advisories here are a CI
  # supply-chain concern. The bundled runtime packages are the exception.
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    groups:
      # Same rule as the API group: React, Vite and TypeScript majors arrive one
      # per PR with their changelog.
      frontend-dependencies:
        patterns:
          - '*'
        update-types:
          - minor
          - patch

  # Keeps action versions current so jobs stay off deprecated Node runtimes.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns:
          - '*'
