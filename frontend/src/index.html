<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>DEMI</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/x-icon" href="favicon.ico">

  <!-- DevTools Extension Error Suppressor -->
  <script>
    if (typeof window !== 'undefined') {
      window.addEventListener('error', function(event) {
        if (event && event.message && (event.message.includes('Angular DevTools') || (event.filename && event.filename.includes('backend_bundle.js')))) {
          event.stopImmediatePropagation();
          event.preventDefault();
        }
      }, true);
    }
  </script>

  <!-- Standard config paradigm matching public/admin -->
  <script src="env.js"></script>
</head>
<body>
  <app-root></app-root>
</body>
</html>
