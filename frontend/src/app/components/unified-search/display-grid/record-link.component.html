<!-- One `<ng-content>` for the three branches: repeating it drops the projected nodes on every
     branch but the last, so a record with no link rendered as an empty cell. -->
<ng-template #body><ng-content /></ng-template>

@if (!href()) {
  <ng-container [ngTemplateOutlet]="body" />
} @else if (external()) {
  <a [class]="linkClass()" [href]="href()" [attr.title]="title()" target="_blank" rel="noopener noreferrer"><ng-container [ngTemplateOutlet]="body" /></a>
} @else {
  <a [class]="linkClass()" [routerLink]="href()" [attr.title]="title()"><ng-container [ngTemplateOutlet]="body" /></a>
}
