@for (column of columns(); track column.key) {
  <th scope="col" class="display-grid__head-cell" [class.display-grid__head-cell--sorted]="isActive(column)"
      [style.width]="column.width" [attr.aria-sort]="ariaSort(column)">
    @if (column.sortable !== false) {
      <button type="button" class="display-grid__sort" (click)="sorted.emit(column.key)">
        <span class="display-grid__sort-label">{{ column.label }}</span>
        <span class="display-grid__sort-arrow" aria-hidden="true">{{ arrow(column) }}</span>
      </button>
    } @else {
      <span class="display-grid__head-label">{{ column.label }}</span>
    }
  </th>
}
