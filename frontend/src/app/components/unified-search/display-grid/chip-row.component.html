@if (chips().length > 0) {
  <div class="display-grid__chips">
    <span class="display-grid__chips-label">Narrowed by</span>
    @for (chip of chips(); track chip.id + ':' + (chip.value ?? '')) {
      <button type="button" class="display-grid__chip" [attr.aria-label]="removeLabel(chip)" (click)="removed.emit(chip)">
        <span aria-hidden="true">
          @if (chip.value) {
            <span class="display-grid__chip-name">{{ chip.label }}:</span> {{ chip.value }}
          } @else {
            {{ chip.label }}
          }
        </span>
        <span aria-hidden="true" class="display-grid__chip-x">✕</span>
      </button>
    }
    <button type="button" class="display-grid__chips-clear" (click)="clearedAll.emit()">Clear all</button>
  </div>
}
